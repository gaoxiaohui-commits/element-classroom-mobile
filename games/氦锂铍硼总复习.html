<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
/* 离线版：补上发布平台原本提供的基础样式 */
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>氦锂铍硼大冒险</title>
<style>
:root {
  /* Layout: 小氦当向导。首页是她和七关冒险路线；每一关顶部是她的对话气泡，下面一块白色主面板，只放这一关要做的事。
     画面跟着小氦的水彩风格走，只做浅色一种主题。 */
  color-scheme: light;
  --bg: #EEF6F8;
  --surface: #FFFFFF;
  --soft: #E4F2F5;
  --ink: #1C3442;
  --muted: #5B7380;
  --line: #D6E6EB;
  --brand: #1A8DA2;
  --brand-ink: #0E6576;
  --brand-soft: #D8EFF3;
  --sun: #F0B232;
  --he: #DD6A2F;
  --li: #D23C66;
  --be: #357FC8;
  --b: #2A9658;
  --proton: #E0574B;
  --neutron: #9AAAB5;
  --good: #1B9466;
  --good-soft: #E3F5EC;
  --bad: #D44C40;
  --bad-soft: #FCEBE8;
  --team-a: #E0544C;
  --team-b: #3D6AD6;
  --shadow: 0 12px 30px -20px rgba(18, 74, 92, 0.45), 0 1px 2px rgba(18, 74, 92, 0.06);
  --r-lg: 20px;
  --r-md: 14px;
  --font-display: "ZCOOL KuaiLe", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
  --font-body: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", system-ui, -apple-system, sans-serif;
  --font-sym: "Fredoka", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
}

body {
  background:
    radial-gradient(1100px 520px at 88% -12%, #DCF0F5 0, rgba(220, 240, 245, 0) 62%),
    radial-gradient(900px 460px at -12% 8%, #E8F6EE 0, rgba(232, 246, 238, 0) 60%),
    var(--bg);
  background-attachment: fixed;
  color: var(--ink);
  font: 16px/1.65 var(--font-body);
}
*, *::before, *::after { box-sizing: border-box; }
button { font: inherit; color: inherit; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--be); outline-offset: 3px; }
h1, h2, h3, h4 { text-wrap: balance; }
img { display: block; }

.app {
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 64px;
}

/* ---------- 顶栏 ---------- */
.bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 14px 12px; }
.brand {
  display: flex; align-items: center; gap: 10px; padding: 2px 0;
  background: none; border: 0; cursor: pointer; font: 21px/1 var(--font-display); color: var(--ink);
}
.brand img { width: 38px; height: 38px; border-radius: 50%; object-fit: cover; background: var(--surface); box-shadow: 0 0 0 2px var(--surface), 0 4px 10px -6px rgba(18, 74, 92, 0.6); }
.tools { display: flex; align-items: center; gap: 8px; }
.star-pill {
  display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px;
  border-radius: 999px; background: var(--surface); box-shadow: var(--shadow);
  font: 600 16px var(--font-sym); font-variant-numeric: tabular-nums;
}
.star-pill b { color: var(--sun); }
.icon-btn {
  width: 40px; height: 40px; display: grid; place-items: center; cursor: pointer;
  border: 0; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); color: var(--ink);
}
.icon-btn:hover { color: var(--brand-ink); }

/* ---------- 元素颜色 ---------- */
.tile { --c: var(--muted); }
.c-He { --c: var(--he); }
.c-Li { --c: var(--li); }
.c-Be { --c: var(--be); }
.c-B  { --c: var(--b); }
.tcol { color: var(--c); }
.eicon { display: block; color: var(--c, var(--ink)); }

/* ---------- 通用 ---------- */
.panel { background: var(--surface); border-radius: var(--r-lg); box-shadow: var(--shadow); padding: clamp(16px, 3vw, 28px); }
.muted { color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 48px; padding: 0 24px; border: 0; border-radius: 999px;
  background: var(--brand-soft); color: var(--brand-ink); font-weight: 700; font-size: 16px; cursor: pointer;
  transition: transform 0.12s ease, background-color 0.12s ease;
}
.btn:hover { transform: translateY(-1px); background: #C6E7EE; }
.btn.primary { background: var(--brand); color: #FFFFFF; box-shadow: 0 10px 20px -12px var(--brand); }
.btn.primary:hover { background: var(--brand-ink); }
.btn.big { min-height: 56px; padding: 0 30px; font-size: 18px; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn:disabled { opacity: 0.45; cursor: default; transform: none; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.say {
  display: inline-flex; align-items: center; gap: 6px; padding: 5px 12px 5px 10px; cursor: pointer;
  border: 0; border-radius: 999px; background: var(--brand-soft); color: var(--brand-ink); font-size: 14px; font-weight: 600;
}
.say svg { width: 16px; height: 16px; }
.stars { display: inline-flex; gap: 2px; }
.stars span { color: #D5E2E7; }
.stars span.on { color: var(--sun); }
.stars.sm { font-size: 15px; }
.stars.big { gap: 6px; font-size: 48px; line-height: 1; }
kbd {
  font: 600 13px var(--font-sym); padding: 1px 7px; border-radius: 6px;
  background: var(--surface); border: 1px solid var(--line); border-bottom-width: 2px; color: var(--ink);
}

/* ---------- 小氦的对话气泡 ---------- */
.guide { display: flex; align-items: flex-end; gap: 12px; margin-block: 4px 18px; }
.avatar {
  flex: none; width: 76px; height: 76px; border-radius: 50%; object-fit: cover; background: var(--surface);
  box-shadow: 0 0 0 3px var(--surface), 0 8px 18px -10px rgba(18, 74, 92, 0.6);
}
.bubble {
  position: relative; flex: 0 1 auto; min-width: 0; max-width: 760px;
  padding: 12px 18px 14px; border-radius: 20px 20px 20px 6px; background: var(--surface); box-shadow: var(--shadow);
}
.bubble .who { display: block; margin-bottom: 2px; font-size: 12px; font-weight: 700; letter-spacing: 0.1em; color: var(--brand-ink); }
.bubble p { margin: 0; font-size: 17px; }
.bubble .actions { margin-top: 12px; }
.guide.good .bubble { background: var(--good-soft); }
.guide.good .who { color: var(--good); }
.guide.bad .bubble { background: var(--bad-soft); }
.guide.bad .who { color: var(--bad); }
.pop-in { animation: popIn 0.3s ease; }
@keyframes popIn { from { transform: translateY(6px) scale(0.98); opacity: 0.3; } }

/* ---------- 关卡标题 ---------- */
.gh { display: grid; gap: 4px; margin-bottom: 8px; }
.back-link { justify-self: start; padding: 4px 0; background: none; border: 0; cursor: pointer; color: var(--muted); font-size: 15px; }
.back-link:hover { color: var(--brand-ink); }
.gh-row { display: flex; align-items: center; justify-content: space-between; gap: 10px 14px; flex-wrap: wrap; }
.gh-title { margin: 0; display: flex; align-items: center; gap: 12px; font: clamp(26px, 3.6vw, 34px)/1.2 var(--font-display); font-weight: normal; }
.lvl {
  flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 50%;
  background: var(--brand); color: #FFFFFF; font: 600 18px/1 var(--font-sym);
}
.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: baseline; gap: 6px; padding: 6px 14px; border-radius: 999px;
  background: var(--surface); box-shadow: var(--shadow); font-size: 14px; color: var(--muted);
}
.chip b { font: 600 17px var(--font-sym); color: var(--ink); font-variant-numeric: tabular-nums; }

/* ---------- 元素方块 ---------- */
.tile {
  position: relative; aspect-ratio: 1 / 1; min-width: 0; padding: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.12em;
  border: 2px solid var(--c); border-radius: 10px; background: color-mix(in srgb, var(--c) 11%, #FFFFFF); color: var(--ink);
}
.tile .z { position: absolute; top: 0.45em; left: 0.55em; font: 600 0.85em/1 var(--font-sym); color: var(--c); }
.tile .sym { font: 600 2.3em/1 var(--font-sym); color: var(--c); }
.tile .nm { font: 1.05em/1 var(--font-display); }
.tile.ghost { --c: var(--line); background: transparent; border-style: dashed; }
.tile.ghost .sym, .tile.ghost .z, .tile.ghost .nm { color: #9DB2BC; }
button.tile { cursor: pointer; transition: transform 0.15s ease; }
button.tile:hover { transform: translateY(-3px); }

/* 周期表小块 */
.pt {
  display: grid; align-items: center; gap: 6px; width: 100%; max-width: 820px; margin: 0 auto;
  grid-template-columns: auto repeat(2, minmax(0, 1fr)) minmax(0, 0.45fr) repeat(6, minmax(0, 1fr));
  font-size: clamp(9px, 1.2vw + 3px, 16px);
}
.pt .period { padding-right: 4px; font: 600 1em var(--font-sym); color: var(--muted); }
.pt-cap { margin: 10px 0 0; text-align: center; font-size: 14px; color: var(--muted); }

/* ---------- 首页 ---------- */
.hero { display: grid; grid-template-columns: minmax(0, 4fr) minmax(0, 7fr); gap: clamp(12px, 4vw, 44px); align-items: center; }
.hero-art { display: flex; justify-content: center; }
.hero-art img {
  height: clamp(320px, 40vw, 460px); width: auto; max-width: 100%;
  -webkit-mask-image: linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 4%, #000 92%, transparent 100%);
  -webkit-mask-composite: source-in;
  mask-image: linear-gradient(to right, transparent 0, #000 7%, #000 93%, transparent 100%), linear-gradient(to bottom, transparent 0, #000 4%, #000 92%, transparent 100%);
  mask-composite: intersect;
}
.hero-copy { display: grid; gap: 18px; min-width: 0; }
.hero-copy .bubble { justify-self: start; border-radius: 20px 20px 20px 6px; background: var(--soft); box-shadow: none; }
.hero h1 { margin: 0; font: clamp(36px, 5.4vw, 58px)/1.25 var(--font-display); font-weight: normal; }
.hero h1 ruby { color: var(--c); margin-inline: 0.03em; }
.hero h1 rt { font: 600 0.3em/1 var(--font-body); color: var(--muted); letter-spacing: 0.04em; }
.prog { display: flex; align-items: center; gap: 12px 16px; flex-wrap: wrap; }
.rank { padding: 6px 14px; border-radius: 999px; background: #FFF4DA; color: #8A5A00; font-weight: 700; font-size: 15px; }
.prog-bar { flex: 1 1 140px; max-width: 260px; height: 10px; border-radius: 99px; background: var(--soft); overflow: hidden; }
.prog-bar span { display: block; height: 100%; border-radius: 99px; background: var(--sun); }
.prog-n { margin: 0; font: 600 17px var(--font-sym); font-variant-numeric: tabular-nums; }
.prog-n b { color: var(--sun); }
.sec { display: flex; align-items: baseline; justify-content: space-between; gap: 6px 16px; flex-wrap: wrap; margin: 36px 0 18px; }
.sec h2 { margin: 0; font: 28px/1.2 var(--font-display); font-weight: normal; }
.sec p { margin: 0; color: var(--muted); }
.map { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
.station {
  position: relative; display: grid; gap: 4px; align-content: start; text-align: left; cursor: pointer;
  padding: 16px 16px 18px; border: 0; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow);
  transition: transform 0.15s ease;
}
.station:hover { transform: translateY(-3px); }
.station.current { box-shadow: 0 0 0 3px var(--brand), var(--shadow); }
.st-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.st-num {
  width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
  background: var(--soft); color: var(--brand-ink); font: 600 15px/1 var(--font-sym);
}
.station.done .st-num { background: var(--good); color: #FFFFFF; }
.st-art {
  width: 54px; height: 54px; margin-block: 8px 6px; display: grid; place-items: center;
  border-radius: 16px; background: var(--soft); color: var(--brand-ink);
}
.st-art svg { width: 36px; height: 36px; }
.st-title { font: 23px/1.25 var(--font-display); font-weight: normal; }
.st-desc { font-size: 14px; color: var(--muted); }
.st-here {
  position: absolute; top: -13px; left: 50%; transform: translateX(-50%); white-space: nowrap; display: inline-flex; align-items: center; gap: 6px;
  padding: 3px 12px 3px 3px; border-radius: 999px; background: var(--brand); color: #FFFFFF;
  font-size: 12px; font-weight: 700; box-shadow: var(--shadow);
}
.st-here img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; background: #FFFFFF; }
.station.boss { grid-column: span 2; grid-template-columns: minmax(0, 1fr) auto; column-gap: 16px; background: linear-gradient(135deg, #FFF6DF 0%, #FFFFFF 62%); }
.station.boss > :not(.boss-art):not(.st-here) { grid-column: 1; }
.boss-art { grid-column: 2; grid-row: 1 / span 4; align-self: center; width: 96px; }
.station.boss .st-art { background: #FFEBC0; color: #8A5A00; }
.st-note { font-size: 13px; font-weight: 700; color: var(--good); }
.teacher { margin-top: 30px; border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); }
.teacher summary {
  display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px;
  list-style: none; cursor: pointer; font-weight: 700;
}
.teacher summary::-webkit-details-marker { display: none; }
.teacher summary::after { content: "展开"; font-weight: 400; color: var(--muted); font-size: 14px; }
.teacher[open] summary::after { content: "收起"; }
.teacher-body { display: grid; gap: 14px; padding: 0 20px 20px; }
.teacher-body ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; color: var(--muted); }
.teacher-body .confirm { font-weight: 700; color: var(--bad); }

/* ---------- 原子图 ---------- */
.orbit { display: block; width: 100%; height: auto; }
.orbit .shell { fill: none; stroke: #C3DCE3; stroke-width: 2; stroke-dasharray: 4 5; }
.orbit .e { fill: var(--brand-ink); }
.orbit .nuc { fill: var(--c, #8FA5B0); }
.orbit .nuc.empty { fill: none; stroke: #C3DCE3; stroke-width: 2; stroke-dasharray: 3 4; }
.orbit .nuc-t { fill: #FFFFFF; font: 700 22px var(--font-sym); text-anchor: middle; }
.orbit .pr { fill: var(--proton); stroke: #FFFFFF; stroke-width: 1.5; }
.orbit .nt { fill: var(--neutron); stroke: #FFFFFF; stroke-width: 1.5; }
.orbit .spin { transform-origin: 100px 100px; animation-name: spin; animation-timing-function: linear; animation-iteration-count: infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.diagram { display: block; width: 100%; height: auto; color: var(--ink); }
.diagram path { fill: none; stroke: currentColor; stroke-width: 2.5; stroke-linecap: round; }
.diagram .dnuc { fill: none; stroke: currentColor; stroke-width: 2.5; }
.diagram .dnuc-t { fill: currentColor; font: 600 21px var(--font-sym); text-anchor: middle; }
.diagram .dn {
  fill: currentColor; font: 600 21px var(--font-sym); text-anchor: middle;
  paint-order: stroke; stroke: var(--halo, #FFFFFF); stroke-width: 7px; stroke-linejoin: round;
}
.legend { margin: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 13px; color: var(--muted); }
.dot { display: inline-block; width: 10px; height: 10px; margin-right: 5px; border-radius: 50%; vertical-align: 0; }
.dot-p { background: var(--proton); }
.dot-n { background: var(--neutron); }
.dot-e { background: var(--brand-ink); }

/* ---------- 第 1 关 认一认 ---------- */
.tabs { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; max-width: 460px; margin-bottom: 18px; font-size: 12px; }
.tab { opacity: 0.5; }
.tab[aria-selected="true"] { opacity: 1; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--c); }
.tab .seen { position: absolute; top: 0.3em; right: 0.5em; font-size: 1.1em; font-weight: 700; color: var(--c); }
.tab-cmp { --c: var(--brand); }
.tab-cmp .dots { display: grid; grid-template-columns: repeat(2, 0.9em); gap: 0.25em; margin-bottom: 0.3em; }
.tab-cmp .dots i { width: 0.9em; height: 0.9em; border-radius: 2px; background: var(--c); }
.el-card { display: grid; gap: 22px; }
.el-top { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
.el-top .tile { flex: none; width: 116px; font-size: 19px; }
.el-name { flex: 1 1 260px; min-width: 0; display: grid; gap: 10px; }
.el-name h3 { margin: 0; display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; font: 46px/1 var(--font-display); font-weight: normal; color: var(--c); }
.el-name .py { font: 600 22px var(--font-body); color: var(--ink); }
.el-tags { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.cat { padding: 4px 12px; border-radius: 999px; background: color-mix(in srgb, var(--c) 14%, #FFFFFF); font-size: 14px; font-weight: 700; }
.intro { margin: 0; font-size: 17px; }
.nums { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.num-box { display: grid; gap: 2px; padding: 12px 14px; border-radius: var(--r-md); background: var(--soft); }
.num-box span { font-size: 13px; font-weight: 600; color: var(--muted); }
.num-box b { font: 600 32px/1.1 var(--font-sym); font-variant-numeric: tabular-nums; }
.el-two { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 22px; align-items: start; }
.atoms { --halo: var(--soft); display: grid; gap: 10px; padding: 14px; border-radius: var(--r-md); background: var(--soft); }
.atoms-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; align-items: end; }
.atoms figure { margin: 0; display: grid; gap: 6px; justify-items: center; }
.atoms .orbit { max-width: 190px; }
.atoms .diagram { max-width: 180px; }
.atoms figcaption { font-size: 13px; color: var(--muted); }
.facts { margin: 0; display: grid; }
.facts div { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; padding-block: 9px; border-bottom: 1px solid var(--line); }
.facts div:last-child { border-bottom: 0; }
.facts dt { color: var(--muted); font-size: 14px; }
.facts dd { margin: 0; text-align: right; font-weight: 600; }
.facts dd.n { font: 600 17px var(--font-sym); font-variant-numeric: tabular-nums; }
.rch {
  display: inline-grid; place-items: center; width: 30px; height: 30px; margin-right: 6px; vertical-align: middle;
  border: 2px solid var(--c); border-radius: 8px; font: 18px/1 var(--font-display); color: var(--c);
}
.el-sec h4 { margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font: 21px/1.3 var(--font-display); font-weight: normal; }
.el-sec h4 .eicon { width: 30px; height: 30px; }
.el-sec ul { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.el-sec li::marker { color: var(--c); }
.el-sec p { margin: 0; }
.learn-nav { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 18px; }
.cmp-top { display: grid; gap: 14px; margin-bottom: 18px; }
.koujue { margin: 0; text-align: center; font: clamp(20px, 3vw, 26px)/1.4 var(--font-display); letter-spacing: 0.14em; }
.koujue b { font-weight: normal; color: var(--c); }
.koujue .rest { color: #9DB2BC; }
.cmp-wrap { overflow-x: auto; }
.cmp { width: 100%; min-width: 640px; border-collapse: collapse; font-size: 15px; }
.cmp th, .cmp td { padding: 10px 14px; text-align: left; vertical-align: middle; border-bottom: 1px solid var(--line); }
.cmp thead th { font: 28px/1.2 var(--font-display); font-weight: normal; color: var(--c); border-bottom-width: 2px; }
.cmp thead th small { margin-left: 6px; font: 600 16px var(--font-sym); }
.cmp tbody th { font-size: 14px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.cmp td.n { font: 600 17px var(--font-sym); font-variant-numeric: tabular-nums; }
.cmp td .eicon { display: inline-block; width: 30px; height: 30px; margin-right: 6px; vertical-align: middle; }
.cmp tr:last-child th, .cmp tr:last-child td { border-bottom: 0; }

/* ---------- 第 2 关 翻牌配对 ---------- */
.mgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px; max-width: clamp(420px, calc(150vh - 460px), 720px); margin: 0 auto; }
.mcard { min-width: 0; aspect-ratio: 3 / 4; padding: 0; border: 0; background: none; cursor: pointer; perspective: 900px; }
.mcard .in { position: relative; display: block; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 0.45s cubic-bezier(0.3, 0.7, 0.3, 1); }
.mcard.open .in, .mcard.done .in { transform: rotateY(180deg); }
.mcard .face {
  position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  padding: 8px; border-radius: 16px; backface-visibility: hidden; -webkit-backface-visibility: hidden;
}
.mcard .back {
  color: #FFFFFF; box-shadow: var(--shadow);
  background:
    radial-gradient(circle at 26% 22%, rgba(255, 255, 255, 0.35) 0 9%, transparent 10%),
    radial-gradient(circle at 74% 70%, rgba(255, 255, 255, 0.18) 0 14%, transparent 15%),
    radial-gradient(circle at 70% 26%, rgba(255, 255, 255, 0.2) 0 4%, transparent 5%),
    linear-gradient(160deg, #47B5C7, #1A8DA2);
}
.mcard .back .q { font: clamp(32px, 6vw, 50px)/1 var(--font-display); }
.mcard:not(.open):not(.done):hover .in { transform: translateY(-4px); }
.mcard .front { --halo: #FFFFFF; transform: rotateY(180deg); background: #FFFFFF; box-shadow: 0 0 0 2px var(--line), var(--shadow); }
.mcard.done .front { --halo: color-mix(in srgb, var(--c) 12%, #FFFFFF); background: color-mix(in srgb, var(--c) 12%, #FFFFFF); box-shadow: 0 0 0 2px var(--c); }
.mcard.done .m-sym, .mcard.done .eicon, .mcard.done .diagram { color: var(--c); }
.mcard.miss { animation: shake 0.35s ease; }
.mcard.miss .front { box-shadow: 0 0 0 3px var(--bad); }
.m-sym { font: 600 clamp(30px, 6vw, 52px)/1 var(--font-sym); }
.m-nm { font: clamp(30px, 6vw, 48px)/1 var(--font-display); }
.m-icon .eicon { width: clamp(44px, 10vw, 84px); height: auto; color: var(--ink); }
.m-cap { font-size: clamp(11px, 1.8vw, 14px); line-height: 1.3; text-align: center; }
.m-dia { width: 100%; }
.diagram.compact .dnuc-t { font-size: 22px; }
.diagram.compact .dn { font-size: 27px; stroke-width: 8px; }
.diagram.compact path, .diagram.compact .dnuc { stroke-width: 3; }

/* ---------- 第 3 关 周期表归位 ---------- */
.slot {
  aspect-ratio: 1 / 1; min-width: 0; padding: 0; display: grid; place-items: center; cursor: pointer;
  border: 2px dashed #A9C4CD; border-radius: 10px; background: var(--soft);
  font: 600 1.8em/1 var(--font-sym); color: #8FAAB4;
}
.board.has-sel .slot { border-color: var(--brand); border-style: solid; background: var(--brand-soft); color: var(--brand-ink); }
.slot:hover { border-style: solid; }
.slot.bump { animation: shake 0.35s ease; border-color: var(--bad); }
.just { animation: pop 0.35s ease; }
.tray {
  margin-top: 16px; min-height: 132px; padding: 16px; display: flex; flex-wrap: wrap; gap: 14px; justify-content: center; align-items: center;
  border-radius: var(--r-lg); background: var(--soft);
}
.tray-empty { color: var(--muted); }
.ttile {
  --halo: #FFFFFF;
  width: 104px; height: 104px; padding: 8px; display: grid; place-items: center; cursor: pointer;
  border: 0; border-radius: 16px; background: #FFFFFF; box-shadow: var(--shadow); color: var(--ink);
  transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.ttile.wide { width: 176px; }
.ttile:hover { transform: translateY(-3px); }
.ttile.sel { transform: translateY(-6px); box-shadow: 0 0 0 3px var(--brand), var(--shadow); }
.ttile .sym { font: 600 44px/1 var(--font-sym); }
.ttile .nm { font: 42px/1 var(--font-display); }

/* ---------- 第 4 关 猜猜我是谁 ---------- */
.clues { list-style: none; margin: 0 0 18px; padding: 0; display: grid; gap: 10px; }
.clue { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--r-md); background: var(--soft); animation: rise 0.35s ease; }
.clue .cn {
  flex: none; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
  background: var(--brand); color: #FFFFFF; font: 600 15px/1 var(--font-sym);
}
.clue p { flex: 1; margin: 0; font-size: clamp(18px, 2.6vw, 22px); font-weight: 600; line-height: 1.5; }
.clue .say { flex: none; background: #FFFFFF; }
.clue.locked { background: transparent; border: 2px dashed var(--line); animation: none; }
.clue.locked .cn { background: var(--line); color: var(--muted); }
.clue.locked p { font-size: 16px; font-weight: 400; color: var(--muted); }
@keyframes rise { from { opacity: 0.2; transform: translateY(8px); } }
.reveal { display: flex; align-items: center; gap: 14px; margin-top: 8px; }
.reveal .tile { flex: none; width: 76px; font-size: 13px; }

/* ---------- 第 5 关 抢答赛 ---------- */
.setup { display: grid; gap: 18px; max-width: 780px; }
.opt-group { display: grid; gap: 10px; }
.opt-label { margin: 0; font-weight: 700; }
.opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.opt {
  display: grid; gap: 4px; align-content: start; text-align: left; cursor: pointer; padding: 14px 16px;
  border: 0; border-radius: var(--r-md); background: var(--soft); box-shadow: inset 0 0 0 2px transparent;
}
.opt b { font: 23px/1.2 var(--font-display); font-weight: normal; }
.opt span { font-size: 14px; color: var(--muted); }
.opt[aria-checked="true"] { background: #FFFFFF; box-shadow: inset 0 0 0 2px var(--brand), var(--shadow); }
.opt[aria-checked="true"] b { color: var(--brand-ink); }
.check { display: flex; align-items: center; gap: 10px; font-size: 16px; cursor: pointer; }
.check input { width: 20px; height: 20px; accent-color: var(--brand); }
.field { display: grid; gap: 6px; max-width: 360px; }
.field span { font-weight: 700; }
.field input {
  font: inherit; font-size: 18px; padding: 10px 16px; border-radius: 12px;
  border: 2px solid var(--line); background: #FFFFFF; color: var(--ink);
}
.field input:focus { border-color: var(--brand); }
.teams { display: flex; gap: 8px; flex-wrap: wrap; }
.team {
  --tc: var(--team-a);
  display: inline-flex; align-items: baseline; gap: 8px; padding: 5px 14px; border-radius: 999px;
  background: #FFFFFF; box-shadow: inset 0 0 0 2px var(--tc); font-weight: 700; color: var(--tc);
}
.team.t1 { --tc: var(--team-b); }
.team b { font: 600 19px var(--font-sym); color: var(--ink); font-variant-numeric: tabular-nums; }
.team.on { background: var(--tc); color: #FFFFFF; }
.team.on b { color: #FFFFFF; }
.qbar { display: flex; align-items: center; gap: 14px; margin-bottom: 14px; }
.dots-row { display: flex; gap: 5px; flex-wrap: wrap; }
.dots-row i { width: 10px; height: 10px; border-radius: 50%; background: #CFE0E6; }
.dots-row i.ok { background: var(--good); }
.dots-row i.no { background: var(--bad); }
.dots-row i.now { background: var(--brand); box-shadow: 0 0 0 3px var(--brand-soft); }
.timer { flex: 1; height: 8px; border-radius: 99px; overflow: hidden; background: #D8E8ED; }
.timer span { display: block; height: 100%; background: var(--brand); transition: width 0.1s linear; }
.timer.low span { background: var(--bad); }
.tsec { min-width: 2.2ch; text-align: right; font: 600 18px var(--font-sym); font-variant-numeric: tabular-nums; }
.timer.low + .tsec { color: var(--bad); }
.q-card { display: grid; gap: 12px; margin-bottom: 16px; }
.q-kind { margin: 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.tag { padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--brand-ink); font-size: 13px; font-weight: 700; }
.tag.lv { background: transparent; box-shadow: inset 0 0 0 1px var(--line); color: var(--muted); }
.turn { padding: 2px 10px; border-radius: 999px; background: var(--team-a); color: #FFFFFF; font-size: 13px; font-weight: 700; }
.turn.t1 { background: var(--team-b); }
.q-text { margin: 0; font: 600 clamp(21px, 3.2vw, 30px)/1.45 var(--font-body); }
.q-fig { justify-self: center; width: 100%; display: flex; justify-content: center; }
.q-fig .orbit { max-width: 190px; }
.q-fig .diagram { max-width: 240px; }
.answers { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.answers.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.ans {
  position: relative; min-height: 128px; padding: 14px 8px;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  border: 0; border-radius: 18px; background: #FFFFFF; box-shadow: var(--shadow);
  cursor: pointer; transition: transform 0.12s ease, box-shadow 0.12s ease;
}
.ans:not(:disabled):hover { transform: translateY(-3px); box-shadow: 0 0 0 2px var(--brand), var(--shadow); }
.ans:not(:disabled):active { transform: translateY(0) scale(0.98); }
.ans:disabled { cursor: default; }
.ans .key { position: absolute; top: 8px; left: 12px; font: 600 13px var(--font-sym); color: #9DB2BC; }
.ans .sym { font: 600 50px/1 var(--font-sym); color: var(--c, var(--ink)); }
.ans .nm { font: 44px/1 var(--font-display); }
.ans .nm.sm { font-size: 24px; }
.ans .py { font-size: 14px; color: var(--muted); }
.ans .num { font: 600 52px/1 var(--font-sym); font-variant-numeric: tabular-nums; }
.ans .num small { margin-left: 2px; font: 600 20px var(--font-body); }
.ans .tfm { font: 700 40px/1 var(--font-body); }
.ans .tfm.y { color: var(--good); }
.ans .tfm.n { color: var(--bad); }
.ans.reveal { background: color-mix(in srgb, var(--c, #FFFFFF) 10%, #FFFFFF); }
.ans.dim { opacity: 0.45; }
.ans.out { opacity: 0.35; }
.ans.right { box-shadow: 0 0 0 4px var(--good), var(--shadow); animation: pop 0.35s ease; }
.ans.wrong { box-shadow: 0 0 0 4px var(--bad), var(--shadow); animation: shake 0.35s ease; }
.ans .mark {
  position: absolute; top: 8px; right: 10px; width: 26px; height: 26px; display: grid; place-items: center;
  border-radius: 50%; background: var(--good); color: #FFFFFF; font-size: 15px; font-weight: 700;
}
.ans.wrong .mark, .ans.out .mark { background: var(--bad); }
@keyframes pop { 50% { transform: scale(1.05); } }
@keyframes shake { 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
.fb { margin-block: 20px 0; }
.fb .gain { font: 600 19px var(--font-sym); }
.fb .tip { display: block; margin-top: 6px; font-size: 15px; color: var(--muted); }

/* ---------- 成绩 ---------- */
.result { display: grid; justify-items: center; gap: 12px; text-align: center; padding-block: 8px; }
.result > p { margin: 0; }
.result .r-avatar { width: 120px; height: 120px; border-radius: 50%; object-fit: cover; background: #FFFFFF; box-shadow: 0 0 0 4px #FFFFFF, var(--shadow); }
.result h2 { margin: 0; font: clamp(28px, 4vw, 38px)/1.25 var(--font-display); font-weight: normal; }
.big-score { font: 700 clamp(56px, 11vw, 84px)/1 var(--font-sym); font-variant-numeric: tabular-nums; }
.big-score small { margin-left: 6px; font: 20px var(--font-body); color: var(--muted); }
.new-best { padding: 3px 12px; border-radius: 999px; background: #FFF0C7; color: #8A5A00; font-weight: 700; font-size: 14px; }
.team-scores { display: flex; gap: 14px; flex-wrap: wrap; justify-content: center; }
.team-box { --tc: var(--team-a); min-width: 170px; padding: 14px 20px; display: grid; gap: 2px; border-radius: var(--r-lg); background: #FFFFFF; box-shadow: inset 0 0 0 2px var(--tc), var(--shadow); }
.team-box.t1 { --tc: var(--team-b); }
.team-box.win { background: color-mix(in srgb, var(--tc) 10%, #FFFFFF); }
.team-box .tn { font: 22px var(--font-display); color: var(--tc); }
.team-box .ts { font: 700 44px/1.1 var(--font-sym); font-variant-numeric: tabular-nums; }
.team-box .tc { font-size: 14px; color: var(--muted); }
.review { width: 100%; max-width: 740px; margin-top: 8px; text-align: left; }
.review h3 { margin: 0 0 10px; font: 22px var(--font-display); font-weight: normal; }
.review ol { margin: 0; padding-left: 1.3em; display: grid; gap: 14px; }
.review p { margin: 0; }
.review .rq { font-weight: 600; }
.review .ra { font-size: 15px; color: var(--muted); }
.review .mini { width: 120px; margin-block: 4px; }
.result .actions { justify-content: center; margin-top: 6px; }
.atom-row { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; width: 100%; max-width: 640px; }
.atom-row figure { margin: 0; display: grid; gap: 4px; justify-items: center; }
.atom-row .orbit { max-width: 120px; }
.atom-row figcaption { font: 18px var(--font-display); color: var(--c); }

/* ---------- 第 6 关 搭原子 ---------- */
.build-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; align-items: center; }
.build-left { display: grid; gap: 10px; justify-items: center; }
.build-left .orbit { max-width: 330px; }
.build-target { display: flex; align-items: center; gap: 12px; }
.build-target .tile { width: 64px; font-size: 12px; }
.build-ctrl { display: grid; gap: 10px; min-width: 0; }
.counter { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 8px 10px 8px 16px; border-radius: var(--r-md); background: var(--soft); }
.c-lab { display: grid; }
.c-lab b { font-size: 18px; }
.c-lab small { font-size: 13px; color: var(--muted); }
.stepper { display: flex; align-items: center; gap: 6px; }
.stepper button {
  width: 44px; height: 44px; border: 0; border-radius: 50%; background: #FFFFFF; box-shadow: var(--shadow);
  font: 600 24px/1 var(--font-body); color: var(--brand-ink); cursor: pointer;
}
.stepper button:disabled { opacity: 0.35; cursor: default; }
.stepper output { min-width: 2.2ch; text-align: center; font: 700 30px var(--font-sym); font-variant-numeric: tabular-nums; }
.readout { display: grid; gap: 4px; padding: 12px 16px; border-radius: var(--r-md); box-shadow: inset 0 0 0 2px var(--soft); }
.readout p { margin: 0; }
.readout b { font-size: 18px; }
.note { margin: 16px 0 0; color: var(--muted); text-align: center; }
.note b { color: var(--ink); }

/* ---------- 证书 ---------- */
.cert-wrap { display: grid; gap: 16px; }
.cert {
  position: relative; width: 100%; max-width: 760px; margin: 0 auto; overflow: hidden;
  padding: clamp(28px, 5vw, 52px) clamp(18px, 5vw, 56px); display: grid; gap: 12px; justify-items: center; text-align: center;
  border-radius: 6px; background: #FFFFFF; border: 2px solid var(--brand-ink);
  box-shadow: inset 0 0 0 7px #FFFFFF, inset 0 0 0 9px var(--brand), var(--shadow);
}
.cert .c-top { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 0.4em; color: var(--muted); }
.cert .c-title { margin: 0; font: clamp(44px, 9vw, 80px)/1.1 var(--font-display); font-weight: normal; color: var(--brand-ink); }
.cert .c-sub { margin: -4px 0 6px; padding-left: 1em; font-weight: 700; letter-spacing: 1em; color: var(--muted); }
.cert .person { margin: 0; min-width: 6em; padding: 0 24px 2px; border-bottom: 2px solid var(--ink); font: clamp(30px, 5vw, 42px)/1.3 var(--font-display); }
.cert .c-text { margin: 0; max-width: 30em; font-size: 17px; }
.cert .c-tiles { display: flex; gap: 10px; margin-block: 6px; }
.cert .c-tiles .tile { width: 64px; font-size: 11px; }
.cert .c-foot { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: 15px; color: var(--muted); }
.issuer { display: inline-flex; align-items: center; gap: 8px; }
.issuer img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 2px var(--soft); }
.stamp {
  position: absolute; right: 6%; bottom: 21%; width: 112px; height: 112px; border-radius: 50%;
  display: grid; place-items: center; text-align: center; transform: rotate(-14deg); opacity: 0.85; pointer-events: none;
  border: 3px solid var(--li); color: var(--li); box-shadow: inset 0 0 0 5px #FFFFFF, inset 0 0 0 7px var(--li);
  font: 30px/1 var(--font-display);
}
.stamp small { display: block; margin-top: 4px; font: 700 11px var(--font-body); letter-spacing: 0.2em; }
.cert-locked { display: grid; gap: 12px; justify-items: center; text-align: center; }

/* ---------- 题库 ---------- */
.bank { display: grid; gap: 12px; }
.bank details { border-radius: var(--r-lg); background: var(--surface); box-shadow: var(--shadow); padding: 0 20px; }
.bank summary { padding-block: 14px; cursor: pointer; font: 22px var(--font-display); }
.bank summary small { margin-left: 8px; font: 14px var(--font-body); color: var(--muted); }
.bank ol { margin: 0 0 18px; padding-left: 1.6em; display: grid; gap: 10px; }
.bank .bk { display: inline-block; margin-right: 8px; padding: 0 9px; border-radius: 999px; background: var(--soft); color: var(--brand-ink); font-size: 12px; font-weight: 700; }
.bank .ba { display: block; font-size: 14px; color: var(--muted); }

/* ---------- 更精致：方块、按钮、卡片的立体感 ---------- */
.tile {
  background: linear-gradient(165deg, color-mix(in srgb, var(--c) 5%, #FFFFFF) 0%, color-mix(in srgb, var(--c) 17%, #FFFFFF) 100%);
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.9), 0 8px 16px -12px var(--c);
}
.tile.ghost { background: transparent; box-shadow: none; }
.btn { box-shadow: 0 3px 0 #B9DDE5; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 #B9DDE5; }
.btn.primary { background: linear-gradient(180deg, #26A2B7 0%, #168699 100%); box-shadow: 0 4px 0 #0E6576, 0 14px 22px -14px #0E6576; }
.btn.primary:hover { background: linear-gradient(180deg, #1E95A9 0%, #127A8C 100%); }
.btn.primary:active { box-shadow: 0 1px 0 #0E6576; }
.btn.danger { box-shadow: 0 3px 0 #F2C4BE; }
.btn:disabled { box-shadow: none; }
.ans { box-shadow: 0 4px 0 #D6E7EC, var(--shadow); }
.ans:not(:disabled):hover { box-shadow: 0 0 0 2px var(--brand), 0 4px 0 #B9DDE5, var(--shadow); }
.station { box-shadow: 0 4px 0 #D6E7EC, var(--shadow); }
.station.current { box-shadow: 0 0 0 3px var(--brand), 0 4px 0 #9FD3DD, var(--shadow); }
.station:active { transform: translateY(2px); }
.sec h2 { display: flex; align-items: center; gap: 12px; }
.sec h2::before {
  content: ""; width: 14px; height: 14px; flex: none; transform: rotate(45deg);
  border-radius: 0 50% 50% 50%; background: linear-gradient(135deg, #7FD0DF, var(--brand));
}
.guide .bubble::before {
  content: ""; position: absolute; left: -6px; bottom: 12px; width: 14px; height: 14px;
  background: inherit; border-radius: 3px; transform: rotate(45deg);
}

/* ---------- 更生动：小氦会动、庆祝、过场 ---------- */
.guide .avatar { animation: bob 3.4s ease-in-out infinite; }
.guide.good .avatar { animation: hop 0.55s ease, bob 3.4s ease-in-out 0.55s infinite; }
.guide.bad .avatar { animation: tilt 0.5s ease, bob 3.4s ease-in-out 0.5s infinite; }
@keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes hop { 30% { transform: translateY(-14px) scale(1.06); } 60% { transform: translateY(0); } 80% { transform: translateY(-4px); } }
@keyframes tilt { 25% { transform: rotate(-9deg); } 75% { transform: rotate(7deg); } }
.hero-art { position: relative; }
.hero-art img { animation: float 6s ease-in-out infinite; }
@keyframes float { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-9px) rotate(-0.6deg); } }
.bub {
  position: absolute; bottom: 12%; border-radius: 50%; pointer-events: none;
  background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.95) 0 18%, rgba(170, 222, 234, 0.35) 55%, rgba(120, 200, 220, 0.12) 100%);
  box-shadow: inset 0 0 0 1px rgba(90, 170, 190, 0.28);
  animation: bubRise linear infinite;
}
@keyframes bubRise {
  0% { transform: translateY(40px) scale(0.7); opacity: 0; }
  15% { opacity: 1; }
  100% { transform: translateY(-300px) scale(1.05); opacity: 0; }
}
.bg-bubbles { position: fixed; inset: 0; z-index: 0; overflow: hidden; pointer-events: none; }
.bg-bubbles i {
  position: absolute; bottom: -80px; border-radius: 50%;
  background: radial-gradient(circle at 32% 30%, rgba(255, 255, 255, 0.9) 0 16%, rgba(170, 222, 234, 0.22) 60%, rgba(170, 222, 234, 0.06) 100%);
  box-shadow: inset 0 0 0 1px rgba(90, 170, 190, 0.16);
  animation: drift linear infinite;
}
@keyframes drift { to { transform: translateY(-120vh) translateX(30px); } }
.app { position: relative; z-index: 1; }
#view.enter > * { animation: screenIn 0.38s cubic-bezier(0.2, 0.7, 0.3, 1) both; }
@keyframes screenIn { from { opacity: 0.35; transform: translateY(12px); } }
.stars.big span { display: inline-block; }
.stars.big span.on { animation: starIn 0.6s cubic-bezier(0.3, 1.6, 0.5, 1) both; }
.stars.big span:nth-child(2) { animation-delay: 0.18s; }
.stars.big span:nth-child(3) { animation-delay: 0.36s; }
@keyframes starIn { from { transform: scale(0.2) rotate(-40deg); opacity: 0.3; } }
.star-pill.bump { animation: bump 0.6s ease; }
@keyframes bump { 30% { transform: scale(1.2); } }
#fx { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 60; pointer-events: none; }
#toast {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 72px); left: 50%; z-index: 55;
  padding: 10px 22px; border-radius: 999px; background: linear-gradient(180deg, #FFCF5C, #F0A51E); color: #5A3A00;
  font: 22px/1.2 var(--font-display); box-shadow: 0 4px 0 #C98712, 0 16px 30px -14px rgba(120, 80, 0, 0.6);
  transform: translate(-50%, -24px) scale(0.9); opacity: 0; pointer-events: none;
  transition: transform 0.3s cubic-bezier(0.3, 1.5, 0.5, 1), opacity 0.2s ease;
}
#toast.show { transform: translate(-50%, 0) scale(1); opacity: 1; }
#toast:empty { display: none; }

/* ---------- 故事章节卡 ---------- */
body.ov-open { overflow: hidden; }
.overlay {
  position: fixed; inset: 0; z-index: 40; display: grid; grid-template-columns: minmax(0, 1fr); place-items: center;

  // 原子核：质子和中子挤在一起（向日葵排列）
  function nucleusSVG(p, n) {
    const N = p + n;
    if (!N) return '<circle class="nuc empty" cx="100" cy="100" r="27"/>';
    const seq = [];
    for (let a = p, b = n; a || b;) { if (a) { seq.push(1); a--; } if (b) { seq.push(0); b--; } }
    const c = Math.min(9, 23 / Math.sqrt(N));
    const pr = N <= 4 ? 8.5 : N <= 10 ? 7.5 : 6.5;
    let s = '';
    for (let i = N - 1; i >= 0; i--) {
      const r = c * Math.sqrt(i + 0.5);
      const t = i * 2.39996;
      s += `<circle class="${seq[i] ? 'pr' : 'nt'}" cx="${(100 + r * Math.cos(t)).toFixed(1)}" cy="${(100 + r * Math.sin(t)).toFixed(1)}" r="${pr}"/>`;
    }
    return s;
  }

  function orbitSVG(z, o = {}) {
    const e = o.e ?? z;
    const shells = shellsOf(e);
    const ringCount = Math.max(shells.length, o.rings || 0);
    const t = performance.now() / 1000;
    let s = `<svg class="orbit" viewBox="0 0 200 200" role="img" aria-label="${o.aria || '原子模型'}">`;
    for (let i = 0; i < ringCount; i++) s += `<circle class="shell" cx="100" cy="100" r="${RADII[i]}"/>`;
    shells.forEach((n, i) => {
      const d = SPIN[i];
      s += `<g class="spin" style="animation-duration:${d}s;animation-delay:-${(t % d).toFixed(2)}s">`;
      for (let j = 0; j < n; j++) {
        const a = -Math.PI / 2 + (j * 2 * Math.PI) / n + i * 0.5;
        s += `<circle class="e" cx="${(100 + RADII[i] * Math.cos(a)).toFixed(1)}" cy="${(100 + RADII[i] * Math.sin(a)).toFixed(1)}" r="7.5"/>`;
      }
      s += '</g>';
    });

    else s += '<circle class="nuc empty" cx="100" cy="100" r="27"/>';

  }

    const y = r.top + r.height / 2;
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2;
      const s = 3 + Math.random() * 6;
      spawn(x, y, Math.cos(a) * s, Math.sin(a) * s - 3, 0.2);
    }
    runFx();
  }
  // 从屏幕上方飘下来
  function rain(n = 140) {
    if (reduceMotion()) return;
    for (let i = 0; i < n; i++) spawn(Math.random() * innerWidth, -20 - Math.random() * innerHeight * 0.5, (Math.random() - 0.5) * 2, 1.5 + Math.random() * 2.5, 0.05);
    runFx();
  }
  function drawPart(p) {
    fxCtx.save();
    fxCtx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.6));
    fxCtx.translate(p.x, p.y);
    fxCtx.rotate(p.rot);
    fxCtx.fillStyle = p.color;
    if (p.shape === 0) fxCtx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2);
    else if (p.shape === 1) { fxCtx.beginPath(); fxCtx.arc(0, 0, p.size / 2.4, 0, 6.283); fxCtx.fill(); }
    else {
      // 水滴：和小氦雨衣上的图案一样
      const s = p.size / 1.7;
      fxCtx.beginPath();
      fxCtx.moveTo(0, -s * 1.3);
      fxCtx.bezierCurveTo(s, -s * 0.2, s * 0.8, s, 0, s);
      fxCtx.bezierCurveTo(-s * 0.8, s, -s, -s * 0.2, 0, -s * 1.3);
      fxCtx.fill();
    }
    fxCtx.restore();
  }
  function runFx() {
    if (fxRaf) return;
    fxSize();
    const step = () => {
      fxCtx.clearRect(0, 0, innerWidth, innerHeight);
      parts = parts.filter((p) => p.life > 0 && p.y < innerHeight + 40);
      for (const p of parts) {
        p.vy += p.g;
        p.vx *= 0.99;
        p.wob += 0.08;
        p.x += p.vx + Math.sin(p.wob) * 0.6;
        p.y += p.vy;
        p.rot += p.vr;
        p.life -= p.decay;
        drawPart(p);
      }
      if (parts.length) fxRaf = requestAnimationFrame(step);
      else { fxRaf = 0; fxCtx.clearRect(0, 0, innerWidth, innerHeight); }
    };
    fxRaf = requestAnimationFrame(step);
  }
  window.addEventListener('resize', () => { if (fxRaf) fxSize(); });

  // 下一步 / 上一步 去哪儿：{ i: 第几个元素（4 是对比表）, s: 第几步 }
  function learnNext(i, s) {
    if (i === 4) return null;
    if (s < 2) return { i, s: s + 1, label: `下一步：${LEARN_STEPS[s + 1]} →` };
    if (i < 3) return { i: i + 1, s: 0, label: `下一个元素：${EL[ORDER[i + 1]].name} →` };
    return { i: 4, s: 0, label: '最后：看对比表 →' };
  }
  function learnPrev(i, s) {
    if (i === 4) return { i: 3, s: 2, label: '← 回到硼' };
    if (s > 0) return { i, s: s - 1, label: '← 上一步' };
    if (i > 0) return { i: i - 1, s: 2, label: `← ${EL[ORDER[i - 1]].name}` };
    return null;
  }
  const learnBtn = (t, primary) => (t ? `<button type="button" class="btn ${primary ? 'primary' : ''}" data-learn="${t.i}" data-lstep="${t.s}" data-scroll="1">${t.label}</button>` : '<span></span>');

  function learnHTML() {
    const i = state.learn;

    const seenN = ORDER.filter((x) => state.seen[x]).length;

      ? (seenN === 4 ? '<button type="button" class="btn primary" data-go="match">去第 2 关：翻牌配对 →</button>' : learnBtn({ i: 0, s: 0, label: '从氦开始再看一遍 →' }, true))

  /* ================= 第 2 关 翻牌配对 ================= */
  const MATCH_ROUNDS = [
    { title: '符号 ↔ 名字', tip: '翻开两张牌，把元素符号和它的中文名字配成一对。' },
    { title: '名字 ↔ 用途', tip: '每个元素都有一个代表用途。气球、电池、镜片、玻璃，分别是谁的？' },
    { title: '名字 ↔ 结构图', tip: '看原子结构示意图：圆圈里的数字就是质子数，找到它是谁。' }
  ];
  const newMatchRound = () => ({ cards: shuffle(ORDER.flatMap((k) => [{ k, s: 0 }, { k, s: 1 }])), open: [], done: [], lock: false, roundDone: false, talk: null });
  function startMatch() { state.match = Object.assign({ round: 0, mistakes: 0 }, newMatchRound()); go('match'); }
  function cardFace(r, c) {
    const e = EL[c.k];
    if (c.s === 0) return r === 0 ? `<span class="m-sym">${e.sym}</span>` : `<span class="m-nm">${e.name}</span>`;
    if (r === 0) return `<span class="m-nm">${e.name}</span>`;
    if (r === 1) return `<span class="m-icon">${ICON_EL[c.k]}</span><span class="m-cap">${e.useShort}</span>`;
    return `<span class="m-dia">${diagramSVG(e.z, { compact: true })}</span>`;
  }
  function matchGuideHTML() {
    const m = state.match;
    if (m.roundDone) {
      const last = m.round + 1 >= MATCH_ROUNDS.length;
      return guide('happy', `<p>这一轮全配对了！${last ? '三轮都完成啦。' : '准备好下一轮了吗？'}</p><div class="actions"><button type="button" class="btn primary" data-act="mnext">${last ? '看结果 →' : '下一轮 →'}</button></div>`, 'good');
    }
    if (m.talk) return guide(m.talk.mood, `<p>${m.talk.text}</p>`, m.talk.tone);
    return guide('curious', `<p>${MATCH_ROUNDS[m.round].tip}</p>`);
  }
  function matchHTML() {
    const m = state.match;
    return `
    <section class="match">
      ${headHTML(2, '翻牌配对', chip('第', `${m.round + 1} / 3 轮`) + chip('翻错', `<span id="m-miss">${m.mistakes}</span> 次`))}
      <div id="m-guide">${matchGuideHTML()}</div>
      <div class="panel">
        <div class="mgrid">
          ${m.cards.map((c, i) => `<button type="button" class="mcard c-${c.k}" data-card="${i}"><span class="in"><span class="face back" aria-hidden="true"><span class="q">?</span></span><span class="face front">${cardFace(m.round, c)}</span></span></button>`).join('')}
        </div>
      </div>
    </section>`;
  }
  function paintCards(miss) {
    const m = state.match;
    view.querySelectorAll('.mcard').forEach((el, i) => {
      const isOpen = m.open.includes(i);
      el.classList.toggle('open', isOpen);
      el.classList.toggle('done', m.done.includes(i));
      el.classList.toggle('miss', !!miss && isOpen);
      if (isOpen || m.done.includes(i)) el.removeAttribute('aria-label');
      else el.setAttribute('aria-label', `第 ${i + 1} 张牌，没翻开`);
    });
    const missEl = $('#m-miss');
    if (missEl) missEl.textContent = m.mistakes;
    const g = $('#m-guide');
    if (g) g.innerHTML = matchGuideHTML();
  }
  let matchTimer = 0;
  function flipCard(i) {
    const m = state.match;
    if (!m || m.roundDone || m.done.includes(i)) return;
    // 翻错的两张还没盖回去时又点了别的牌：马上盖回去，再翻开这一张
    if (m.lock) {
      if (m.open.includes(i)) return;
      clearTimeout(matchTimer);
      m.open = [];
      m.lock = false;
    }
    if (m.open.includes(i)) return;
    m.open.push(i);
    if (m.open.length < 2) { play('tick'); paintCards(); return; }
    const [a, b] = m.open.map((x) => m.cards[x]);
    if (a.k === b.k) {
      const second = m.open[1];
      m.done.push(...m.open);
      m.open = [];
      if (m.done.length === m.cards.length) m.roundDone = true;
      m.talk = { mood: 'happy', tone: 'good', text: pickOne(['找到一对！', '配对成功！', '对啦，就是它们俩！']) + ` ${EL[a.k].name}（${EL[a.k].sym}）。` };
      play('good');
      paintCards();
      burstAt(view.querySelectorAll('.mcard')[second], 26);
      if (m.roundDone) rain(70);
    } else {
      m.mistakes += 1;
      m.lock = true;
      m.talk = { mood: 'serious', tone: 'bad', text: '不是一对哦。记住这两张牌的位置，下次就能找到了。' };
      play('bad');
      paintCards(true);
      matchTimer = setTimeout(() => { m.open = []; m.lock = false; if (state.screen === 'match') paintCards(); }, 1000);
    }
  }
  function nextMatchRound() {
    const m = state.match;
    if (m.round + 1 >= MATCH_ROUNDS.length) {
      const stars = m.mistakes <= 3 ? 3 : m.mistakes <= 7 ? 2 : 1;
      const improved = award('match', stars);
      play('win');
      showResult({ id: 'match', again: 'match', title: stars === 3 ? '记性真好！' : '全部配对成功！', stars, improved, lines: [`三轮一共翻错 ${m.mistakes} 次。翻错 3 次以内就能拿 3 颗星。`] });
      return;
    }
    Object.assign(m, { round: m.round + 1 }, newMatchRound());
    render();
  }

  /* ================= 第 3 关 周期表归位 ================= */
  const PLACE_ROUNDS = [
    { title: '看符号', tip: '先点下面的一个元素方块，再点周期表上它的空位。看看旁边的邻居，能帮你找到位置哦。' },
    { title: '看名字', tip: '这次方块上只有中文名字。还记得口诀“氢氦锂铍硼”吗？' },
    { title: '看结构图', tip: '数一数每个原子一共有几个电子，就知道它是几号元素了。' }
  ];
  const newPlaceRound = () => ({ tray: shuffle(ORDER.slice()), placed: {}, sel: null, msg: null, roundDone: false, bump: null, just: null });
  function startPlace() { state.place = Object.assign({ round: 0, mistakes: 0 }, newPlaceRound()); go('place'); }
  function trayFace(r, k) {
    const e = EL[k];
    if (r === 0) return `<span class="sym">${e.sym}</span>`;
    if (r === 1) return `<span class="nm">${e.name}</span>`;
    return diagramSVG(e.z, { label: '+?', aria: '电子排布 ' + shellsOf(e.z).join('、') });
  }
  function placeHTML() {
    const p = state.place;
    const R = PLACE_ROUNDS[p.round];
    const slots = ORDER.map((k) => {
      const [c, r] = POS[k];
      if (p.placed[k]) return tileHTML(k, p.just === k ? 'just' : '', `style="grid-column:${c};grid-row:${r}"`);
      return `<button type="button" class="slot ${p.bump === k ? 'bump' : ''}" data-slot="${k}" style="grid-column:${c};grid-row:${r}" aria-label="周期表上的空位">?</button>`;
    }).join('');
    const left = p.tray.filter((k) => !p.placed[k]);
    const tray = left.length
      ? left.map((k) => `<button type="button" class="ttile ${p.round === 2 ? 'wide' : ''} ${p.sel === k ? 'sel' : ''}" data-pick="${k}" aria-pressed="${p.sel === k}">${trayFace(p.round, k)}</button>`).join('')
      : '<span class="tray-empty">全部放好了！</span>';
    const last = p.round + 1 >= PLACE_ROUNDS.length;
    let g;
    if (p.roundDone) g = guide('happy', `<p>这一轮全放对了！周期表上，原子序数从左到右、从上到下一个一个变大。</p><div class="actions"><button type="button" class="btn primary" data-act="pnext">${last ? '看结果 →' : '下一轮 →'}</button></div>`, 'good');
    else if (p.msg) g = guide(p.msg.mood, `<p>${p.msg.text}</p>`, p.msg.tone);
    else g = guide('curious', `<p>${R.tip}</p>`);
    return `
    <section class="place">
      ${headHTML(3, `周期表归位 · ${R.title}`, chip('第', `${p.round + 1} / 3 轮`) + chip('放错', `${p.mistakes} 次`))}
      <div aria-live="polite">${g}</div>
      <div class="panel board ${p.sel ? 'has-sel' : ''}">${ptHTML(slots)}</div>
      <div class="tray" aria-label="还没放好的元素">${tray}</div>
    </section>`;
  }
  function placeAt(k) {
    const p = state.place;
    p.bump = null; p.just = null;
    if (!p.sel) { p.msg = { mood: 'curious', tone: '', text: '先点一下下面的元素方块，再点这个空位。' }; render(); return; }
    if (p.sel === k) {
      p.placed[k] = true;
      p.just = k;
      p.sel = null;
      p.msg = { mood: 'happy', tone: 'good', text: `放对了！${EL[k].name}（${EL[k].sym}）是 ${EL[k].z} 号元素。` };
      if (ORDER.every((x) => p.placed[x])) p.roundDone = true;
      play('good');
    } else {
      p.mistakes += 1;
      p.bump = k;
      p.msg = { mood: 'serious', tone: 'bad', text: `不是这里哦。这个空位是 ${EL[k].z} 号元素的家，看看旁边的邻居，再想一想。` };
      play('bad');
    }
    render();
    if (p.just) burstAt($('.just'), 28);
    if (p.roundDone) rain(70);
  }
  function nextPlaceRound() {
    const p = state.place;
    if (p.round + 1 >= PLACE_ROUNDS.length) {
      const stars = p.mistakes <= 1 ? 3 : p.mistakes <= 4 ? 2 : 1;
      const improved = award('place', stars);
      play('win');
      showResult({ id: 'place', again: 'place', title: '它们都回家了！', stars, improved, lines: [`三轮一共放错 ${p.mistakes} 次。放错 1 次以内就能拿 3 颗星。`] });
      return;
    }
    Object.assign(p, { round: p.round + 1 }, newPlaceRound());
    render();
  }

  /* ================= 第 4 关 猜猜我是谁 ================= */
  const CLUE_POINTS = [100, 75, 50, 25];
  function startGuess() { state.guess = { order: shuffle(ORDER.slice()), idx: 0, shown: 1, out: [], score: 0, solved: false, gained: 0 }; go('guess'); }
  function guessHTML() {
    const g = state.guess;
    const k = g.order[g.idx];
    const e = EL[k];
    const clues = e.clues.slice(0, g.shown).map((c, i) => `<li class="clue"><span class="cn">${i + 1}</span><p>${c}</p>${sayBtn(c, '')}</li>`).join('')
      + (g.shown < 4 && !g.solved ? `<li class="clue locked"><span class="cn">${g.shown + 1}</span><p>还有 ${4 - g.shown} 条线索没出现</p></li>` : '');
    const answers = ORDER.map((x, i) => {
      const isOut = g.out.includes(x);
      let cls = 'ans';
      let mark = '';
      if (g.solved) cls += x === k ? ` reveal c-${x} right` : ' dim';
      else if (isOut) { cls += ' out'; mark = '<span class="mark" aria-label="不是它">✗</span>'; }
      if (g.solved && x === k) mark = '<span class="mark" aria-label="答案">✓</span>';
      return `<button type="button" class="${cls}" data-guess="${x}" ${g.solved || isOut ? 'disabled' : ''}><span class="key">${i + 1}</span><span class="sym">${EL[x].sym}</span><span class="nm sm">${EL[x].name}</span>${mark}</button>`;
    }).join('');
    const last = g.idx + 1 >= g.order.length;
    let talk;
    if (g.solved) {
      talk = guide('happy', `<p><b>猜对啦，就是${e.name}！</b> +${g.gained} 分。${e.fun}</p><div class="actions"><button type="button" class="btn primary" data-act="gnext">${last ? '看结果 →' : '下一个谜 →'}</button></div>`, 'good');
    } else if (g.out.length) {
      talk = guide('serious', `<p>不是${EL[g.out[g.out.length - 1]].name}哦。${g.shown < 4 ? '我再给你一条线索！' : '线索都给你了，再想想！'}</p>`, 'bad');
    } else {
      talk = guide('curious', `<p>我心里想着一个元素，你能猜出是谁吗？线索越少就猜中，得分越高。现在猜中得 <b>${CLUE_POINTS[g.shown - 1]}</b> 分。</p>`);
    }
    return `
    <section class="guess">
      ${headHTML(4, '猜猜我是谁', chip('第', `${g.idx + 1} / 4 个`) + chip('总分', g.score))}
      <div aria-live="polite">${talk}</div>
      <div class="panel">
        <ol class="clues">${clues}</ol>
        <div class="answers">${answers}</div>
        ${g.solved ? '' : `<div class="actions" style="margin-top:16px"><button type="button" class="btn" data-act="clue" ${g.shown >= 4 ? 'disabled' : ''}>再给一条线索</button></div>`}
      </div>
    </section>`;
  }
  function guessPick(x) {
    const g = state.guess;
    if (!g || g.solved || g.out.includes(x)) return;
    const k = g.order[g.idx];
    if (x === k) {
      g.gained = CLUE_POINTS[g.shown - 1];
      g.score += g.gained;
      g.solved = true;
      play('good');
    } else {
      g.out.push(x);
      if (g.shown < 4) g.shown += 1;
      play('bad');
    }
    render();
    if (g.solved) burstAt($('.ans.right'), 40);
  }
  function nextGuess() {
    const g = state.guess;
    if (g.idx + 1 >= g.order.length) {
      const stars = g.score >= 300 ? 3 : g.score >= 200 ? 2 : 1;
      const improved = award('guess', stars);
      play('win');
      showResult({ id: 'guess', again: 'guess', title: stars === 3 ? '小侦探太厉害了！' : '四个谜都猜出来了！', stars, improved, lines: [`总分 ${g.score} / 400。得到 300 分以上就能拿 3 颗星。`] });
      return;
    }
    Object.assign(g, { idx: g.idx + 1, shown: 1, out: [], solved: false, gained: 0 });
    render();
    window.scrollTo({ top: 0 });
  }

  /* ================= 第 5 关 抢答赛 / 第 7 关 毕业考 ================= */
  function setupHTML() {

    if (!s.step) {

      ${guide('curious', '<p>第一步：选一个难度。入门最多拿 2 颗星，想拿 3 颗星就挑战更难的吧！</p>')}
      <ol class="steps"><li class="now"><span>1</span>选难度</li><li><span>2</span>选玩法</li></ol>

      </div>
    </section>`;
    }
    return `
    <section class="setup">
      ${headHTML(5, `抢答赛 · ${DIFFS[s.diff - 1].name}`)}
      ${guide('curious', '<p>第二步：一个人玩，还是分两队比赛？选好就开始吧！</p>')}
      <ol class="steps"><li class="done"><span>✓</span>${DIFFS[s.diff - 1].name}</li><li class="now"><span>2</span>选玩法</li></ol>
      <div class="opts" role="radiogroup" aria-label="玩法">
        <button type="button" role="radio" class="opt" data-mode="solo" aria-checked="${s.mode === 'solo'}"><b>单人挑战</b><span>10 道题。可以自己玩，也可以全班一起喊答案。</span></button>
        <button type="button" role="radio" class="opt" data-mode="team" aria-checked="${s.mode === 'team'}"><b>两队对抗</b><span>红队、蓝队轮流答题，每队 6 道。</span></button>
      </div>

      <div class="actions"><button type="button" class="btn" data-act="setup-back">← 换难度</button><button type="button" class="btn primary big" data-go="quiz">开始比赛 →</button></div>
    </section>`;

  function examIntroHTML() {
    return `
    <section class="setup">
      ${headHTML(7, '毕业考')}
      ${guide('serious', '<p>这是最后一关啦！一共 12 道题，从易到难：入门 3 道、进阶 5 道、挑战 4 道。不限时，慢慢想。答对 9 道，我就给你发“元素小博士”证书！</p>')}
      <div class="panel" style="display:grid;gap:18px">

        </div>
      </div>
    </section>`;
