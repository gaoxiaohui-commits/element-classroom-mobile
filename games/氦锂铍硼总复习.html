  function pickBalanced(pool, n) {
    // 按元素分组轮流抽题，每个元素的题差不多一样多
    const keys = shuffle([...new Set(pool.map((i) => BANK[i].el))]);
    const groups = keys.map((k) => shuffle(pool.filter((i) => BANK[i].el === k)));
    const out = [];
    for (let r = 0; out.length < n && r < 40; r++) {
      for (const g of groups) {
        if (out.length >= n) break;
        if (g[r] !== undefined) out.push(g[r]);
      }
    }
    return out;
  }
  const poolOf = (lv) => BANK.map((_, i) => i).filter((i) => BANK[i].lv === lv);
  function optsFor(it) {
    if (it.t === 'num') return it.opts.slice().sort((a, b) => a - b);
    if (it.t === 'tf') return [true, false];
    return shuffle(ORDER.slice());
  }

  function startQuiz(exam) {
    const s = state.setup;
    const mode = exam ? 'exam' : s.mode;
    const limit = (mode === 'team' ? 30 : 20) * 1000;
    const ids = exam
      ? [...shuffle(pickBalanced(poolOf(1), 3)), ...shuffle(pickBalanced(poolOf(2), 5)), ...shuffle(pickBalanced(poolOf(3), 4))]
      : shuffle(pickBalanced(poolOf(s.diff), mode === 'team' ? 12 : 10));
    state.quiz = {
      mode, diff: exam ? 0 : s.diff, timer: exam ? false : s.timer, limit, left: limit,
      qs: ids.map((i) => ({ i, order: optsFor(BANK[i]), ok: null })),
      cur: 0, ans: null, scores: [0, 0], correct: [0, 0], streak: 0, wrong: [], result: null
    };
    go('quiz');
  }

  function answerText(it) {
    if (it.t === 'num') return fmtNum(it.a) + (it.unit ? ' ' + it.unit : '');
    if (it.t === 'tf') return it.a ? '对' : '错';
    return `<b class="c-${it.a} tcol">${EL[it.a].name} ${EL[it.a].sym}</b>`;
  }

  function ansHTML(q, it) {
    const order = q.qs[q.cur].order;
    const a = q.ans;
    return order.map((v, idx) => {
      let cls = 'ans';
      let mark = '';
      let inner;
      if (it.t === 'num') inner = `<span class="num">${fmtNum(v)}${it.unit ? `<small>${it.unit}</small>` : ''}</span>`;
      else if (it.t === 'tf') inner = v ? '<span class="tfm y">✓</span><span class="nm sm">对</span>' : '<span class="tfm n">✗</span><span class="nm sm">错</span>';
      else if (a) inner = `<span class="sym">${EL[v].sym}</span><span class="nm sm">${EL[v].name}</span><span class="py">${EL[v].py}</span>`;
      else if (it.show === 'sym') inner = `<span class="sym">${EL[v].sym}</span>`;
      else if (it.show === 'name') inner = `<span class="nm">${EL[v].name}</span>`;
      else inner = `<span class="sym">${EL[v].sym}</span><span class="nm sm">${EL[v].name}</span>`;
      if (a) {
        cls += ' reveal' + (it.t === 'el' || !it.t ? ` c-${v}` : '');
        if (v === it.a) { cls += ' right'; mark = '<span class="mark" aria-label="正确答案">✓</span>'; }
        else if (a.idx === idx) { cls += ' wrong'; mark = '<span class="mark" aria-label="你选的">✗</span>'; }
        else cls += ' dim';
      }
      return `<button type="button" class="${cls}" data-ans="${idx}" ${a || q.paused ? 'disabled' : ''}><span class="key">${idx + 1}</span>${inner}${mark}</button>`;
    }).join('');
  }

  function figFor(it, mini) {
    if (!it.fig) return '';
    const z = EL[it.a].z;
    const svg = it.fig === 'orbit'
      ? orbitSVG(z, { label: '?', aria: '一个原子模型，原子核上写着问号' })
      : diagramSVG(z, { label: '+?', aria: '原子结构示意图，电子排布 ' + shellsOf(z).join('、') });
    return mini ? `<div class="mini">${svg}</div>` : `<div class="q-fig">${svg}</div>`;
  }

  function fbHTML(q, it, team) {
    const a = q.ans;
    const last = q.cur + 1 >= q.qs.length;
    const teamLabel = q.mode === 'team' ? TEAMS[team] : '';
    const head = a.ok
      ? `<b>${a.msg}</b> ${teamLabel}<span class="gain">+${a.gain}</span> 分`
      : `<b>${a.msg}</b> 正确答案是 ${answerText(it)}。`;
    return `
      <div class="fb" role="status">
        ${guide(a.ok ? 'happy' : 'serious', `<p>${head}<span class="tip">${it.tip}</span></p><div class="actions"><button type="button" class="btn primary" id="btn-next" data-act="next">${last ? '看成绩 →' : '下一题 →'}</button></div>`, a.ok ? 'good' : 'bad')}
      </div>`;
  }

  function quizHTML() {
    const q = state.quiz;
    const it = BANK[q.qs[q.cur].i];
    const team = q.mode === 'team' ? q.cur % 2 : 0;
    const isExam = q.mode === 'exam';
    const title = isExam ? '毕业考' : `抢答赛 · ${DIFFS[q.diff - 1].name}`;
    let chips;
    if (q.mode === 'team') chips = `<span class="teams">${[0, 1].map((t) => `<span class="team t${t} ${t === team ? 'on' : ''}"><span>${TEAMS[t]}</span><b>${q.scores[t]}</b></span>`).join('')}</span>`;
    else if (isExam) chips = chip('答对', q.correct[0]);
    else chips = chip('得分', q.scores[0]);
    const dots = `<span class="qcount">${q.cur + 1} / ${q.qs.length}</span><div class="dots-row" aria-hidden="true">${q.qs.map((x, i) => `<i class="${x.ok === 'skip' ? 'skip' : x.ok === true ? 'ok' : x.ok === false ? 'no' : i === q.cur ? 'now' : ''}"></i>`).join('')}</div>`;
    const pct = Math.max(0, (q.left / q.limit) * 100);
    const timer = q.timer
      ? `<div class="timer ${pct < 25 ? 'low' : ''}" aria-hidden="true"><span id="tbar" style="width:${pct}%"></span></div><span class="tsec" id="tsec" aria-hidden="true">${Math.ceil(q.left / 1000)}</span>`
      : '';
    const ctl = isExam || q.ans || !teach.ctl
      ? ''
      : `<span class="qctl">${q.timer ? `<button type="button" data-act="pause">${q.paused ? '继续' : '暂停'}</button>` : ''}<button type="button" data-act="skip">跳过</button></span>`;
    return `
    <section class="quiz">
      ${headHTML(isExam ? 7 : 5, title, chips)}
      <div class="qbar">${dots}${timer}${ctl}</div>
      ${q.paused ? '<p class="paused" role="status">已暂停。点“继续”或按 P 键接着答题。</p>' : ''}
      <div class="panel q-card">
        <p class="q-kind">${q.mode === 'team' ? `<span class="turn t${team}">${TEAMS[team]}答题</span>` : ''}<span class="tag">${it.k}</span>${it.say ? sayBtn(EL[it.a].name, '听一听') : ''}</p>
        <h3 class="q-text">${it.q}</h3>
        ${figFor(it)}
      </div>
      <div class="answers${it.t === 'tf' ? ' two' : ''}">${ansHTML(q, it)}</div>
      ${q.ans ? fbHTML(q, it, team) : ''}
    </section>`;
  }

  function answer(idx) {
    const q = state.quiz;
    if (!q || q.ans || q.paused) return;
    stopTimer();
    const cur = q.qs[q.cur];
    const it = BANK[cur.i];
    const team = q.mode === 'team' ? q.cur % 2 : 0;
    const ok = idx !== null && cur.order[idx] === it.a;
    const gain = ok ? 100 + (q.timer ? Math.round((50 * Math.max(0, q.left)) / q.limit) : 0) : 0;
    let msg;
    if (ok) {
      q.scores[team] += gain;
      q.correct[team] += 1;
      q.streak += 1;
      msg = q.mode === 'solo' && q.streak >= 3 ? `连对 ${q.streak} 题！` : pickOne(['答对了！', '太棒了！', '完全正确！', '真厉害！']);
    } else {
      q.streak = 0;
      q.wrong.push(cur.i);
      msg = idx === null ? '时间到啦！' : '差一点点！';
    }
    cur.ok = ok;
    q.ans = { idx, ok, gain, msg };
    play(ok ? 'good' : 'bad');
    render();
    if (ok) burstAt($('.ans.right'), 30);
    if (ok && q.mode === 'solo' && (q.streak === 3 || q.streak === 5 || q.streak >= 8)) toast(`连对 ${q.streak} 题！`);
    const fb = $('.fb');
    if (fb) {
      $('#btn-next')?.focus({ preventScroll: true });
      fb.scrollIntoView({ block: 'nearest', behavior: reduceMotion() ? 'auto' : 'smooth' });
    }
  }

  function nextQuestion() {
    const q = state.quiz;
    if (!q || !q.ans) return;
    if (q.cur + 1 >= q.qs.length) { finishQuiz(); return; }
    q.cur += 1;
    q.ans = null;
    q.paused = false;
    q.left = q.limit;
    render();
    window.scrollTo({ top: 0 });
  }

  // 老师用：跳过这题（不算对也不算错）
  function skipQuestion() {
    const q = state.quiz;
    if (!q || q.ans || q.mode === 'exam') return;
    q.qs[q.cur].ok = 'skip';
    q.skipped = (q.skipped || 0) + 1;
    q.streak = 0;
    q.paused = false;
    if (q.cur + 1 >= q.qs.length) { finishQuiz(); return; }
    q.cur += 1;
    q.left = q.limit;
    render();
    window.scrollTo({ top: 0 });
  }
  function togglePause() {
    const q = state.quiz;
    if (!q || q.ans || !q.timer) return;
    q.paused = !q.paused;
    render();
  }

  function finishQuiz() {
    const q = state.quiz;
    const c = q.correct[0];
    const total = Math.max(1, q.qs.length - (q.skipped || 0));
    const r = { stars: 0, improved: false, newBest: false, passed: false, sticker: false };
    if (q.mode === 'exam') {
      r.passed = c >= 9;
      if (r.passed) {
        r.stars = c >= 11 ? 3 : c >= 10 ? 2 : 1;
        r.improved = award('exam', r.stars);
        if (!prog.examPassed || c >= prog.examScore) {
          const d = new Date();
          prog.examScore = c;
          prog.examDate = `${d.getFullYear()} 年 ${d.getMonth() + 1} 月 ${d.getDate()} 日`;
        }
        prog.examPassed = true;
        saveProg();
        r.sticker = grantSticker('exam');
      }
    } else if (q.mode === 'solo') {
      r.stars = c / total >= 0.9 ? 3 : c / total >= 0.6 ? 2 : 1;
      if (q.diff === 1) r.stars = Math.min(2, r.stars);
      r.improved = award('quiz', r.stars);
      r.newBest = q.scores[0] > (prog.best || 0);
      if (r.newBest) { prog.best = q.scores[0]; saveProg(); }
    }
    if (q.mode !== 'exam') r.sticker = grantSticker('quiz');
    q.result = r;
    play(q.mode === 'exam' && !r.passed ? 'bad' : 'win');
    go('quizResult');
    if (q.mode !== 'exam' || r.passed) celebrate(r.passed ? 220 : 110);
  }

  function reviewHTML(q) {
    if (!q.wrong.length) return '';
    const items = q.wrong.map((i) => {
      const it = BANK[i];
      return `<li><p class="rq">${it.q}</p>${figFor(it, true)}<p class="ra">答案：${answerText(it)} · ${it.tip}</p></li>`;
    }).join('');
    return `<details class="review"><summary>再看看答错的 ${q.wrong.length} 道题</summary><ol>${items}</ol></details>`;
  }

  function quizResultHTML() {
    const q = state.quiz;
    const r = q.result || {};
    const total = q.qs.length - (q.skipped || 0);
    const got = r.sticker ? gotHTML(q.mode === 'exam' ? 'exam' : 'quiz') : '';
    if (q.mode === 'team') {
      const [a, b] = q.scores;
      const win = a === b ? -1 : (a > b ? 0 : 1);
      const per = [0, 1].map((t) => q.qs.filter((x, i) => i % 2 === t && x.ok !== 'skip').length);
      return `
      <section class="panel result">
        <img class="r-avatar" src="${XH.happy}" alt="小氦（开心）" width="120" height="120">
        <h2>${win < 0 ? '平局！两队一样棒' : TEAMS[win] + '赢了！'}</h2>
        <div class="team-scores">
          ${[0, 1].map((t) => `<div class="team-box t${t} ${t === win ? 'win' : ''}"><span class="tn">${TEAMS[t]}</span><span class="ts">${q.scores[t]}</span><span class="tc">答对 ${q.correct[t]} / ${per[t]} 题</span></div>`).join('')}
        </div>
        ${got}
        ${reviewHTML(q)}
        <div class="actions">
          <button type="button" class="btn primary" data-go="quiz">再比一局</button>
          <button type="button" class="btn" data-go="setup">换难度</button>
          <button type="button" class="btn" data-go="home">回冒险地图</button>
        </div>
      </section>`;
    }
    const c = q.correct[0];
    if (q.mode === 'exam') {
      return `
      <section class="panel result">
        <img class="r-avatar" src="${r.passed ? XH.happy : XH.serious}" alt="小氦（${r.passed ? '开心' : '认真'}）" width="120" height="120">
        <h2>${r.passed ? '恭喜你，通过了！' : '还差一点点'}</h2>
        ${r.passed ? starsHTML(r.stars, 'big') : ''}
        <div class="big-score">${c}<small>/ ${total} 题</small></div>
        <p class="muted">${r.passed ? '你现在是“元素小博士”了，快来领证书吧！' : `答对 9 题才能通过，你答对了 ${c} 题。复习一下再来，我等你！`}</p>
        ${got}
        ${reviewHTML(q)}
        <div class="actions">
          ${r.passed ? '<button type="button" class="btn primary" data-go="cert">领取证书 →</button>' : '<button type="button" class="btn primary" data-go="exam">再考一次</button><button type="button" class="btn" data-go="learn">去复习</button>'}
          <button type="button" class="btn" data-go="home">回冒险地图</button>
        </div>
      </section>`;
    }
    const titles = ['再练练，你一定行！', '很不错！', '太厉害了！'];
    return `
    <section class="panel result">
      <img class="r-avatar" src="${r.stars >= 2 ? XH.happy : XH.serious}" alt="小氦" width="120" height="120">
      <h2>${titles[r.stars - 1]}</h2>
      ${starsHTML(r.stars, 'big')}
      <div class="big-score">${q.scores[0]}<small>分</small></div>
      <p class="muted">答对 ${c} / ${total} 题 · 最高分 ${prog.best || q.scores[0]}${q.diff === 1 ? ' · 想拿 3 颗星，试试进阶或挑战' : ''}</p>
      ${r.newBest ? '<span class="new-best">新纪录！</span>' : ''}
      ${got}
      ${reviewHTML(q)}
      <div class="actions">
        <button type="button" class="btn primary" data-go="build">下一关：搭原子 →</button>
        <button type="button" class="btn" data-go="quiz">再来一局</button>
        <button type="button" class="btn" data-go="setup">换难度</button>
      </div>
    </section>`;
  }

  /* ---------- 计时 ---------- */
  let timerId = null;
  let lastTick = 0;
  function stopTimer() { if (timerId) { clearInterval(timerId); timerId = null; } }
  function startTimer() {
    stopTimer();
    lastTick = performance.now();
    timerId = setInterval(() => {
      const q = state.quiz;
      if (!q || q.ans || state.screen !== 'quiz') { stopTimer(); return; }
      const now = performance.now();
      const before = Math.ceil(q.left / 1000);
      q.left -= now - lastTick;
      lastTick = now;
      const after = Math.ceil(Math.max(0, q.left) / 1000);
      if (after !== before && after > 0 && after <= 3) play('tick');
      paintTimer();
      if (q.left <= 0) { q.left = 0; answer(null); }
    }, 100);
  }
  function paintTimer() {
    const q = state.quiz;
    const bar = $('#tbar');
    const sec = $('#tsec');
    if (!q || !bar || !sec) return;
    const pct = Math.max(0, (q.left / q.limit) * 100);
    bar.style.width = pct + '%';
    bar.parentElement.classList.toggle('low', pct < 25);
    sec.textContent = Math.ceil(Math.max(0, q.left) / 1000);
  }
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) stopTimer();
    else if (state.screen === 'quiz' && state.quiz && state.quiz.timer && !state.quiz.ans && !state.quiz.paused) startTimer();
  });

  /* ================= 第 6 关 搭原子 ================= */
  // 一步一步搭：先放质子，再放中子，最后放电子
  const BUILD_STEPS = [
    { key: 'p', label: '质子', sub: '带正电，在原子核里' },
    { key: 'n', label: '中子', sub: '不带电，也在原子核里' },
    { key: 'e', label: '电子', sub: '带负电，绕着原子核转' }
  ];
  const newAtom = () => ({ phase: 0, p: 0, n: 0, e: 0, miss: 0, hints: 0, solved: false, phaseOk: false, msg: null });
  function startBuild() {
    state.build = Object.assign({ order: shuffle(ORDER.slice()), idx: 0, first: 0 }, newAtom());
    go('build');
  }
  const counterHTML = (key, label, sub, val) => `
    <div class="counter">
      <span class="c-lab"><b><i class="dot dot-${key}"></i>${label}</b><small>${sub}</small></span>
      <span class="stepper"><button type="button" data-step="${key}" data-d="-1" aria-label="减少一个${label}" ${val <= 0 ? 'disabled' : ''}>−</button><output aria-live="polite">${val}</output><button type="button" data-step="${key}" data-d="1" aria-label="增加一个${label}" ${val >= 10 ? 'disabled' : ''}>+</button></span>
    </div>`;
  function buildHTML() {
    const b = state.build;
    const k = b.order[b.idx];
    const t = EL[k];
    return `
    <section class="build">
      ${headHTML(6, '搭原子', chip('第', `${b.idx + 1} / 4 个`))}
      <div id="b-guide" aria-live="polite"></div>
      <div class="panel">
        <ol class="steps" id="b-steps" aria-label="搭原子的步骤"></ol>
        <div class="build-main">
          <div class="build-left">
            <div class="build-target">${tileHTML(k, '', 'aria-hidden="true"')}<span>目标：最常见的 <b class="c-${k} tcol">${t.name}</b> 原子</span></div>
            <div id="b-atom" style="width:100%;display:flex;justify-content:center"></div>
          </div>
          <div class="build-ctrl" id="b-ctrl"></div>
        </div>
      </div>
    </section>`;
  }
  const signed = (n) => (n === 0 ? '0' : n > 0 ? '+' + n : '−' + Math.abs(n));
  function updateBuild() {
    const b = state.build;
    const atom = $('#b-atom');
    if (!atom) return;
    const t = EL[b.order[b.idx]];
    const S = BUILD_STEPS[b.phase];
    $('#b-steps').innerHTML = BUILD_STEPS.map((s, j) => {
      const done = b.solved || j < b.phase || (j === b.phase && b.phaseOk);
      return `<li class="${done ? 'done' : ''} ${j === b.phase && !done ? 'now' : ''}"><span>${done ? '✓' : j + 1}</span>放${s.label}</li>`;
    }).join('');
    atom.innerHTML = orbitSVG(b.p, { e: b.e, rings: b.phase === 2 || b.solved ? 2 : 0, cluster: [b.p, b.n], aria: `你搭的原子：${b.p} 个质子，${b.n} 个中子，${b.e} 个电子` });
    const doneSteps = BUILD_STEPS.filter((s, j) => b.solved || j < b.phase || (j === b.phase && b.phaseOk));
    const chips = doneSteps.length ? `<div class="done-chips">${doneSteps.map((s) => `<span class="done-chip"><i class="dot dot-${s.key}"></i>${s.label} <b>${b[s.key]}</b> ✓</span>`).join('')}</div>` : '';
    let read = '';
    if (!b.solved && !b.phaseOk) {
      if (b.phase === 0) {
        const w = who(b.p);
        read = b.p === 0 ? '原子核里还没有质子' : `质子数 ${b.p} → 这是 <b class="${w.k ? 'c-' + w.k + ' tcol' : ''}">${w.name} ${w.sym}</b>`;
      } else if (b.phase === 1) {
        read = `质子 + 中子 = ${b.p} + ${b.n} = <b>${b.p + b.n}</b>`;
      } else {
        const c = b.p - b.e;
        read = `质子 ${b.p} 个，电子 ${b.e} 个 → 电荷 <b>${signed(c)}</b>，${c === 0 ? '不带电' : '还带电'}`;
      }
    }
    const last = b.idx + 1 >= b.order.length;
    let acts;
    if (b.solved) acts = `<button type="button" class="btn primary" data-act="bnext">${last ? '看结果 →' : '搭下一个 →'}</button>`;
    else if (b.phaseOk) acts = `<button type="button" class="btn primary" data-act="bphase">下一步：放${BUILD_STEPS[b.phase + 1].label} →</button>`;
    else acts = '<button type="button" class="btn primary" data-act="check">检查</button><button type="button" class="btn" data-act="hint">小氦，给点提示</button>';
    $('#b-ctrl').innerHTML = `
      ${chips}
      ${b.solved || b.phaseOk ? '' : counterHTML(S.key, S.label, S.sub, b[S.key])}
      ${read ? `<p class="readout">${read}</p>` : ''}
      <div class="actions">${acts}</div>`;
    const m = b.msg;
    const intro = [
      `请帮我搭一个最常见的<b>${t.name}</b>原子！第一步：原子核里要放几个质子？`,
      `第二步：往原子核里放中子。想一想，${t.name}的相对原子质量是多少？`,
      '最后一步：在外面放电子，让原子不带电。'
    ][b.phase];
    $('#b-guide').innerHTML = m ? guide(m.mood, `<p>${m.text}</p>`, m.tone) : guide('curious', `<p>${intro}</p>`);
  }
  function checkBuild() {
    const b = state.build;
    const t = EL[b.order[b.idx]];
    const key = BUILD_STEPS[b.phase].key;
    const want = key === 'n' ? t.n : t.z;
    if (b[key] === want) {
      if (b.phase === 2) {
        b.solved = true;
        if (!b.miss) b.first += 1;
        b.msg = { mood: 'happy', tone: 'good', text: `<b>搭好了！</b>${t.name}原子：${t.z} 个质子、${t.n} 个中子、${t.z} 个电子，电子排布是 ${shellsOf(t.z).join('、')}。` };
      } else {
        b.phaseOk = true;
        b.msg = b.phase === 0
          ? { mood: 'happy', tone: 'good', text: `<b>对了！</b>${t.name}是 ${t.z} 号元素，原子核里有 ${t.z} 个质子。` }
          : { mood: 'happy', tone: 'good', text: `<b>对了！</b>${t.z} 个质子 + ${t.n} 个中子 = ${t.massR}，正好是${t.name}的相对原子质量。` };
      }
      play('good');
    } else {
      b.miss += 1;
      if (b.phase === 0) {
        const w = who(b.p);
        b.msg = { mood: 'serious', tone: 'bad', text: b.p === 0 ? '原子核里还没有质子哦，点“+”加几个。' : `质子数是 ${b.p}，这是${w.name}，不是${t.name}。${b.p < t.z ? '再加几个试试。' : '多了，减掉一些。'}` };
      } else if (b.phase === 1) {
        b.msg = { mood: 'serious', tone: 'bad', text: `${t.name}的相对原子质量约为 ${t.massR}。质子 + 中子要等于 ${t.massR}，现在是 ${b.p + b.n}。` };
      } else {
        b.msg = { mood: 'serious', tone: 'bad', text: `电子有 ${b.e} 个，质子有 ${b.p} 个。它们要一样多，原子才不带电。` };
      }
      play('bad');
    }
    updateBuild();
    if (b.solved) burstAt($('#b-atom'), 50);
    else if (b.phaseOk) burstAt($('#b-atom'), 18);
  }
  function buildHint() {
    const b = state.build;
    const t = EL[b.order[b.idx]];
    const hints = [
      `${t.name}是 ${t.z} 号元素。原子序数 = 质子数。`,
      `中子数 = 相对原子质量 − 质子数 = ${t.massR} − ${t.z}。`,
      '中性原子里，电子数 = 质子数。'
    ];
    b.msg = { mood: 'curious', tone: '', text: `提示：${hints[b.phase]}` };
    b.hints += 1;
    updateBuild();
  }
  function nextPhase() {
    const b = state.build;
    if (!b.phaseOk || b.phase >= 2) return;
    b.phase += 1;
    b.phaseOk = false;
    b.msg = null;
    updateBuild();
  }
  function nextBuild() {
    const b = state.build;
    if (b.idx + 1 >= b.order.length) {
      const stars = b.first >= 4 ? 3 : b.first >= 2 ? 2 : 1;
      const improved = award('build', stars);
      play('win');
      showResult({
        id: 'build', again: 'build', title: '四种原子全部搭好了！', stars, improved,
        lines: [`一次都没搭错的有 ${b.first} 个。质子数从 2 到 5，元素就从氦变成锂、铍、硼。`],
        extra: `<div class="atom-row">${ORDER.map((k) => `<figure class="c-${k}">${orbitSVG(EL[k].z, { cluster: [EL[k].z, EL[k].n], aria: EL[k].name + '原子' })}<figcaption>${EL[k].name} ${EL[k].sym}</figcaption></figure>`).join('')}</div>`
      });
      return;
    }
    Object.assign(b, { idx: b.idx + 1 }, newAtom());
    render();
    window.scrollTo({ top: 0 });
  }

  /* ================= 证书 ================= */
  function certHTML() {
    if (!prog.examPassed) {
      return `
      <section class="cert-wrap">
        ${headHTML(7, '元素小博士证书')}
        ${guide('serious', '<p>证书还没解锁哦。通过第 7 关“毕业考”（12 题答对 9 题），我就把证书发给你！</p><div class="actions"><button type="button" class="btn primary" data-go="examIntro">去毕业考</button></div>')}
      </section>`;
    }
    const name = prog.name.trim() || '__________';
    return `
    <section class="cert-wrap">
      ${headHTML(7, '元素小博士证书')}
      ${guide('happy', '<p>恭喜你！这张证书是我亲手颁发给你的。可以截图保存，或者请老师拍照留念。</p>', 'good')}
      <label class="field" for="cert-name"><span>证书上的名字</span><input id="cert-name" type="text" maxlength="12" value="${esc(prog.name)}" placeholder="写上你的名字" autocomplete="off"></label>
      <div class="cert">
        <p class="c-top">元素周期表启蒙课</p>
        <h2 class="c-title">元素小博士</h2>
        <p class="c-sub">证书</p>
        <p class="person" id="cert-person">${esc(name)}</p>
        <p class="c-text">认识了氦、锂、铍、硼四种元素，能说出它们的符号、读音、原子结构和用途，在毕业考中答对 ${prog.examScore} / 12 题，特发此证。</p>
        <div class="c-tiles" aria-hidden="true">${ORDER.map((k) => tileHTML(k)).join('')}</div>
        <div class="c-foot">
          <span class="issuer"><img src="${XH.happy}" alt="" width="40" height="40">颁发人：小氦</span>
          <span>老师：__________</span>
          <span>${prog.examDate}</span>
        </div>
        <div class="stamp" aria-hidden="true"><span>合格<small>元素小博士</small></span></div>
      </div>
      <div class="actions"><button type="button" class="btn" data-go="home">回冒险地图</button></div>
    </section>`;
  }

  /* ================= 题库一览 ================= */
  function bankHTML() {
    const groups = DIFFS.map((d) => {
      const items = BANK.filter((it) => it.lv === d.id);
      return `
      <details ${d.id === 1 ? 'open' : ''}>
        <summary>${d.name}<small>${items.length} 道题 · ${d.desc}</small></summary>
        <ol>${items.map((it) => `<li><span class="bk">${it.k}</span>${it.q}${it.fig ? '（看图）' : ''}${it.t === 'num' ? `（选项：${it.opts.map(fmtNum).join(' / ')}）` : ''}<span class="ba">答案：${answerText(it)}</span></li>`).join('')}</ol>
      </details>`;
    }).join('');
    return `
    <section class="bank">
      ${headHTML(0, '题库一览', chip('一共', `${BANK.length} 道题`), 'teacher')}
      <p class="muted" style="margin:0 0 4px">抢答赛和毕业考都从这里随机抽题。</p>
      ${groups}
    </section>`;
  }

  /* ================= 页面切换 ================= */
  const SCREENS = {
    home: homeHTML, learn: learnHTML, match: matchHTML, place: placeHTML, guess: guessHTML,
    setup: setupHTML, examIntro: examIntroHTML, quiz: quizHTML, quizResult: quizResultHTML,
    build: buildHTML, result: resultHTML, cert: certHTML, bank: bankHTML, book: bookHTML, teacher: teacherHTML
  };
  const NEEDS = { quiz: 'quiz', quizResult: 'quiz', build: 'build', match: 'match', place: 'place', guess: 'guess', result: 'result' };

  let entering = false;
  function render() {
    stopTimer();
    let s = state.screen;
    if (!SCREENS[s] || (NEEDS[s] && !state[NEEDS[s]])) s = state.screen = 'home';
    if (s !== 'teacher') state.confirmReset = false;
    // 只有换页面时才播放进场动画，同一页里刷新不动
    view.classList.toggle('enter', entering);
    entering = false;
    view.innerHTML = SCREENS[s]();
    if (s === 'build') updateBuild();
    if (s === 'match') {
      const m = state.match;
      if (m.lock) { m.open = []; m.lock = false; }
      paintCards();
    }
    const q = state.quiz;
    if (s === 'quiz' && q.timer && !q.ans && !q.paused && !document.hidden) startTimer();
    renderOverlay();
    renderBoard();
  }

  function go(screen) {
    state.screen = screen;
    entering = true;
    render();
    window.scrollTo({ top: 0 });
    if (screen === 'cert' && prog.examPassed && !prog.endingSeen) {
      state.overlay = { type: 'ending' };
      renderOverlay();
      setTimeout(() => rain(200), 300);
    }
  }

  const STARTERS = { match: startMatch, place: startPlace, guess: startGuess, build: startBuild, quiz: () => startQuiz(false), exam: () => startQuiz(true) };
  // 从地图进入关卡的按钮 → 对应哪一关（第一次进入先看故事章节）
  const GO_LEVEL = { learn: 'learn', match: 'match', place: 'place', guess: 'guess', setup: 'quiz', build: 'build', examIntro: 'exam' };
  function navigate(goKey, el) {
    if (goKey === 'learn' && el) { state.learn = ORDER.indexOf(el); state.learnStep = 0; }
    if (goKey === 'setup') state.setup.step = 0;
    if (STARTERS[goKey]) STARTERS[goKey]();
    else go(goKey);
  }

  /* ================= 故事章节卡 ================= */
  function renderOverlay() {
    const box = $('#overlay');
    const o = state.overlay;
    document.body.classList.toggle('ov-open', !!o);
    if (!o) { box.innerHTML = ''; return; }
    let label;
    let title;
    let paras;
    let art;
    let btn;
    if (o.type === 'prologue') {
      label = '故事开始'; title = STORY.prologue.title; paras = STORY.prologue.text; btn = '我来帮你！';
      art = `<div class="ov-art"><img src="${XH.body}" alt="小氦举着氦气球" width="499" height="900"></div>`;
    } else if (o.type === 'ending') {
      label = '大结局'; title = STORY.ending.title; paras = STORY.ending.text; btn = '太好了！';
      art = `<div class="ov-art fly"><img src="${XH.body}" alt="小氦和她的气球飘了起来" width="499" height="900"></div>`;
    } else {
      const L = LEVELS.find((x) => x.id === o.id);
      label = `第 ${L.n} 章`; title = L.chap; paras = [L.story]; btn = `出发！去第 ${L.n} 关`;
      art = `<div class="ov-art head"><img src="${XH.happy}" alt="小氦（开心）" width="180" height="180"></div>`;
    }
    box.innerHTML = `
      <div class="overlay" role="dialog" aria-modal="true" aria-labelledby="ov-title">
        <div class="ov-card">
          ${art}
          <div class="ov-text">
            <p class="ov-chap">${label}</p>
            <h2 id="ov-title">${title}</h2>
            ${paras.map((p) => `<p class="story">${p}</p>`).join('')}
            <div class="actions"><button type="button" class="btn primary big" data-act="ov-go">${btn}</button>${sayBtn(paras.join(''), '读给我听')}</div>
          </div>
        </div>
      </div>`;
    box.querySelector('[data-act="ov-go"]')?.focus({ preventScroll: true });
  }
  function closeOverlay() {
    if (canSay) { try { speechSynthesis.cancel(); } catch (e) { /* 没事 */ } }
    state.overlay = null;
    renderOverlay();
  }
  function overlayGo() {
    const o = state.overlay;
    if (!o) return;
    closeOverlay();
    if (o.type === 'prologue') { prog.storySeen = true; saveProg(); }
    else if (o.type === 'ending') { prog.endingSeen = true; saveProg(); burstAt($('.cert'), 60); }
    else { prog.chapters[o.id] = true; saveProg(); navigate(o.go, o.el); }
  }

  /* ================= 全班计分板 ================= */
  const GROUPS = [{ name: '红组', c: '#E0544C' }, { name: '蓝组', c: '#3D6AD6' }, { name: '黄组', c: '#D98A0B' }, { name: '绿组', c: '#2A9658' }];
  function renderBoard() {
    const box = $('#board');
    document.body.classList.toggle('has-board', !!teach.board);
    if (!teach.board) { box.innerHTML = ''; return; }
    box.innerHTML = `
      <div class="board-bar" role="region" aria-label="全班计分板">
        <span class="bb-title">计分板</span>
        ${GROUPS.slice(0, teach.groups).map((g, i) => `<span class="bb-team" style="--tc:${g.c}"><span class="bb-name">${g.name}</span><button type="button" data-score="${i}" data-d="-1" aria-label="${g.name}减 1 分">−</button><b>${teach.scores[i] || 0}</b><button type="button" data-score="${i}" data-d="1" aria-label="${g.name}加 1 分">+</button></span>`).join('')}
        <button type="button" class="bb-x ${state.boardConfirm ? 'warn' : ''}" data-act="board-reset">${state.boardConfirm ? '确定清零？' : '清零'}</button>
        <button type="button" class="bb-x" data-act="board-hide">收起</button>
      </div>`;
  }

  /* ================= 顶栏工具 ================= */
  const soundBtn = $('#btn-sound');
  const fullBtn = $('#btn-full');
  let lastStars = null;
  function paintTools() {
    document.documentElement.classList.toggle('big', !!teach.big);
    const total = totalStars();
    const pill = $('#star-count');
    if (lastStars !== null && total > lastStars) {
      pill.classList.remove('bump');
      void pill.offsetWidth;
      pill.classList.add('bump');
    }
    lastStars = total;
    soundBtn.innerHTML = state.muted ? ICON.off : ICON.on;
    soundBtn.setAttribute('aria-pressed', String(!state.muted));
    soundBtn.title = state.muted ? '声音：关' : '声音：开';
    const fs = !!document.fullscreenElement;
    fullBtn.innerHTML = fs ? ICON.exit : ICON.full;
    fullBtn.title = fs ? '退出全屏' : '全屏';
    fullBtn.setAttribute('aria-label', fullBtn.title);
    fullBtn.hidden = !document.fullscreenEnabled;
    pill.innerHTML = `<b>★</b> ${total} / ${MAX_STARS}`;
  }
  soundBtn.addEventListener('click', () => {
    state.muted = !state.muted;
    store.set('hlbb-muted', state.muted);
    if (!state.muted) unlockAudio();
    paintTools();
  });
  fullBtn.addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen?.().catch(() => {});
    else document.documentElement.requestFullscreen?.().catch(() => { fullBtn.hidden = true; });
  });
  document.addEventListener('fullscreenchange', paintTools);

  /* ================= 点击和键盘 ================= */
  view.addEventListener('click', onClick);
  $('.brand').addEventListener('click', onClick);
  $('#overlay').addEventListener('click', onClick);
  $('#board').addEventListener('click', onClick);
  $('#star-count').addEventListener('click', onClick);

  function onClick(ev) {
    const t = ev.target.closest('button');
    if (!t) return;
    unlockAudio();
    const d = t.dataset;
    if (d.say !== undefined) { say(d.say); return; }
    if (d.go) {
      const lv = GO_LEVEL[d.go];
      if (lv && !prog.chapters[lv] && !teach.nostory) {
        state.overlay = { type: 'chapter', id: lv, go: d.go, el: d.el || '' };
        renderOverlay();
        return;
      }
      navigate(d.go, d.el);
      return;
    }
    if (d.score !== undefined) {
      const i = Number(d.score);
      teach.scores[i] = Math.max(0, (teach.scores[i] || 0) + Number(d.d));
      saveTeach();
      state.boardConfirm = false;
      renderBoard();
      if (Number(d.d) > 0) { play('good'); burstAt($(`#board [data-score="${i}"][data-d="1"]`), 18); }
      return;
    }
    if (d.learn !== undefined) {
      state.learn = Number(d.learn);
      state.learnStep = Number(d.lstep || 0);
      render();
      if (d.scroll) window.scrollTo({ top: 0 });
      else view.querySelector('[role="tab"][aria-selected="true"]')?.focus({ preventScroll: true });
      return;
    }
    if (d.mode) { state.setup.mode = d.mode; render(); view.querySelector(`[data-mode="${d.mode}"]`)?.focus({ preventScroll: true }); return; }
    if (d.diff) { state.setup.diff = Number(d.diff); state.setup.step = 1; entering = true; render(); view.querySelector('[data-mode][aria-checked="true"]')?.focus({ preventScroll: true }); return; }
    if (d.ans !== undefined) { answer(Number(d.ans)); return; }
    if (d.card !== undefined) { flipCard(Number(d.card)); return; }
    if (d.pick) {
      const p = state.place;
      p.sel = p.sel === d.pick ? null : d.pick;
      p.bump = null; p.just = null; p.msg = null;
      render();
      view.querySelector(`[data-pick="${d.pick}"]`)?.focus({ preventScroll: true });
      return;
    }
    if (d.slot) { placeAt(d.slot); return; }
    if (d.guess) { guessPick(d.guess); return; }
    if (d.step) {
      const b = state.build;
      const v = b[d.step] + Number(d.d);
      if (b.solved || v < 0 || v > 10) return;
      b[d.step] = v;
      b.msg = null;
      updateBuild();
      // 面板重画了，把焦点放回刚才按的按钮，方便连续按
      view.querySelector(`[data-step="${d.step}"][data-d="${d.d}"]:not(:disabled)`)?.focus({ preventScroll: true });
      return;
    }
    switch (d.act) {
      case 'next': nextQuestion(); break;
      case 'mnext': nextMatchRound(); break;
      case 'pnext': nextPlaceRound(); break;
      case 'clue': if (state.guess.shown < 4) { state.guess.shown += 1; render(); } break;
      case 'gnext': nextGuess(); break;
      case 'check': checkBuild(); break;
      case 'hint': buildHint(); break;
      case 'bnext': nextBuild(); break;
      case 'reset': state.confirmReset = true; render(); break;
      case 'reset-no': state.confirmReset = false; render(); break;
      case 'setup-back': state.setup.step = 0; entering = true; render(); break;
      case 'bphase': nextPhase(); break;
      case 'pause': togglePause(); break;
      case 'skip': skipQuestion(); break;
      case 'story': state.overlay = { type: 'prologue' }; renderOverlay(); break;
      case 'ov-go': overlayGo(); break;
      case 'board-reset':
        if (state.boardConfirm) { teach.scores = [0, 0, 0, 0]; saveTeach(); state.boardConfirm = false; }
        else {
          state.boardConfirm = true;
          setTimeout(() => { if (state.boardConfirm) { state.boardConfirm = false; renderBoard(); } }, 3000);
        }
        renderBoard();
        break;
      case 'board-hide': teach.board = false; saveTeach(); render(); break;
      case 'reset-yes':
        prog = blankProg();
        saveProg();
        state.seen = {};
        state.confirmReset = false;
        paintTools();
        render();
        break;
      default: break;
    }
  }

  view.addEventListener('change', (ev) => {
    const id = ev.target.id;
    if (id === 'opt-timer') state.setup.timer = ev.target.checked;
    else if (id === 'teach-big') { teach.big = ev.target.checked; saveTeach(); paintTools(); }
    else if (id === 'teach-board') { teach.board = ev.target.checked; saveTeach(); renderBoard(); }
    else if (id === 'teach-groups') { teach.groups = Number(ev.target.value); saveTeach(); renderBoard(); }
    else if (id === 'teach-nostory') { teach.nostory = ev.target.checked; saveTeach(); }
    else if (id === 'teach-ctl') { teach.ctl = ev.target.checked; saveTeach(); }
  });
  view.addEventListener('input', (ev) => {
    if (ev.target.id === 'exam-name' || ev.target.id === 'cert-name') {
      prog.name = ev.target.value.slice(0, 12);
      saveProg();
      const person = $('#cert-person');
      if (person) person.textContent = prog.name.trim() || '__________';
    }
  });

  document.addEventListener('keydown', (ev) => {
    if (ev.metaKey || ev.ctrlKey || ev.altKey) return;
    if (state.overlay) { if (ev.key === 'Escape') closeOverlay(); return; }
    if (ev.target.closest && ev.target.closest('input, textarea, select')) return;
    const onButton = ev.target.closest && ev.target.closest('button, summary');
    if (state.screen === 'quiz' && state.quiz) {
      const q = state.quiz;
      const n = q.qs[q.cur].order.length;
      const num = Number(ev.key);
      if (!q.ans && (ev.key === 'p' || ev.key === 'P') && q.timer && q.mode !== 'exam') { togglePause(); return; }
      if (!q.ans && num >= 1 && num <= n) { unlockAudio(); answer(num - 1); }
      else if (q.ans && (ev.key === 'Enter' || ev.key === ' ') && !onButton) { ev.preventDefault(); nextQuestion(); }
    } else if (state.screen === 'guess' && state.guess) {
      const num = Number(ev.key);
      if (num >= 1 && num <= 4) { unlockAudio(); guessPick(ORDER[num - 1]); }
      else if (state.guess.solved && (ev.key === 'Enter' || ev.key === ' ') && !onButton) { ev.preventDefault(); nextGuess(); }
    } else if (state.screen === 'learn' && (ev.key === 'ArrowLeft' || ev.key === 'ArrowRight')) {
      const s = state.learnStep || 0;
      const t = ev.key === 'ArrowRight' ? learnNext(state.learn, s) : learnPrev(state.learn, s);
      if (!t) return;
      state.learn = t.i;
      state.learnStep = t.s;
      render();
    }
  });

  /* ================= 启动（页面更新时保留进度） ================= */
  window.claude?.hot?.snapshot?.(() => ({ state: JSON.parse(JSON.stringify(state)), prog: JSON.parse(JSON.stringify(prog)), teach: JSON.parse(JSON.stringify(teach)) }));
  function start(data) {
    if (data && data.state) {
      try {
        Object.assign(state, data.state);
        if (data.prog) prog = Object.assign(blankProg(), data.prog);
        if (data.teach) teach = Object.assign(blankTeach(), data.teach);
      } catch (e) { /* 用默认状态 */ }
    }
    // 第一次打开：先讲开场故事
    if (!prog.storySeen && !teach.nostory && state.screen === 'home' && !state.overlay) state.overlay = { type: 'prologue' };
    paintTools();
    entering = true;
    render();
  }
  window.claude?.hot?.ready ? window.claude.hot.ready(start) : start(window.claude?.hot?.data ?? {});
})();

});
}
</script>
</body>
</html>
