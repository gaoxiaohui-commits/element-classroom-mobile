<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>元素小课堂</title>
<style>
  /* Layout: 小氦在上面打招呼，下面四张元素方块按原子序数排好，最后是总复习按钮。只做浅色一种主题。 */
  :root { color-scheme: light; --bg: #EEF6F8; --ink: #1C3442; --muted: #5B7380; --brand: #1A8DA2; --brand-ink: #0E6576;
    --display: "ZCOOL KuaiLe", "PingFang SC", "Microsoft YaHei", sans-serif; --sym: "Fredoka", "Avenir Next", system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.6 "PingFang SC", "Microsoft YaHei", system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 32px 48px; display: grid; gap: 22px; justify-items: center; text-align: center; }
  .avatar { width: 110px; height: 110px; border-radius: 50%; box-shadow: 0 0 0 4px #fff, 0 12px 26px -16px rgba(18,74,92,.6); }
  h1 { margin: 0; font: clamp(36px, 7vw, 52px)/1.2 var(--display); font-weight: normal; text-wrap: balance; }
  p { margin: 0; color: var(--muted); font-size: 17px; }
  .grid { width: 100%; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
  .card { position: relative; aspect-ratio: 1 / 1.1; display: grid; place-content: center; gap: 4px; border-radius: 22px; text-decoration: none; color: var(--ink);
    background: linear-gradient(165deg, color-mix(in srgb, var(--c) 5%, #fff), color-mix(in srgb, var(--c) 18%, #fff));
    box-shadow: inset 0 0 0 3px var(--c), 0 5px 0 color-mix(in srgb, var(--c) 45%, #fff), 0 16px 28px -18px var(--c); transition: transform .15s; }
  .card:hover { transform: translateY(-4px); }
  .card:focus-visible, .review:focus-visible { outline: 3px solid var(--brand); outline-offset: 4px; }
  .z { position: absolute; top: 12px; left: 16px; font: 600 18px var(--sym); color: var(--c); }
  .sym { font: 600 clamp(44px, 9vw, 64px)/1 var(--sym); color: var(--c); }
  .nm { font: clamp(26px, 5vw, 34px)/1.1 var(--display); }
  .py { font-size: 15px; color: var(--muted); }
  .review { display: inline-flex; padding: 14px 26px; border-radius: 999px; text-decoration: none; font-weight: 700; color: #fff;
    background: linear-gradient(180deg, #26A2B7, #168699); box-shadow: 0 4px 0 var(--brand-ink); }
  @media (max-width: 600px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  @media (prefers-reduced-motion: reduce) { .card { transition: none; } }
</style>

if (window.parent === window || !window.parent.ElementAccounts) location.replace('../index.html');
</script>
