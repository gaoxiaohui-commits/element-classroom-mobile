<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>氢氢的氢元素探险</title>
<style>
/* Layout: one-screen game — top bar / scrolling stage / dialogue dock with Qingqing's portrait.
   Look: a chemistry lab notebook (faint graph paper) washed with the character's watercolour aqua, mint and spark-yellow. */
:root {
  --paper: #f1f7f9;
  --paper-2: #e3eff3;
  --card: #ffffff;
  --line: #c6dbe2;
  --ink: #14313b;
  --ink-2: #47656f;
  --ink-3: #58737d;
  --aqua: #1a8fa4;
  --aqua-ink: #0d6376;
  --aqua-soft: #d2edf2;
  --mint: #5ec7a3;
  --mint-soft: #daf4e9;
  --spark: #e2a92c;
  --spark-soft: #fbefcf;
  --coral: #d9573f;
  --coral-soft: #fbe0da;
  --ok: #1f8e64;
  --ok-soft: #d6f0e4;
  --on-accent: #ffffff;
  /* apparatus */
  --glass: rgba(160, 210, 226, 0.26);
  --glass-stroke: #6c9dac;
  --water: rgba(88, 178, 210, 0.34);
  --water-stroke: #4fa3c0;
  --flame: #62aefc;
  --flame-core: #dcefff;
  --cuo: #262626;
  --cu: #c4512f;
  --zn: #97a5ab;
  --wood: #c89a62;
  --grid: rgba(26, 143, 164, 0.075);
  --wash-1: rgba(94, 199, 163, 0.18);
  --wash-2: rgba(26, 143, 164, 0.14);
  --wash-3: rgba(226, 169, 44, 0.12);
  --scrim: rgba(241, 247, 249, 0.72);
  --shadow: 0 12px 32px -14px rgba(16, 70, 90, 0.32);
  --shadow-s: 0 4px 12px -6px rgba(16, 70, 90, 0.28);
  --f-display: "ZCOOL KuaiLe", "YouYuan", "Yuanti SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --f-body: "Noto Sans SC", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
  --f-num: "Nunito", "Avenir Next", "Segoe UI", "PingFang SC", sans-serif;
  --r-s: 10px;
  --r-m: 16px;
  --r-l: 24px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0b1920; --paper-2: #11242c; --card: #142a33; --line: #26454f;
    --ink: #e1f0f4; --ink-2: #a6c2ca; --ink-3: #7f9ca6;
    --aqua: #3fbcd2; --aqua-ink: #8adbe8; --aqua-soft: #12394380;
    --mint: #62d3ad; --mint-soft: #143a30;
    --spark: #f0c057; --spark-soft: #3b3016;
    --coral: #f07a64; --coral-soft: #45231c;
    --ok: #4cc795; --ok-soft: #10392a;
    --on-accent: #06212a;
    --glass: rgba(120, 190, 212, 0.14); --glass-stroke: #74abbb;
    --water: rgba(64, 160, 200, 0.36); --water-stroke: #5fb4d0;
    --flame: #79bdff; --flame-core: #e8f4ff;
    --cuo: #1a1a1a; --cu: #e37552; --zn: #8b989e; --wood: #b78b58;
    --grid: rgba(63, 188, 210, 0.06);
    --wash-1: rgba(98, 211, 173, 0.08); --wash-2: rgba(63, 188, 210, 0.10); --wash-3: rgba(240, 192, 87, 0.05);
    --scrim: rgba(11, 25, 32, 0.72);
    --shadow: 0 14px 34px -14px rgba(0, 0, 0, 0.7); --shadow-s: 0 4px 12px -6px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0b1920; --paper-2: #11242c; --card: #142a33; --line: #26454f;
  --ink: #e1f0f4; --ink-2: #a6c2ca; --ink-3: #7f9ca6;
  --aqua: #3fbcd2; --aqua-ink: #8adbe8; --aqua-soft: #12394380;
  --mint: #62d3ad; --mint-soft: #143a30;
  --spark: #f0c057; --spark-soft: #3b3016;
  --coral: #f07a64; --coral-soft: #45231c;
  --ok: #4cc795; --ok-soft: #10392a;
  --on-accent: #06212a;
  --glass: rgba(120, 190, 212, 0.14); --glass-stroke: #74abbb;
  --water: rgba(64, 160, 200, 0.36); --water-stroke: #5fb4d0;
  --flame: #79bdff; --flame-core: #e8f4ff;
  --cuo: #1a1a1a; --cu: #e37552; --zn: #8b989e; --wood: #b78b58;
  --grid: rgba(63, 188, 210, 0.06);
  --wash-1: rgba(98, 211, 173, 0.08); --wash-2: rgba(63, 188, 210, 0.10); --wash-3: rgba(240, 192, 87, 0.05);
  --scrim: rgba(11, 25, 32, 0.72);
  --shadow: 0 14px 34px -14px rgba(0, 0, 0, 0.7); --shadow-s: 0 4px 12px -6px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

/* ---------- base ---------- */
html, body { height: 100%; }
body {
  margin: 0;
  background-color: var(--paper);
  background-image:
    radial-gradient(60% 50% at 8% 12%, var(--wash-1), transparent 70%),
    radial-gradient(50% 45% at 92% 20%, var(--wash-2), transparent 70%),
    radial-gradient(45% 40% at 70% 96%, var(--wash-3), transparent 70%),
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: auto, auto, auto, 24px 24px, 24px 24px;
  background-attachment: fixed;
  color: var(--ink);
  font-family: var(--f-body);
  font-size: 15px;
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -webkit-text-size-adjust: 100%;
  text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  overflow: hidden;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
img { max-width: 100%; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
:focus-visible { outline: 3px solid var(--aqua); outline-offset: 2px; border-radius: 6px; }
sub, sup { line-height: 0; }

#app {
  height: 100%;
  max-width: 1180px;
  margin: 0 auto;
  padding-inline: 16px;
  display: grid;
  grid-template-rows: auto minmax(0, 1fr) auto;
}

/* ---------- top bar ---------- */
.topbar {
  display: flex; align-items: center; gap: 10px;
  padding-block: 10px;
  min-width: 0;
}
.brand {
  display: inline-flex; align-items: center; gap: 8px;
  background: none; border: 0; padding: 4px 6px 4px 0; cursor: pointer;
  font-family: var(--f-display); font-size: 19px; color: var(--aqua-ink); letter-spacing: .02em; min-height: 40px;
  min-width: 0; white-space: nowrap;
}
.brand svg { flex: none; }
.brand .brand-text { overflow: hidden; text-overflow: ellipsis; }
.topbar .spacer { flex: 1; }
.tb-btn {
  display: inline-flex; align-items: center; gap: 6px;
  height: 40px; padding: 0 12px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink-2);
  cursor: pointer; font-size: 14px; white-space: nowrap;
}
.tb-btn:hover { border-color: var(--aqua); color: var(--aqua-ink); }
.tb-btn.icon-only { width: 40px; padding: 0; justify-content: center; }
.tb-stars { font-family: var(--f-num); font-weight: 800; color: var(--ink); }
.tb-stars svg { color: var(--spark); }
@media (max-width: 560px) {
  .brand .brand-text { display: none; }
  .tb-btn .tb-label { display: none; }
  .tb-btn { padding: 0 10px; }
}

/* ---------- screen container ---------- */
#screen { min-height: 0; overflow-y: auto; overflow-x: hidden; padding-block: 4px 16px; scroll-behavior: smooth; }
.screen-enter { animation: screenIn .35s ease both; }
@keyframes screenIn { from { opacity: .001; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  min-height: 42px; padding: 8px 18px; border-radius: 999px;
  border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
  font-weight: 500; cursor: pointer; transition: transform .12s ease, border-color .15s, background .15s, box-shadow .15s;
  user-select: none; -webkit-user-select: none; touch-action: manipulation;
}
.btn:hover { border-color: var(--aqua); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
.btn-primary { background: var(--aqua); border-color: var(--aqua); color: var(--on-accent); box-shadow: var(--shadow-s); }
.btn-primary:hover { background: var(--aqua-ink); border-color: var(--aqua-ink); }
.btn-spark { background: var(--spark); border-color: var(--spark); color: #2b1e00; }
.btn-ghost { background: transparent; }
.btn-lg { min-height: 52px; padding: 10px 28px; font-size: 17px; }
.btn-sm { min-height: 40px; padding: 4px 12px; font-size: 14px; }
.btn-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- generic panels & text ---------- */
.panel { background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r-m); padding: 16px; box-shadow: var(--shadow-s); min-width: 0; }
.panel-title { font-family: var(--f-display); font-size: 18px; color: var(--aqua-ink); margin-bottom: 8px; }
.muted { color: var(--ink-2); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; letter-spacing: .14em; color: var(--aqua-ink); font-weight: 700; }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-start; }
.col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.center { display: flex; justify-content: center; align-items: center; }
.grow { flex: 1 1 0; min-width: 0; }
.pill {
  display: inline-flex; align-items: center; gap: 4px; padding: 2px 10px; border-radius: 999px;
  font-size: 12px; font-weight: 700; background: var(--aqua-soft); color: var(--aqua-ink); white-space: nowrap;
}
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--spark-soft); color: var(--ink); }
.pill.bad { background: var(--coral-soft); color: var(--coral); }
.kbd-note { font-size: 12px; color: var(--ink-3); }
.hidden { display: none !important; }

/* chemistry text */
.chem { font-family: var(--f-num); font-weight: 700; letter-spacing: .01em; white-space: nowrap; }
.chem sub { font-size: .68em; vertical-align: -0.28em; }
.chem sup { font-size: .68em; vertical-align: .55em; }
.chem .cn { font-family: var(--f-body); font-weight: 500; }
.eqc { display: inline-flex; flex-direction: column; align-items: center; vertical-align: 0.55em; margin: 0 .3em; line-height: 1; }
.eqc-t { font-family: var(--f-body); font-size: .62em; font-weight: 500; color: var(--aqua-ink); padding: 0 .2em 2px; white-space: nowrap; }
.eqc-b { display: block; min-width: 2.2em; width: 100%; height: 5px; border-top: 1.6px solid currentColor; border-bottom: 1.6px solid currentColor; }
.eqc.plain { vertical-align: 0.28em; }
.formula-box {
  display: inline-block; padding: 8px 14px; border-radius: var(--r-s);
  background: var(--aqua-soft); color: var(--ink); font-size: 18px; max-width: 100%; overflow-x: auto;
}

/* ---------- drag & drop ---------- */
.draggable { cursor: grab; touch-action: none; user-select: none; -webkit-user-select: none; position: relative; }
.draggable.dragging { cursor: grabbing; z-index: 1000; box-shadow: var(--shadow); transition: none !important; }
.draggable.selected { outline: 3px solid var(--spark); outline-offset: 2px; }
.draggable.locked { cursor: default; }
.dropzone { transition: background .15s, border-color .15s, box-shadow .15s; }
.dropzone.drop-candidate { box-shadow: 0 0 0 3px var(--spark-soft); }
.dropzone.drop-hover { background: var(--aqua-soft) !important; border-color: var(--aqua) !important; }

.chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 14px; border-radius: 999px; border: 1.5px solid var(--line);
  background: var(--card); color: var(--ink); font-size: 15px; line-height: 1.35; box-shadow: var(--shadow-s);
  max-width: 100%;
}
.chip.ok { background: var(--ok-soft); border-color: var(--ok); color: var(--ink); box-shadow: none; }
.chip.bad { background: var(--coral-soft); border-color: var(--coral); }

.shake { animation: shake .4s ease; }
@keyframes shake { 0%,100% { transform: translateX(0); } 20% { transform: translateX(-7px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.pop-in { animation: popIn .35s cubic-bezier(.3,1.6,.5,1) both; }
@keyframes popIn { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 var(--aqua-soft); } 50% { box-shadow: 0 0 0 10px transparent; } }

/* sortInto */
.sorter { display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.sort-prompt { font-weight: 500; }
.sort-pool { display: flex; flex-wrap: wrap; gap: 10px; min-height: 48px; padding: 12px; border-radius: var(--r-m); background: var(--paper-2); border: 1.5px dashed var(--line); }
.sort-pool:empty::after { content: "全部分好啦！"; color: var(--ok); font-weight: 700; }
.sort-bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; }
.sort-bin { border: 2px dashed var(--line); border-radius: var(--r-m); padding: 10px; background: var(--card); min-height: 120px; display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.sort-bin-title { font-family: var(--f-display); font-size: 17px; color: var(--aqua-ink); }
.sort-bin-hint { font-size: 12px; color: var(--ink-3); margin-top: -6px; }
.sort-bin-list { display: flex; flex-wrap: wrap; gap: 8px; }

/* orderSteps */
.orderer { display: flex; flex-direction: column; gap: 12px; }
.order-list { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.order-item {
  display: grid; grid-template-columns: 34px 1fr auto; align-items: center; gap: 10px;
  padding: 8px 10px; border-radius: var(--r-s); border: 1.5px solid var(--line); background: var(--card); min-width: 0;
}
.order-item .order-num { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; background: var(--aqua-soft); color: var(--aqua-ink); font-family: var(--f-num); font-weight: 800; font-size: 14px; }
.order-item .order-text { min-width: 0; min-height: 40px; display: flex; align-items: center; }
.order-item .order-ctrl { display: flex; gap: 4px; }
.order-item .order-ctrl button { width: 40px; height: 40px; border-radius: 8px; border: 1.5px solid var(--line); background: var(--paper-2); cursor: pointer; display: grid; place-items: center; color: var(--ink-2); }
.order-item .order-ctrl button:hover { border-color: var(--aqua); color: var(--aqua-ink); }
.order-item.ok { border-color: var(--ok); background: var(--ok-soft); }
.order-item.bad { border-color: var(--coral); background: var(--coral-soft); }

/* choice */
.choice { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.choice-q { font-size: 17px; font-weight: 500; }
.choice-opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 10px; }
.choice-opt {
  display: flex; align-items: flex-start; gap: 10px; text-align: left;
  padding: 12px 14px; border-radius: var(--r-m); border: 1.5px solid var(--line); background: var(--card);
  cursor: pointer; transition: border-color .15s, background .15s, transform .1s; min-width: 0; line-height: 1.5;
}
.choice-opt:hover:not(:disabled) { border-color: var(--aqua); }
.choice-opt:active:not(:disabled) { transform: scale(.985); }
.choice-opt .opt-key { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); font-family: var(--f-num); font-weight: 800; font-size: 13px; color: var(--ink-2); }
.choice-opt.picked { border-color: var(--aqua); background: var(--aqua-soft); }
.choice-opt.picked .opt-key { background: var(--aqua); color: var(--on-accent); }
.choice-opt.right { border-color: var(--ok); background: var(--ok-soft); }
.choice-opt.right .opt-key { background: var(--ok); color: var(--on-accent); }
.choice-opt.wrong { border-color: var(--coral); background: var(--coral-soft); opacity: .85; }
.choice-opt.wrong .opt-key { background: var(--coral); color: var(--on-accent); }
.choice-opt:disabled { cursor: default; }
.choice > .btn, .sorter > .btn, .orderer > .btn { align-self: flex-start; }
.choice-feedback { font-size: 14px; padding: 10px 14px; border-radius: var(--r-s); background: var(--paper-2); border-left: 4px solid var(--aqua); }
.choice-feedback.bad { border-left-color: var(--coral); }
.choice-feedback.good { border-left-color: var(--ok); }

/* ---------- dialogue dock ---------- */
.dialog {
  position: relative;
  display: grid; grid-template-columns: 92px minmax(0, 1fr) auto; align-items: center; gap: 12px;
  margin-bottom: calc(10px + env(safe-area-inset-bottom, 0px));
  padding: 10px 14px 10px 10px;
  background: var(--card); border: 1.5px solid var(--line); border-radius: 22px; box-shadow: var(--shadow);
  cursor: default;
}
.dialog.is-say { cursor: pointer; border-color: var(--aqua); }
.dlg-avatar { position: relative; height: 72px; }
.dlg-avatar img { position: absolute; left: -4px; bottom: -6px; width: 100px; height: auto; transform-origin: 50% 90%; filter: drop-shadow(0 4px 6px rgba(0,0,0,.15)); }
.dlg-avatar img.bob { animation: bob .45s ease; }
@keyframes bob { 0% { transform: translateY(0) rotate(0); } 35% { transform: translateY(-6px) rotate(-3deg); } 100% { transform: none; } }
.dlg-name { font-family: var(--f-display); color: var(--aqua-ink); font-size: 15px; line-height: 1.2; display: flex; align-items: center; gap: 8px; }
.dlg-name .dlg-tag { font-family: var(--f-body); font-size: 11px; font-weight: 700; letter-spacing: .08em; padding: 1px 8px; border-radius: 999px; background: var(--spark-soft); color: var(--ink); }
.dialog:not(.is-hint) .dlg-tag { display: none; }
.dlg-text { font-size: 16px; line-height: 1.65; min-height: 2.2em; overflow-wrap: anywhere; }
.dlg-next { align-self: end; }
.dialog:not(.is-say) .dlg-next { display: none; }
.dlg-next .arrow { display: inline-block; animation: nudge 1s ease-in-out infinite; }
@keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(3px); } }
@media (max-width: 560px) {
  .dialog { grid-template-columns: 62px minmax(0, 1fr); padding: 8px 10px 8px 6px; gap: 8px; }
  .dlg-avatar { height: 56px; }
  .dlg-avatar img { width: 72px; }
  .dlg-text { font-size: 15px; }
  .dlg-next { grid-column: 1 / -1; justify-self: end; min-height: 34px; padding: 4px 14px; }
}

/* ---------- toasts ---------- */
#toasts { position: fixed; top: calc(62px + env(safe-area-inset-top, 0px)); left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 3000; pointer-events: none; width: min(92vw, 520px); align-items: center; }
.toast { pointer-events: none; padding: 10px 16px; border-radius: 14px; background: var(--card); border: 1.5px solid var(--line); box-shadow: var(--shadow); font-size: 14px; animation: toastIn .25s ease both; max-width: 100%; }
.toast.good { border-color: var(--ok); background: var(--ok-soft); }
.toast.bad { border-color: var(--coral); background: var(--coral-soft); }
.toast.info { border-color: var(--aqua); }
.toast.out { animation: toastOut .3s ease both; }
@keyframes toastIn { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: none; } }
@keyframes toastOut { to { opacity: 0; transform: translateY(-8px); } }

#confetti { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2500; }

/* ---------- overlay / result ---------- */
.overlay { position: fixed; top: 0; right: 0; bottom: 0; left: 0; z-index: 2000; display: grid; place-items: center; padding: 16px; background: var(--scrim); backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); overflow-y: auto; }
.result-card { width: min(560px, 100%); background: var(--card); border: 1.5px solid var(--line); border-radius: var(--r-l); box-shadow: var(--shadow); padding: 22px; display: flex; flex-direction: column; gap: 14px; position: relative; animation: popIn .4s cubic-bezier(.3,1.5,.5,1) both; }
.result-close { position: absolute; top: 12px; right: 12px; width: 40px; height: 40px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); color: var(--ink-2); display: grid; place-items: center; cursor: pointer; }
.result-close:hover { border-color: var(--aqua); color: var(--aqua-ink); }
.result-head { display: grid; padding-right: 36px; grid-template-columns: 96px 1fr; gap: 14px; align-items: center; }
.result-head img { width: 96px; }
.result-title { font-family: var(--f-display); font-size: 26px; color: var(--aqua-ink); line-height: 1.2; text-wrap: balance; word-break: keep-all; }
.stars { display: flex; gap: 6px; }
.stars svg { width: 34px; height: 34px; color: var(--line); }
.stars svg.on { color: var(--spark); animation: popIn .4s cubic-bezier(.3,1.8,.5,1) both; }

/* knowledge card (result + codex) */
.kcard { border-radius: var(--r-m); border: 1.5px solid var(--line); background: var(--paper-2); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; min-width: 0; position: relative; }
.kcard-top { display: flex; align-items: center; gap: 10px; }
.kcard-no { font-family: var(--f-num); font-weight: 800; font-size: 12px; color: var(--aqua-ink); letter-spacing: .1em; }
.kcard-title { font-family: var(--f-display); font-size: 19px; color: var(--ink); }
.kcard ul { margin: 0; padding-left: 1.2em; display: flex; flex-direction: column; gap: 4px; }
.kcard li::marker { color: var(--aqua); }
.kcard .formula-box { font-size: 16px; background: var(--card); }
.kcard.locked { opacity: .6; border-style: dashed; background: transparent; }
.kcard.locked .kcard-title { color: var(--ink-3); }

/* ---------- title screen ---------- */
.title-screen { min-height: 100%; display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, .95fr); align-items: center; gap: 12px; }
.title-copy { display: flex; flex-direction: column; gap: 18px; padding-block: 20px; min-width: 0; }
.title-h1 { font-family: var(--f-display); font-weight: 400; font-size: clamp(38px, 6.4vw, 70px); line-height: 1.05; color: var(--ink); letter-spacing: .01em; }
.title-h1 .accent { color: var(--aqua); }
.title-lead { font-size: 17px; color: var(--ink-2); max-width: 30em; }
.el-tile { display: inline-grid; grid-template-columns: auto auto; column-gap: 14px; align-items: end; width: max-content; padding: 10px 16px; border-radius: 14px; border: 2px solid var(--aqua); background: var(--card); box-shadow: var(--shadow-s); }
.el-tile .z { font-family: var(--f-num); font-weight: 800; color: var(--aqua-ink); font-size: 14px; grid-column: 1; }
.el-tile .sym { font-family: var(--f-num); font-weight: 800; font-size: 44px; line-height: 1; color: var(--ink); grid-column: 1; }
.el-tile .meta { grid-column: 2; grid-row: 1 / span 2; font-size: 13px; color: var(--ink-2); line-height: 1.5; }
.el-tile .meta b { font-family: var(--f-display); font-weight: 400; font-size: 22px; color: var(--ink); display: block; }
.title-art { position: relative; justify-self: center; width: min(360px, 80vw); aspect-ratio: 890 / 1581; max-width: 100%; max-height: calc(100vh - 150px); max-height: calc(100dvh - 150px); }
.title-art img.body { width: 100%; height: 100%; object-fit: contain; animation: float 5s ease-in-out infinite; }
@keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
.title-art .orbit { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; animation: float 5s ease-in-out infinite; overflow: visible; }
.callout { position: absolute; font-size: 13px; background: var(--card); border: 1.5px solid var(--aqua); color: var(--ink); padding: 6px 10px; border-radius: 12px; box-shadow: var(--shadow-s); white-space: nowrap; }
.callout b { color: var(--aqua-ink); }
.teacher-toggle { display: inline-flex; align-items: center; gap: 8px; font-size: 14px; color: var(--ink-2); cursor: pointer; user-select: none; }
.teacher-toggle input { width: 18px; height: 18px; accent-color: var(--aqua); }
@media (max-width: 1100px) {
  .callout.c-halo { left: auto !important; right: -2%; top: -2% !important; }
  .callout.c-balloon { left: -2% !important; }
}
@media (max-width: 760px) {
  .title-screen { grid-template-columns: 1fr; }
  .title-art { order: -1; width: min(200px, 52vw); max-height: 32vh; max-height: 32dvh; }
  .title-copy { gap: 12px; padding-block: 6px 12px; }
  .title-h1 { font-size: clamp(34px, 10vw, 44px); }
  .title-lead { font-size: 15px; }
  .title-copy .el-tile { order: 5; }
  .callout { display: none; }
}

/* ---------- map ---------- */
.map-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-block: 8px 16px; }
.map-title { font-family: var(--f-display); font-size: 30px; font-weight: 400; color: var(--ink); line-height: 1.1; }
.map-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 16px; counter-reset: st; }
.station {
  position: relative; text-align: left; display: flex; flex-direction: column; gap: 6px;
  padding: 16px 16px 14px; border-radius: var(--r-l); border: 1.5px solid var(--line); background: var(--card);
  cursor: pointer; transition: transform .15s ease, border-color .15s, box-shadow .15s; min-width: 0; color: var(--ink);
}
.station:hover:not(.locked) { transform: translateY(-3px); border-color: var(--aqua); box-shadow: var(--shadow); }
.station.current { border-color: var(--aqua); box-shadow: 0 0 0 4px var(--aqua-soft); }
.station.locked { cursor: not-allowed; background: transparent; border-style: dashed; color: var(--ink-3); }
.station-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.drop-badge { width: 40px; height: 48px; display: grid; place-items: center; position: relative; flex: none; }
.drop-badge svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.drop-badge span { position: relative; font-family: var(--f-num); font-weight: 800; color: var(--on-accent); font-size: 16px; margin-top: 8px; }
.station.locked .drop-badge span { color: var(--ink-3); }
.station-title { font-family: var(--f-display); font-size: 21px; line-height: 1.2; }
.station-sub { font-size: 13px; color: var(--ink-2); }
.station.locked .station-sub { color: var(--ink-3); }
.station-stars { display: flex; gap: 2px; }
.station-stars svg { width: 18px; height: 18px; color: var(--line); }
.station-stars svg.on { color: var(--spark); }

/* ---------- level screen ---------- */
.level-head { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; margin-block: 4px 12px; }
.level-name { display: flex; align-items: center; gap: 10px; min-width: 0; }
.level-name .drop-badge { width: 34px; height: 41px; }
.level-name .drop-badge span { font-size: 14px; margin-top: 7px; }
.level-title { font-family: var(--f-display); font-size: 24px; font-weight: 400; line-height: 1.15; }
.level-sub { font-size: 13px; color: var(--ink-2); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.step { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--ink-3); padding: 3px 10px 3px 4px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); }
.step i { font-style: normal; width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center; background: var(--paper-2); font-family: var(--f-num); font-weight: 800; font-size: 11px; }
.step.now { color: var(--aqua-ink); border-color: var(--aqua); }
.step.now i { background: var(--aqua); color: var(--on-accent); }
.step.done { color: var(--ok); }
.step.done i { background: var(--ok); color: var(--on-accent); }
.stage { display: flex; flex-direction: column; gap: 16px; min-width: 0; padding-bottom: 8px; }

/* ---------- codex ---------- */
.codex-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 14px; align-items: start; }

/* ---------- certificate (used by the final level) ---------- */
.cert { position: relative; border-radius: var(--r-l); border: 2px solid var(--aqua); background: var(--card); padding: 28px 24px; display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center; box-shadow: var(--shadow); overflow: hidden; }
.cert::before { content: ""; position: absolute; inset: 8px; border: 1.5px dashed var(--line); border-radius: 18px; pointer-events: none; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .001ms !important; animation-iteration-count: 1 !important; transition-duration: .001ms !important; scroll-behavior: auto !important; }
}

</style>

      const check = h('button', { class: 'btn btn-primary', type: 'button' }, o.checkLabel || '检查顺序');
      const fb = h('div', { class: 'choice-feedback', hidden: true });
      box.append(list, h('div', { class: 'btn-row' }, check, h('span', { class: 'kbd-note' }, '用 ▲▼ 调整，或把一步拖到另一步上交换位置。')), fb);
      host.append(box);
      let order = o.steps.map((s, i) => i);
      let tries = 0;
      do { order = shuffle(order); tries++; } while (order.every((v, i) => v === i) && tries < 20);
      let wrong = 0;
      const render = () => {
        list.innerHTML = '';
        order.forEach((stepIdx, pos) => {
          const up = h('button', { type: 'button', 'aria-label': '上移', html: ICON.up, disabled: pos === 0 });
          const dn = h('button', { type: 'button', 'aria-label': '下移', html: ICON.down, disabled: pos === order.length - 1 });
          const li = h('li', { class: 'order-item dropzone', dataset: { pos } }, h('span', { class: 'order-num' }, pos + 1), h('span', { class: 'order-text', html: o.steps[stepIdx] }), h('span', { class: 'order-ctrl' }, up, dn));
          up.addEventListener('click', e => { e.stopPropagation(); swap(pos, pos - 1, 'up'); });
          dn.addEventListener('click', e => { e.stopPropagation(); swap(pos, pos + 1, 'dn'); });
          list.append(li);
          api.draggable(li.querySelector('.order-text'), {
            zones: () => [...list.children].filter(x => x !== li),
            onDrop: zone => { swap(pos, +zone.dataset.pos); return true; },
          });
        });
      };
      const swap = (a, b, dir) => {
        if (b < 0 || b >= order.length) return;
        [order[a], order[b]] = [order[b], order[a]]; api.sfx('click'); fb.hidden = true; render();
        if (dir) { const li = list.children[b]; const btns = li ? li.querySelectorAll('.order-ctrl button') : []; const t = btns[dir === 'up' ? 0 : 1]; const f = t && !t.disabled ? t : [...btns].find(x => !x.disabled); if (f) f.focus({ preventScroll: true }); }
      };
      render();
      return api.task(resolve => {
        check.addEventListener('click', () => {
          const items = [...list.children];
          const okCount = order.filter((v, i) => v === i).length;
          if (okCount === order.length) {
            items.forEach(li => li.classList.add('ok'));
            check.disabled = true; list.querySelectorAll('button').forEach(b => (b.disabled = true));
            list.querySelectorAll('.draggable').forEach(d => d.classList.add('locked'));
            fb.hidden = false; fb.className = 'choice-feedback good'; fb.innerHTML = o.explain || '顺序完全正确！';
            setTimeout(() => fb.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'nearest' }), 40);
            api.good();
            setTimeout(() => resolve(wrong), 700);
          } else {
            wrong++; api.mistake();
            items.forEach((li, i) => { li.classList.toggle('bad', order[i] !== i); li.classList.toggle('ok', order[i] === i); });
            setTimeout(() => items.forEach(li => li.classList.remove('bad', 'ok')), 1400);
            fb.hidden = false; fb.className = 'choice-feedback bad';
            fb.innerHTML = `有 ${okCount} 步的位置是对的，红色的步骤还需要调整。` + (o.hint ? `<br>${o.hint}` : '');
            setTimeout(() => fb.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'nearest' }), 40);
          }
        });
      });
    },
  };

  /* ---------------- app shell ---------------- */
  let current = null; // running level
  let screenName = 'title';
  const $ = sel => document.querySelector(sel);

  function isUnlocked(i) { return state.teacher || i === 0 || !!state.done[levels[i - 1].id]; }
  function totalStars() { return Object.values(state.stars).reduce((a, b) => a + (b || 0), 0); }
  function starsHtml(n, max = 3) { let s = ''; for (let i = 0; i < max; i++) s += ICON.star(i < n); return s; }
  function dropBadge(n, locked) { return `<span class="drop-badge">${ICON.drop(locked ? 'var(--line)' : 'var(--aqua)')}<span>${n}</span></span>`; }
  function setHash(tok) { try { history.replaceState(null, '', '#' + tok); } catch (e) { try { location.hash = tok; } catch (_) {} } }

  function renderTopbar() {
    const bar = $('.topbar');
    bar.innerHTML = '';
    const brand = h('button', { class: 'brand', type: 'button', title: '回到封面' });
    brand.innerHTML = `<svg width="26" height="30" viewBox="0 0 40 48" aria-hidden="true"><path d="M20 2 C20 2 4 20 4 31 a16 16 0 0 0 32 0 C36 20 20 2 20 2Z" fill="var(--aqua)"/><ellipse cx="20" cy="31" rx="13" ry="4.5" fill="none" stroke="var(--on-accent)" stroke-width="1.6"/><circle cx="33" cy="31" r="2.6" fill="var(--spark)"/></svg><span class="brand-text">氢氢的氢元素探险</span>`;
    brand.addEventListener('click', () => go('title'));
    const mapBtn = h('button', { class: 'tb-btn', type: 'button', 'aria-label': '氢元素探险地图', html: `${ICON.map}<span class="tb-label">地图</span>` });
    mapBtn.addEventListener('click', () => go('map'));
    const codexBtn = h('button', { class: 'tb-btn', type: 'button', 'aria-label': '氢元素知识图鉴', html: `${ICON.book}<span class="tb-label">知识图鉴</span>` });
    codexBtn.addEventListener('click', () => go('codex'));
    const stars = h('span', { class: 'tb-btn tb-stars', title: '已获得的星星', html: `${ICON.star(true).replace('<svg', '<svg width="18" height="18"')}${totalStars()}` });
    const snd = h('button', { class: 'tb-btn icon-only', type: 'button', 'aria-label': state.muted ? '打开声音' : '关闭声音', title: state.muted ? '打开声音' : '关闭声音', html: ICON.sound(!state.muted) });
    snd.addEventListener('click', () => { state.muted = !state.muted; persist(); renderTopbar(); if (!state.muted) Sfx.play('pop'); });
    bar.append(brand, h('span', { class: 'spacer' }), mapBtn, codexBtn, stars, snd);
  }

  function leaveLevel() {
    if (current) {
      current.ctrl.abort();
      current.cleanups.forEach(f => { try { f(); } catch (e) { /* ignore */ } });
      Drag.clearSel();
      current = null;
    }
    Dialog.hide();
    const ov = $('.overlay'); if (ov) ov.remove();
  }

  function mountScreen(node) {
    const scr = $('#screen');
    scr.innerHTML = '';
    scr.scrollTop = 0;
    node.classList.add('screen-enter');
    scr.append(node);
  }

  function go(name, arg) {
    leaveLevel();
    screenName = name;
    renderTopbar();
    if (name === 'title') { renderTitle(); setHash('title'); }
    else if (name === 'map') { renderMap(); setHash('map'); }
    else if (name === 'codex') { renderCodex(); setHash('codex'); }
    else if (name === 'level') { startLevel(arg); }
  }

  function renderTitle() {
    const firstOpen = levels.findIndex(l => !state.done[l.id]);
    const started = Object.keys(state.done).length > 0;
    const art = h('div', { class: 'title-art' });
    art.innerHTML = `<img class="body" src="${H2.assets.body || ''}" alt="氢氢：白发蓝眼、穿蓝绿色雨衣、拿着气球的小水滴女孩" draggable="false">
      <svg class="orbit" viewBox="0 0 890 1581" aria-hidden="true">
        <path id="halo-path" d="M375 110 a130 26 0 1 0 260 0 a130 26 0 1 0 -260 0" fill="none" stroke="var(--spark)" stroke-width="3" stroke-dasharray="4 10" opacity=".7"/>
        <circle r="19" fill="var(--spark)" stroke="var(--card)" stroke-width="5"><animateMotion dur="3.2s" repeatCount="indefinite"><mpath href="#halo-path" xlink:href="#halo-path"/></animateMotion></circle>
      </svg>
      <div class="callout c-halo" style="left:62%;top:1%">我的光环 = <b>氢原子的电子轨道</b></div>
      <div class="callout c-balloon" style="left:-6%;top:24%">气球里装的是<b>最轻的气体</b>？</div>`;
    const teach = h('label', { class: 'teacher-toggle' }, h('input', { type: 'checkbox', id: 'teacher-mode', checked: state.teacher || null }), '教师模式（解锁全部关卡）');
    teach.querySelector('input').addEventListener('change', e => { state.teacher = e.target.checked; persist(); });
    const startBtn = h('button', { class: 'btn btn-primary btn-lg pulse', type: 'button' }, started ? '继续探险' : '开始探险');
    startBtn.addEventListener('click', () => { Sfx.unlock(); Sfx.play('pop'); go('map'); });
    const codexBtn = h('button', { class: 'btn btn-lg', type: 'button' }, '知识图鉴');
    codexBtn.addEventListener('click', () => go('codex'));
    const copy = h('div', { class: 'title-copy' },
      h('div', { class: 'eyebrow' }, '初中化学 · 氢元素互动课'),
      h('h1', { class: 'title-h1', html: '氢氢的<br><span class="accent">氢元素</span>探险' }),
      h('p', { class: 'title-lead' }, '我是小水滴氢氢。水由氢、氧两种元素组成——跟我一起拆开一滴水，拼出氢原子，认识最轻的气体，再安全地把它点燃，变回我自己！'),
      h('div', { class: 'el-tile', html: `<span class="z">1</span><span class="sym">H</span><span class="meta"><b>氢</b>原子序数 1<br>相对原子质量 1.008</span>` }),
      h('div', { class: 'btn-row' }, startBtn, codexBtn),
      h('div', { class: 'btn-row' }, teach, firstOpen > 0 ? h('span', { class: 'pill' }, `已完成 ${Object.keys(state.done).filter(id => levels.some(l => l.id === id)).length}/${levels.length} 站`) : null),
    );
    mountScreen(h('section', { class: 'title-screen' }, copy, art));
  }

  function renderMap() {
    const doneCount = levels.filter(l => state.done[l.id]).length;
    const nextIdx = levels.findIndex((l, i) => !state.done[l.id] && isUnlocked(i));
    const teach = h('label', { class: 'teacher-toggle' }, h('input', { type: 'checkbox', id: 'teacher-mode-map', checked: state.teacher || null }), '教师模式');
    teach.querySelector('input').addEventListener('change', e => { state.teacher = e.target.checked; persist(); renderMap(); });
    const grid = h('div', { class: 'map-grid' });
    levels.forEach((l, i) => {
      const open = isUnlocked(i);
      const card = h('button', { class: 'station' + (open ? '' : ' locked') + (i === nextIdx ? ' current' : ''), type: 'button', 'aria-disabled': open ? null : 'true' });
      card.innerHTML = `<div class="station-top">${dropBadge(l.order, !open)}${state.done[l.id] ? `<span class="pill ok">已完成</span>` : open ? (i === nextIdx ? `<span class="pill">下一站</span>` : '') : `<span class="pill warn">${ICON.lock} 未解锁</span>`}</div>
        <div class="station-title">${l.title}</div><div class="station-sub">${l.subtitle || ''}</div>
        <div class="station-stars" aria-label="${state.stars[l.id] || 0} 颗星">${starsHtml(state.stars[l.id] || 0)}</div>`;
      card.addEventListener('click', () => {
        if (!open) { Toast.show(`先完成「${levels[i - 1].title}」才能解锁这一站哦`, 'info'); Sfx.play('wrong'); return; }
        Sfx.unlock(); Sfx.play('pop'); go('level', l.id);
      });
      grid.append(card);
    });
    mountScreen(h('section', { class: 'map' },
      h('div', { class: 'map-head' },
        h('div', null, h('div', { class: 'eyebrow' }, `已点亮 ${doneCount} / ${levels.length} 站`), h('h2', { class: 'map-title' }, '探险地图')),
        teach),
      grid));
  }

  function cardNode(l, i, locked) {
    const c = l.card || { title: l.title, points: [] };
    const node = h('article', { class: 'kcard' + (locked ? ' locked' : '') });
    node.innerHTML = `<div class="kcard-top"><span class="kcard-no">NO.${String(l.order).padStart(2, '0')}</span><span class="kcard-title">${locked ? '？？？' : c.title}</span></div>`;
    if (locked) node.append(h('p', { class: 'small muted' }, `完成「${l.title}」后解锁这张知识卡`));
    else {
      if (c.formula) node.append(h('div', null, h('span', { class: 'formula-box', html: chem(c.formula) })));
      if (c.points && c.points.length) node.append(h('ul', null, c.points.map(p => h('li', { html: p }))));
    }
    return node;
  }

  function renderCodex() {
    const got = levels.filter(l => state.done[l.id]).length;
    const grid = h('div', { class: 'codex-grid' });
    levels.forEach((l, i) => grid.append(cardNode(l, i, !state.done[l.id])));
    mountScreen(h('section', null,
      h('div', { class: 'map-head' }, h('div', null, h('div', { class: 'eyebrow' }, `已收集 ${got} / ${levels.length} 张`), h('h2', { class: 'map-title' }, '知识图鉴')),
        h('button', { class: 'btn', type: 'button', onclick: () => go('map') }, '回到地图')),
      grid));
  }

  function makeApi(def, stageEl, ctrl) {
    const signal = ctrl.signal;
    const cleanups = [];
    let mistakes = 0, finished = false;
    const guard = () => { if (signal.aborted) throw abortErr(); };
    const api = {
      def, stage: stageEl, signal, h, chem, frag, shuffle, ICON, state,
      get mistakes() { return mistakes; },
      get aborted() { return signal.aborted; },
      say(lines) { guard(); return Dialog.say(lines, signal); },
      hint(html, mood) { guard(); Dialog.hint(html, mood); },
      mood(m) { Dialog.setMood(m); },
      wait(ms) {
        return new Promise((res, rej) => {
          if (signal.aborted) return rej(abortErr());
          const t = setTimeout(() => { signal.removeEventListener('abort', ab); res(); }, ms);
          const ab = () => { clearTimeout(t); rej(abortErr()); };
          signal.addEventListener('abort', ab, { once: true });
        });
      },
      task(executor) {
        return new Promise((res, rej) => {
          if (signal.aborted) return rej(abortErr());
          const ab = () => rej(abortErr());
          signal.addEventListener('abort', ab, { once: true });
          const done = v => { signal.removeEventListener('abort', ab); res(v); };
          try { executor(done, rej); } catch (e) { rej(e); }
        });
      },
      waitClick(el) { return api.task(res => el.addEventListener('click', e => res(e), { once: true })); },
      on(target, type, fn, opts) { target.addEventListener(type, fn, opts); cleanups.push(() => target.removeEventListener(type, fn, opts)); },
      raf(fn) {
        let id = 0, last = performance.now(), stopped = false;
        const loop = t => { if (stopped || signal.aborted) return; const dt = Math.min(0.05, (t - last) / 1000); last = t; if (fn(dt, t) === false) return; id = requestAnimationFrame(loop); };
        id = requestAnimationFrame(loop);
        const stop = () => { stopped = true; cancelAnimationFrame(id); };
        cleanups.push(stop); return stop;
      },
      interval(fn, ms) { const t = setInterval(() => { if (!signal.aborted) fn(); }, ms); const stop = () => clearInterval(t); cleanups.push(stop); return stop; },
      timeout(fn, ms) { const t = setTimeout(() => { if (!signal.aborted) fn(); }, ms); const stop = () => clearTimeout(t); cleanups.push(stop); return stop; },
      sfx(n) { Sfx.play(n); },
      toast(msg, kind, ms) { Toast.show(msg, kind, ms); },
      confetti() { Confetti.burst(); },
      mistake(msg) { mistakes++; Sfx.play('wrong'); Dialog.setMood('serious'); if (msg) Toast.show(msg, 'bad', 3400); },
      good(msg) { Sfx.play('correct'); Dialog.setMood('happy'); if (msg) Toast.show(msg, 'good'); },
      steps(names) { Steps.set(names); },
      step(i) { Steps.go(i); },
      draggable(el, opts) { return Drag.make(el, opts || {}, cleanups); },
      choice(o) { return Components.choice(api, o); },
      sortInto(o) { return Components.sortInto(api, o); },
      orderSteps(o) { return Components.orderSteps(api, o); },
      button(label, o = {}) { const b = h('button', { class: 'btn ' + (o.primary === false ? '' : 'btn-primary') + (o.className ? ' ' + o.className : ''), type: 'button', html: label }); if (o.onClick) b.addEventListener('click', o.onClick); return b; },
      clear() { Drag.clearSel(); stageEl.innerHTML = ''; },
      restart() { go('level', def.id); },
      setName(name) { state.name = String(name || '').slice(0, 24); persist(); },
      scrollTo(el) { if (el) el.scrollIntoView({ behavior: reducedMotion() ? 'auto' : 'smooth', block: 'nearest' }); },
      complete(o = {}) {
        if (finished || signal.aborted) return;
        finished = true;
        const stars = o.stars != null ? o.stars : mistakes === 0 ? 3 : mistakes <= 2 ? 2 : 1;
        state.done[def.id] = true;
        state.stars[def.id] = Math.max(state.stars[def.id] || 0, stars);
        persist(); renderTopbar();
        Steps.go(Steps.names.length);
        showResult(def, stars, o);
      },
      get reducedMotion() { return reducedMotion(); },
      cssVar(name) { return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); },
    };
    return { api, cleanups };
  }

  const injectedCss = new Set();
  async function startLevel(id) {
    const idx = levels.findIndex(l => l.id === id);
    if (idx < 0) { go('map'); return; }
    const def = levels[idx];
    setHash('L-' + id);
    if (def.css && !injectedCss.has(id)) { document.head.append(h('style', { 'data-level': id }, def.css)); injectedCss.add(id); }
    const stepsHost = h('div', { class: 'steps', 'aria-label': '关卡进度' });
    const stage = h('div', { class: `stage lv-${id}`, id: 'stage' });
    const head = h('header', { class: 'level-head' },
      h('div', { class: 'level-name', html: `${dropBadge(def.order)}<div><h2 class="level-title">${def.title}</h2><div class="level-sub">${def.subtitle || ''}</div></div>` }),
      stepsHost);
    mountScreen(h('section', { class: 'level' }, head, stage));
    Steps.host = stepsHost; Steps.set([]);
    const ctrl = new AbortController();
    const { api, cleanups } = makeApi(def, stage, ctrl);
    current = { def, ctrl, cleanups, api };
    Dialog.show(); Dialog.setMood('happy'); Dialog.hint('');
    try { await def.run(api); }
    catch (e) {
      if (e && e.name === 'AbortError') return;
      console.error('[level ' + id + ']', e);
      Toast.show('这一关出了点小问题，请回到地图重试。', 'bad', 5000);
    }
  }

  function showResult(def, stars, o) {
    const idx = levels.indexOf(def);
    const next = levels[idx + 1];
    Sfx.play('win'); Confetti.burst();
    const ov = h('div', { class: 'overlay', role: 'dialog', 'aria-modal': 'true', 'aria-label': '关卡完成' });
    const card = h('div', { class: 'result-card' });
    const close = h('button', { class: 'result-close', type: 'button', 'aria-label': '关闭，查看本关', title: '关闭，查看本关', html: '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>' });
    close.addEventListener('click', () => ov.remove());
    card.append(close);
    card.append(
      h('div', { class: 'result-head' }, h('img', { src: H2.assets.head_curious || '', alt: '', draggable: 'false' }),
        h('div', { class: 'col', style: { gap: '6px' } }, h('div', { class: 'eyebrow' }, `第 ${def.order} 站完成`), h('div', { class: 'result-title' }, o.title || def.title), h('div', { class: 'stars', html: starsHtml(stars) }))),
      o.message ? h('p', { class: 'muted', html: o.message }) : h('p', { class: 'muted' }, stars === 3 ? '一次都没出错，太厉害了！' : stars === 2 ? '只错了一点点，已经很棒啦！' : '完成啦！把知识卡再读一遍，下次一定能拿满星。'),
      h('div', { class: 'small muted' }, '获得知识卡：'),
      cardNode(def, idx, false));
    const back = h('button', { class: 'btn', type: 'button' }, '回到地图');
    back.addEventListener('click', () => go('map'));
    const again = h('button', { class: 'btn btn-ghost', type: 'button' }, '再玩一次');
    again.addEventListener('click', () => go('level', def.id));
    const row = h('div', { class: 'btn-row' }, back, again);
    if (next) { const nb = h('button', { class: 'btn btn-primary', type: 'button' }, `下一站：${next.title} ›`); nb.addEventListener('click', () => go('level', next.id)); row.prepend(nb); }
    card.append(row);
    ov.append(card);
    document.body.append(ov);
    setTimeout(() => (row.firstElementChild || back).focus({ preventScroll: true }), 50);
    // the card stays on top of the finished level; dialogue shows a closing line
    Dialog.hint(next ? `下一站是「${next.title}」，准备好了吗？` : '全部通关啦！去知识图鉴看看你收集的卡片吧。', 'curious');
  }

  /* ---------------- boot ---------------- */
  function loadFonts() {}
  function boot(saved) {
    if (saved && saved.state) Object.assign(state, saved.state);
    loadFonts();
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.append(h('header', { class: 'topbar' }), h('main', { id: 'screen' }), h('div', { id: 'dialog', class: 'dialog', hidden: true }));
    if (!document.getElementById('toasts')) document.body.append(h('div', { id: 'toasts', 'aria-live': 'polite' }), h('canvas', { id: 'confetti', 'aria-hidden': 'true' }));
    Dialog.init(); Drag.init();
    const hash = (location.hash || '').slice(1);
    if (hash.startsWith('L-') && levels.some(l => l.id === hash.slice(2))) go('level', hash.slice(2));
    else if (hash === 'map') go('map');
    else if (hash === 'codex') go('codex');
    else go('title');
  }
  H2.boot = () => {
    const hot = window.claude && window.claude.hot;
    if (hot && typeof hot.snapshot === 'function') { try { hot.snapshot(() => ({ state })); } catch (e) { /* ignore */ } }
    if (hot && typeof hot.ready === 'function') hot.ready(boot); else boot(hot && hot.data ? hot.data : {});
  };

  /* ---------------- debug hooks (used by tools/shot.mjs tests) ---------------- */
  H2.debug = {
    goto: id => go('level', id),
    fast(on = true) { Dialog.fast = on; return on; },
    async skipDialog(max = 80) {
      let n = 0, idle = 0;
      while (n < max && idle < 3) {
        if (Dialog._skipType || Dialog._advance) { Dialog.poke(); n++; idle = 0; }
        else idle++;
        await new Promise(r => setTimeout(r, 40));
      }
      return n;
    },
    state: () => JSON.parse(JSON.stringify(state)),
    unlockAll() { state.teacher = true; persist(); return true; },
    reset() { Object.assign(state, window.HydrogenAccountAdapter.resetState()); return true; },
    mistakes: () => (current ? current.api.mistakes : null),
    current: () => (current ? current.def.id : screenName),
    dialogText: () => (Dialog.text ? Dialog.text.textContent : ''),
    chem,
  };
  H2.util = { h, chem, shuffle, frag, Sfx, Toast };
})();

(function () {
  'use strict';

  /* ---------------- geometry (SVG user units, viewBox 480 × 400) ---------------- */
  const TA = 140, TB = 340, HW = 14;          // tube a / tube b centre x, inner half-width

  // tear-drop flame, base at (0,0), tip at (0,-h)
  const flame = (h, w) => `M0,0 C${-w},0 ${-w},${(-h * 0.45).toFixed(1)} 0,${-h} C${w},${(-h * 0.45).toFixed(1)} ${w},0 0,0Z`;
  const retrigger = (el, cls) => { if (!el) return; el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); };
  const fmt = v => (Math.round(v * 10) / 10).toFixed(1);

  function tubeInner(cx) { return `M${cx - HW},${BOT} V114 Q${cx - HW},100 ${cx},100 Q${cx + HW},100 ${cx + HW},114 V${BOT} Z`; }
  // side = +1: the connector joins on the right wall (tube a); -1: on the left wall (tube b)
  function tubeWalls(cx, side) {
    const inner = cx + side * HW, outer = cx - side * HW;

  // graduations: side -1 → numbers on the left (tube a), +1 → on the right (tube b)
  function scale(cx, side) {
    const edge = cx + side * HW;
    let s = '';
    for (let v = 0; v <= 24; v++) {
      const y = vy(v), major = v % 5 === 0, len = major ? 9 : 5;
      s += `<line class="tick${major ? ' major' : ''}" x1="${edge}" y1="${y}" x2="${edge - side * len}" y2="${y}"/>`;
      if (major && v <= 20) s += `<text class="num" x="${edge + side * 6}" y="${y + 4.5}" text-anchor="${side < 0 ? 'end' : 'start'}">${v}</text>`;
    }
    s += `<text class="unit" x="${edge + side * 6}" y="${Y0 - 12}" text-anchor="${side < 0 ? 'end' : 'start'}">mL</text>`;
    return s;
  }

  /* ---------------- micro view: 2H2O → 2H2 + O2 ---------------- */

  const ATOMS = [

    return `<svg viewBox="16 4 332 150" role="img" aria-label="微观示意：两个水分子分解，原子重新组合成两个氢分子和一个氧分子">

.lv-atom .task-body { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.lv-atom .task-body > .panel { border: 0; box-shadow: none; padding: 0; background: transparent; border-radius: 0; }
.lv-atom .lead { color: var(--ink-2); font-size: 15px; }
.lv-atom .lead b { color: var(--ink); }
.lv-atom .sub-h { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; font-weight: 700; font-size: 14px; color: var(--ink-2); }
.lv-atom .concl { padding: 10px 14px; border-radius: var(--r-s); background: var(--ok-soft); border-left: 4px solid var(--ok); font-size: 14.5px; }

/* step 1: particle cards */
.lv-atom .pcards { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.lv-atom .pcard { display: grid; grid-template-columns: 42px minmax(0, 1fr) auto; gap: 10px; align-items: center; width: 100%; text-align: left; padding: 8px 12px; min-height: 58px;
  border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; color: var(--ink); line-height: 1.45; transition: border-color .15s, background .15s; }
.lv-atom .pcard:hover { border-color: var(--aqua); }
.lv-atom .pcard .pc-ico svg { width: 40px; height: 40px; display: block; }
.lv-atom .pcard .pc-go svg { width: 16px; height: 16px; }
.lv-atom .pcard .pc-name { font-weight: 700; font-size: 15.5px; }
.lv-atom .pcard .pc-facts { display: block; font-size: 13.5px; color: var(--ink-2); }
.lv-atom .pcard .pc-facts b { color: var(--ink); }
.lv-atom .pcard .pc-facts .seg { display: inline-block; margin-right: 12px; }
.lv-atom .pcard .pc-go { font-size: 12.5px; color: var(--aqua-ink); display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
.lv-atom .pcard.seen { background: var(--paper-2); border-color: var(--aqua); }
.lv-atom .pcard.seen .pc-go { color: var(--ok); }

/* step 2: live checks */
.lv-atom .checks { display: flex; flex-direction: column; gap: 6px; margin: 0; padding: 0; list-style: none; }
.lv-atom .checks li { display: flex; gap: 10px; align-items: flex-start; padding: 8px 12px; border-radius: var(--r-s); background: var(--paper-2); font-size: 14.5px; line-height: 1.45; transition: background .25s; }
.lv-atom .checks .ic { flex: none; width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; background: var(--line); color: var(--ink-2); margin-top: 1px; }
.lv-atom .checks .why { display: block; font-size: 12.5px; color: var(--ink-2); }
.lv-atom .checks li.ok { background: var(--ok-soft); }
.lv-atom .checks li.ok .ic { background: var(--ok); color: var(--on-accent); }
.lv-atom .checks li.bad { background: var(--coral-soft); }
.lv-atom .checks li.bad .ic { background: var(--coral); color: var(--on-accent); }

/* step 3: isotopes */
.lv-atom .iso { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.lv-atom .iso-c { display: flex; flex-direction: column; align-items: center; gap: 1px; padding: 8px 4px 10px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); text-align: center; min-width: 0; }
.lv-atom .iso-c svg { width: 100%; max-width: 116px; height: auto; }
.lv-atom .iso-n { font-family: var(--f-display); font-size: 24px; line-height: 1.1; color: var(--ink); }
.lv-atom .iso-py { font-size: 12px; color: var(--ink-3); font-family: var(--f-num); }
.lv-atom .iso-note { font-size: 12px; color: var(--aqua-ink); font-weight: 700; min-height: 1.4em; }
.lv-atom .iso-k { font-size: 12.5px; color: var(--ink-2); line-height: 1.5; }
.lv-atom .iso-k b { font-family: var(--f-num); color: var(--ink); }
.lv-atom .iso-k .same { color: var(--ok); }
.lv-atom .iso-k .diff { color: var(--coral); }

/* step 4: symbols */
.lv-atom .syms { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.lv-atom .sym-c { border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 4px; min-width: 0; transition: border-color .3s; }
.lv-atom .sym-top { display: flex; align-items: baseline; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.lv-atom .sym-c .chem { font-size: 26px; color: var(--ink); line-height: 1.2; }
.lv-atom .sym-hint { font-size: 12px; color: var(--ink-3); }
.lv-atom .sym-c svg { width: 100%; max-width: 190px; height: auto; align-self: center; }
.lv-atom .h-core { fill: var(--aqua); stroke: var(--card); stroke-width: 1.5; }
.lv-atom .h-hl { fill: var(--flame-core); opacity: .45; }
.lv-atom svg .h-t { font-family: var(--f-num); font-weight: 800; font-size: 12px; fill: var(--on-accent); text-anchor: middle; }
.lv-atom .sym-c .mol { transform-box: fill-box; transform-origin: 50% 50%; }
.lv-atom .sym-c.flash { border-color: var(--aqua); animation: atm-flash .8s ease; }
@keyframes atm-flash { 0% { transform: scale(1); } 30% { transform: scale(1.03); } 100% { transform: scale(1); } }
.lv-atom .sym-means { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; min-height: 24px; }
.lv-atom .sym-means li { font-size: 13px; display: flex; gap: 6px; align-items: flex-start; line-height: 1.4; }
.lv-atom .sym-means li.empty { color: var(--ink-3); }
.lv-atom .sym-means li.fresh { animation: atm-pop .4s ease both; }
.lv-atom .tag { flex: none; font-size: 11px; font-weight: 700; padding: 0 6px; border-radius: 999px; line-height: 18px; margin-top: 1px; }
.lv-atom .tag.mac { background: var(--spark-soft); color: var(--ink); }
.lv-atom .tag.mic { background: var(--aqua-soft); color: var(--aqua-ink); }
.lv-atom .sort-bins { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.lv-atom .sort-bin { min-height: 96px; }
.lv-atom .sort-bin-title .chem { font-size: 22px; }
.lv-atom .sort-bin { display: grid; grid-template-columns: auto minmax(0, 1fr); align-content: start; column-gap: 8px; row-gap: 6px; }
.lv-atom .sort-bin-title { grid-column: 1; grid-row: 1; }
.lv-atom .sort-bin-hint { grid-column: 2; grid-row: 1; margin: 0; display: flex; flex-direction: column; align-items: flex-end; text-align: right; line-height: 1.3; }
.lv-atom .sort-bin-hint svg { width: 100%; max-width: 112px; height: auto; flex: none; margin: -4px -6px -6px 0; }
.lv-atom .sort-bin-list { grid-column: 1 / -1; }
.lv-atom .sort-pool .chip, .lv-atom .sort-bin .chip { font-size: 14px; padding: 7px 12px; border-radius: 14px; min-height: 40px; display: inline-flex; align-items: center; }
.lv-atom .w-narrow { display: none; }
@media (max-width: 860px) { .lv-atom .w-wide { display: none; } .lv-atom .w-narrow { display: inline; } }
/* placed (locked) chips must not swallow the tap meant for their bin (engine ignores taps on .draggable) */
.lv-atom .sort-bin .chip.locked { pointer-events: none; }
.lv-atom .legend-row { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; font-size: 12.5px; color: var(--ink-2); }

/* ending: 氢的小档案 */
.lv-atom .dossier { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px 14px; align-items: start; }
.lv-atom .etile { width: 92px; padding: 8px 10px 10px; border-radius: 14px; border: 2px solid var(--aqua); background: var(--card); display: flex; flex-direction: column; box-shadow: var(--shadow-s); }
.lv-atom .etile .z { font-family: var(--f-num); font-weight: 800; font-size: 13px; color: var(--aqua-ink); line-height: 1; }
.lv-atom .etile .s { font-family: var(--f-num); font-weight: 800; font-size: 40px; line-height: 1.05; color: var(--ink); text-align: center; }
.lv-atom .etile .nm { font-family: var(--f-display); font-size: 17px; text-align: center; line-height: 1.2; }
.lv-atom .etile .m { font-family: var(--f-num); font-size: 12px; color: var(--ink-2); text-align: center; }
.lv-atom .facts { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.lv-atom .facts li { display: grid; grid-template-columns: 3.6em minmax(0, 1fr); gap: 8px; font-size: 14px; line-height: 1.5; }
.lv-atom .facts .yr { font-family: var(--f-num); font-weight: 800; color: var(--aqua-ink); }
.lv-atom .facts li.fresh { animation: atm-pop .4s ease both; }
@media (max-width: 400px) {
  .lv-atom .dossier { grid-template-columns: minmax(0, 1fr); }
  .lv-atom .etile { justify-self: center; }
  .lv-atom .iso-n { font-size: 21px; }
}
`;

  const chemS = s => (H2.util && H2.util.chem ? H2.util.chem(s) : s);

  /* ---------------- level ---------------- */
  H2.registerLevel({
    id: 'atom',
    order: 2,
    title: '拼出氢原子',

      points: [

    css: CSS,
    async run(api) {
      const { h, chem } = api;
      const narrow = () => window.matchMedia && matchMedia('(max-width: 860px)').matches;
      const NS = 'http://www.w3.org/2000/svg';
      const retrigger = (el, cls) => { el.classList.remove(cls); void el.getBoundingClientRect(); el.classList.add(cls); };

      api.steps(['认识', '拼原子', '同位素', '符号']);
      api.step(0);

      /* ---- persistent frame: 原子工作台 + 任务卡 ---- */
      const sceneTitle = h('span', { class: 'scene-title' });
      const wrap = h('div', { class: 'scene-wrap no-tile' });
      wrap.innerHTML = atomSVG();
      const zNuc = h('div', { class: 'zone z-nuc dropzone', 'aria-label': '原子核', dataset: { zone: 'nuc' } });
      const zOrb = h('div', { class: 'zone z-orb dropzone', 'aria-label': '核外（电子轨道）', dataset: { zone: 'orb' } });
      const badgeHost = h('div', { class: 'badge-host', role: 'status' });
      wrap.append(zOrb, zNuc, badgeHost);

      const cells = {};
      const mkCell = (k, lab, minus) => {
        const val = h('b', { class: 'm-val' }, '0');
        const btn = minus ? h('button', { class: 'm-minus', type: 'button', 'aria-label': `拿走一个${NAME[k]}`, title: `拿走一个${NAME[k]}`, html: IC.minus, disabled: true }) : null;
        const cell = h('div', { class: `m-cell ${k}` }, h('span', { class: 'm-lab' }, lab), val, btn);
        cells[k] = { cell, val, btn };
        return cell;
      };
      const meter = h('div', { class: 'meter' }, mkCell('p', '质子数', true), mkCell('n', '中子数', true), mkCell('e', '电子数', true), mkCell('z', '核电荷数', false));
      const bench = h('div', { class: 'bench' }, wrap, meter);

      const TOK = { p: ['质子 p<sup>+</sup>', '带正电'], n: ['中子 n', '不带电'], e: ['电子 e<sup>−</sup>', '带负电'] };
      const toks = {};
      const tray = h('div', { class: 'tray', 'aria-label': '零件盒' });
      ['p', 'n', 'e'].forEach(k => {
        const t = h('div', { class: 'tok locked', dataset: { kind: k }, 'aria-label': `${NAME[k]}（${TOK[k][1]}）` });
        t.innerHTML = `${tokIcon(k)}<span><span class="tk-name">${TOK[k][0]}</span><span class="tk-sub">${TOK[k][1]}</span></span>`;
        toks[k] = t; tray.append(t);
      });
      const trayNote = h('div', { class: 'tray-note' }, '零件盒：先认识三种粒子，再来拼原子。');
      const status = h('div', { class: 'status', role: 'status' });
      const scene = h('section', { class: 'panel scene', 'aria-label': '原子工作台' },
        h('div', { class: 'scene-head' }, h('span', { class: 'eyebrow' }, '原子工作台'), sceneTitle), bench, tray, trayNote, status);

      const taskEye = h('span', { class: 'eyebrow' });
      const taskTitle = h('h3', { class: 'task-title' });
      const taskBody = h('div', { class: 'task-body' });
      const task = h('section', { class: 'panel task', 'aria-label': '任务卡' }, h('div', { class: 'task-head' }, taskEye, taskTitle), taskBody);
      api.stage.append(h('div', { class: 'lab' }, scene, task));

      const $ = sel => wrap.querySelector(sel);
      const setTask = (eye, title) => { taskEye.textContent = eye; taskTitle.innerHTML = title; taskBody.innerHTML = ''; return taskBody; };
      const showScene = () => { if (narrow()) api.scrollTo(scene); };
      const showTask = () => { if (narrow()) api.scrollTo(task); };
      const badge = (kind, html) => {
        badgeHost.innerHTML = '';
        if (html) badgeHost.append(h('span', { class: 'pill pop-in' + (kind ? ' ' + kind : ''), html }));
      };

      /* ---- atom model ---- */
      const nucParts = $('.nuc-parts'), eBack = $('.e-back'), eFront = $('.e-front');
      const tile = $('.tile'), tZ = $('.t-z'), tSym = $('.t-sym'), tName = $('.t-name'), tCap = $('.t-cap');
      const S = { p: [], n: [], e: [] };
      const nucOrder = [];
      let editable = false;
      let onChange = () => {};
      let statusExtra = () => null;
      let lastDownSel = false;
      let base = 0;
      const counts = () => ({ p: S.p.length, n: S.n.length, e: S.e.length });

      function placeE(g, th) {
        const [x, y] = orbitPt(th);
        const s = 0.9 + 0.1 * Math.sin(th);
        g.style.transform = `translate(${x.toFixed(2)}px, ${y.toFixed(2)}px) scale(${s.toFixed(3)})`;
        const back = Math.sin(th) < 0;
        if (back !== g._back) { g._back = back; (back ? eBack : eFront).append(g); }
      }
      function respaceE() { const k = S.e.length; S.e.forEach((g, i) => { g._target = (2 * Math.PI * i) / k; }); }
      function layoutNuc() {
        const slots = SLOTS[nucOrder.length] || [];
        nucOrder.forEach((g, i) => { const [x, y] = slots[i]; g._x = CX + x; g._y = CY + y; g.style.transform = `translate(${g._x}px, ${g._y}px)`; });
      }
      function mkPt(kind) {
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('class', 'pt ' + kind);
        g.setAttribute('data-kind', kind);
        g.innerHTML = `<g class="pt-in"><circle class="hit" r="${kind === 'e' ? 32 : 16}"/>${kind === 'e' ? '<circle class="e-glow" r="16"/>' : ''}${ball(kind, kind === 'e' ? ER : PR)}</g><title>${NAME[kind]}（点一下拿走）</title>`;

        if (kind === 'e') g.addEventListener('click', ev => {
          if (!editable || lastDownSel) return;
          ev.stopPropagation();

      // tapping anywhere on the nucleus removes the nucleon nearest to the tap (≈60px target on phones)
      $('.nucleus').addEventListener('click', ev => {
        if (!editable || lastDownSel || !nucOrder.length) return;
        let g = nucOrder[nucOrder.length - 1];
        if (ev.clientX || ev.clientY) {
          const r = wrap.getBoundingClientRect(), k = 480 / (r.width || 480);
          const x = (ev.clientX - r.left) * k, y = (ev.clientY - r.top) * k;
          let best = Infinity;
          nucOrder.forEach(n => { const d = Math.hypot(x - n._x, y - n._y); if (d < best) { best = d; g = n; } });

        ev.stopPropagation();
        removePt(g);

        const g = mkPt(kind);

          respaceE(); g._off = g._target; g._back = null;
          placeE(g, base + g._off);

          nucOrder.push(g);
          nucParts.append(g);
          layoutNuc();
        }
        api.sfx('pop');
        refresh(kind, true);
      }
      function removePt(g) {
        const kind = g.getAttribute('data-kind');
        const i = S[kind].indexOf(g);
        if (i < 0) return;
        S[kind].splice(i, 1);
        if (kind === 'e') respaceE();
        else { nucOrder.splice(nucOrder.indexOf(g), 1); layoutNuc(); }

        api.timeout(() => g.remove(), 300);
        api.sfx('click');
        refresh(kind, false);
      }
      const removeKind = kind => { const a = S[kind]; if (a.length) removePt(a[a.length - 1]); };
      const stopRaf = api.raf(dt => {
        if (!S.e.length) return;
        base += (api.reducedMotion ? 0.35 : 1.5) * dt;
        S.e.forEach(g => { g._off += (g._target - g._off) * Math.min(1, dt * 5); placeE(g, base + g._off); });
      });

      /* ---- readouts ---- */
      let tileKey = '';
      function renderTile(c) {
        const el = ELEM[c.p];
        tZ.textContent = c.p ? String(c.p) : '?';
        tSym.textContent = el ? el.sym : '?';
        tName.textContent = el ? el.name : '还不是元素';
        tile.setAttribute('class', 'tile' + (c.p === 1 ? ' ok' : c.p > 1 ? ' bad' : ''));
        let cap = '', bad = false;
        if (c.p > 1) { cap = '不是氢了！'; bad = true; }
        else if (c.p === 1) cap = ISO[c.n].name + ['（最常见）', '（重氢）', ''][c.n];

        tCap.setAttribute('class', 't-cap' + (bad ? ' bad' : ''));

        else if (c.p === 1) { html = `质子数 1 → <b>氢 H</b>（${ISO[c.n].name}${ISO[c.n].note ? '，' + ISO[c.n].note : ''}）`; cls = 'ok'; }
        else { html = `质子数 ${c.p} → <b>${ELEM[c.p].name} ${ELEM[c.p].sym}</b>，不是氢了！`; cls = 'bad'; }
        status.append(h('span', { class: 'pill ' + cls, html }));
        if (c.p) status.append(c.p === c.e
          ? h('span', { class: 'pill ok' }, '质子数 = 电子数：不显电性')
          : h('span', { class: 'pill warn' }, '质子数 ≠ 电子数：带电，是离子'));
        const extra = statusExtra(c);
        if (extra) status.append(extra);
      }
      function refresh(kind, added) {
        const c = counts();
        cells.p.val.textContent = c.p; cells.n.val.textContent = c.n; cells.e.val.textContent = c.e; cells.z.val.textContent = c.p;
        ['p', 'n', 'e'].forEach(k => { cells[k].btn.disabled = !editable || !c[k]; });
        if (kind) { retrigger(cells[kind].cell, 'bump'); if (kind === 'p') retrigger(cells.z.cell, 'bump'); }
        wrap.classList.toggle('has-e', c.e > 0);
        wrap.classList.toggle('has-nuc', c.p + c.n > 0);
        renderTile(c);
        renderStatus(c);
        if (kind) onChange(c, kind, added);

      function setEditable(on) {
        editable = on;
        Object.values(toks).forEach(t => t.classList.toggle('locked', !on));
        wrap.classList.toggle('locked-parts', !on);
        trayNote.textContent = '拖动粒子到原子核或核外；也可以先点粒子、再点位置。点放好的粒子（或按 −）可以拿走。';

        const ae = document.activeElement;

      ['p', 'n', 'e'].forEach(k => cells[k].btn.addEventListener('click', () => { if (editable) removeKind(k); }));

      /* ---- mistakes: each misconception counts once per phase ---- */
      let phaseMist = new Set();
      function wrongOnce(type, msg) {
        if (!phaseMist.has(type)) { phaseMist.add(type); api.mistake(msg); }
        else { api.sfx('wrong'); api.mood('serious'); api.toast(msg, 'bad', 3400); }

      const flash = cls => { wrap.classList.remove(cls); void wrap.offsetWidth; wrap.classList.add(cls); api.timeout(() => wrap.classList.remove(cls), 1300); };

      /* ---- drag & drop from the tray ---- */
      wrap.addEventListener('pointerdown', () => { lastDownSel = !!tray.querySelector('.tok.selected'); }, true);
      function zoneAt(zone, ev) {
        if (ev && typeof ev.clientX === 'number' && (ev.clientX || ev.clientY)) {
          // pointer → svg units; nucleus = circle, orbit = the tilted ellipse (with some slack).
          // Drops far from both (labels, element tile, corners of the zone's box) are a plain miss.
          const r = wrap.getBoundingClientRect(), k = 480 / (r.width || 480);

          const ux = dx * COS + dy * SIN, uy = -dx * SIN + dy * COS;

      }
      function onDropTok(zone, tok, ev) {

        const where = zoneAt(zone, ev);

        }
        if (kind !== 'e' && where === 'orb') {

        }
        if (S[kind].length >= CAP[kind]) { api.toast(`工作台上最多放 ${CAP[kind]} 个${NAME[kind]}，先拿走一些吧。`, 'info'); return false; }
        addPt(kind);
        return true;
      }
      ['p', 'n', 'e'].forEach(k => api.draggable(toks[k], {
        zones: () => [zNuc, zOrb],
        onStart: () => wrap.classList.add('show-zones'),
        onDrop: onDropTok,
        onMiss: () => wrap.classList.remove('show-zones'),
      }));

      /* live check list used by the build phases */
      function checkList(defs) {
        const lis = defs.map(d => {
          const ic = h('span', { class: 'ic', html: IC.dash });
          const why = h('span', { class: 'why' });
