          li._ic = ic; li._why = why; return li;
        });
        const ul = h('ul', { class: 'checks' }, lis);
        ul.update = c => defs.forEach((d, i) => {
          const v = d.f(c), li = lis[i];
          li.className = v > 0 ? 'ok' : v < 0 ? 'bad' : '';
          li._ic.innerHTML = v > 0 ? IC.check : v < 0 ? IC.cross : IC.dash;
          li._why.textContent = v < 0 ? d.bad : '';
        });
        return ul;
      }

      /* ============ 1 · 认识 ============ */
      sceneTitle.textContent = '原子 = 原子核 + 核外电子';
      const qq = h('div', { class: 'qq' }, h('img', { src: H2.assets.head_happy || '', alt: '', draggable: 'false' }), h('span', null, '像不像我的光环？'));
      wrap.append(qq);
      refresh();
      let body = setTask('第 1 步 · 认识', '原子由什么构成？');
      body.append(h('p', { class: 'lead', html: '<span class="w-wide">左边</span><span class="w-narrow">上面</span>是一个<b>原子工作台</b>：中间的虚线圆是<b>原子核</b>，外面那圈倾斜的椭圆表示<b>核外电子</b>绕核运动（示意）。' }));

      await api.say([
        { mood: 'happy', text: '上一站，我们把小水滴拆成了氢气和氧气。' },
        { mood: 'curious', text: '这一站，我要认识构成氢分子的小不点——氢原子！' },
        { mood: 'happy', text: '你看我头上的光环，像不像电子绕着原子核转的轨道？' },
      ]);

      const PC = [
        { k: 'p', name: '质子 p<sup>+</sup>', facts: '<span class="seg">位置：<b>原子核内</b></span><span class="seg">电性：<b>带正电</b></span>', hl: 'hl-nuc' },
        { k: 'n', name: '中子 n', facts: '<span class="seg">位置：<b>原子核内</b></span><span class="seg">电性：<b>不带电</b></span>', hl: 'hl-nuc' },
        { k: 'e', name: '电子 e<sup>−</sup>', facts: '<span class="seg">位置：<b>核外</b>，绕核高速运动</span><span class="seg">电性：<b>带负电</b></span>', hl: 'hl-orb' },
      ];
      const seenPill = h('span', { class: 'pill' }, '已认识 0 / 3');
      const cardList = h('ul', { class: 'pcards' });
      const introBtn = api.button('开始拼原子 ›');
      introBtn.hidden = true;
      body.append(h('div', { class: 'sub-h' }, h('span', null, '构成原子的三种粒子'), seenPill), cardList, h('div', { class: 'btn-row' }, introBtn));
      api.hint('点一点「任务卡」里的三种粒子，看看它们住在哪里、带什么电。');
      await api.task(res => {
        const seen = new Set();
        PC.forEach(pc => {
          const facts = h('span', { class: 'pc-facts' }, '点一下，看看它在哪里、带什么电');
          const go = h('span', { class: 'pc-go', html: IC.eye + '看一看' });
          const b = h('button', { class: 'pcard', type: 'button' }, h('span', { class: 'pc-ico', html: tokIcon(pc.k) }), h('span', null, h('span', { class: 'pc-name', html: pc.name }), facts), go);
          b.addEventListener('click', () => {
            facts.innerHTML = pc.facts; b.classList.add('seen'); go.innerHTML = IC.check + '认识了';
            api.sfx('pop');
            wrap.classList.remove('hl-nuc', 'hl-orb'); void wrap.offsetWidth; wrap.classList.add(pc.hl);
            Object.keys(toks).forEach(k => toks[k].classList.toggle('hl', k === pc.k));
            seen.add(pc.k);
            seenPill.textContent = `已认识 ${seen.size} / 3`;
            if (seen.size === 3 && introBtn.hidden) {
              seenPill.className = 'pill ok';
              introBtn.hidden = false; introBtn.classList.add('pop-in');
              api.timeout(() => api.scrollTo(introBtn), 60);   // phones: the button appears below the fold
              api.hint('三种粒子都认识啦！点「开始拼原子」。', 'curious');
            }
          });
          cardList.append(h('li', null, b));
        });
        introBtn.addEventListener('click', () => res(), { once: true });
        showTask();
      });
      introBtn.disabled = true;
      wrap.classList.remove('hl-nuc', 'hl-orb');
      Object.values(toks).forEach(t => t.classList.remove('hl'));
      await api.say([
        { mood: 'happy', text: '原子由居于中心的<b>原子核</b>和核外的<b>电子</b>构成。' },
        { mood: 'happy', text: '原子核里有质子，一般还有中子；电子在核外绕着原子核高速运动。' },
      ]);

      /* ============ 2 · 拼原子 ============ */
      api.step(1);
      qq.classList.add('gone');
      wrap.classList.remove('no-tile');
      sceneTitle.textContent = '拼一个最常见的氢原子';
      body = setTask('第 2 步 · 拼原子', '拼出最常见的氢原子');
      const checks1 = checkList([
        { t: '属于<b>氢元素</b>', f: c => (!c.p ? 0 : c.p === 1 ? 1 : -1), bad: '质子数决定元素种类：质子多了，就变成别的元素了' },
        { t: '原子<b>不显电性</b>', f: c => (!c.p && !c.e ? 0 : c.p === c.e && c.p > 0 ? 1 : -1), bad: '原子里，核外电子数要等于质子数' },
        { t: '是<b>最常见</b>的那种氢原子', f: c => (c.n > 0 ? -1 : c.p === 1 ? 1 : 0), bad: '原子核里有中子，就不是最常见的氢原子了' },
      ]);
      body.append(
        h('p', { class: 'lead', html: '氢是 <b>1 号元素</b>。想一想：它的原子核里要放什么？核外要放几个电子？' }),
        h('div', { class: 'sub-h' }, h('span', null, '检查表（边拼边看）')),
        checks1);
      checks1.update(counts());
      await api.say({ mood: 'happy', text: '来，用零件盒拼一个<b>最常见的氢原子</b>吧！看好元素读数牌哦。' });
      showScene();
      phaseMist = new Set();
      const HINT2 = '把粒子拖到<b>原子核</b>或<b>核外轨道</b>上（也可以先点粒子、再点位置）。点放好的粒子可以拿走。';
      const fixBtn = (label, kind, keep) => api.button(label, { primary: false, className: 'btn-sm', onClick: () => { while (S[kind].length > keep) removeKind(kind); } });
      statusExtra = c => (c.p > 1 ? fixBtn('拿走多余的质子', 'p', 1) : c.n > 0 ? fixBtn('拿走中子', 'n', 0) : null);
      setEditable(true);
      api.hint(HINT2);
      await api.task(res => {
        let done = false;
        onChange = (c, kind, added) => {
          checks1.update(c);
          if (done) return;
          if (added && kind === 'n') {
            wrongOnce('n-build', c.p === 1 && c.n <= 2
              ? `加了中子，就变成<b>${ISO[c.n].name}${c.n === 1 ? '（重氢）' : ''}</b>了！最常见的氢原子<b>没有中子</b>。点一下中子（或按 −）把它拿走。`
              : '最常见的氢原子，原子核里只有 1 个质子、<b>没有中子</b>。点一下中子（或按 −）把它拿走。');
          } else if (added && kind === 'p' && c.p > 1) {
            api.sfx('wrong'); api.mood('serious');
            api.toast(`质子数变成 ${c.p}，就成了<b>${ELEM[c.p].name}元素</b>，不是氢了！<b>质子数决定元素种类</b>。`, 'bad', 3600);
          }
          if (c.p === 1 && c.n === 0 && c.e === 1) {
            done = true; setEditable(false);
            api.hint('拼好啦！', 'curious');
            api.timeout(() => res(), 650);
          } else if (c.p > 1) api.hint('质子太多了：拿走多余的质子（点它，或按质子数旁边的 −）。');
          else if (c.n > 0) api.hint('最常见的氢原子没有中子：把中子拿走。');
          else if (c.p === 1 && c.e !== 1) api.hint(c.e ? '电子多了：原子里核外电子数要等于质子数。' : '原子核拼好了！再往<b>核外轨道</b>放电子吧。');
          else if (!c.p && c.e) api.hint('原子核里还没有质子哦。');
          else api.hint(HINT2);
        };
      });
      statusExtra = () => null;
      refresh();
      badge('ok', '氢原子 H 拼好了！');
      api.good(); api.sfx('sparkle');
      await api.say([
        { mood: 'curious', text: '拼好啦！1 个质子、1 个电子——这就是最常见的氢原子。' },
        { mood: 'happy', text: '它的原子核里<b>没有中子</b>。所以，并不是所有原子的原子核里都有中子哦。' },
        { mood: 'happy', text: '核内质子带的正电荷与核外电子带的负电荷，数量相等、电性相反，所以原子不显电性。' },
      ]);
      badge();
      api.hint('回答任务卡里的问题。');
      await api.choice({
        container: body,
        q: '在原子中：核电荷数 = 质子数 = ？',
        options: [
          { html: '核外电子数', correct: true },
          { html: '中子数', why: '中子不带电，和核电荷数无关。最常见的氢原子中子数是 0，质子数却是 1。' },
          { html: '相对原子质量', why: '相对原子质量表示原子质量的大小，不是电荷的多少。' },
        ],
        explain: '对！在原子中，<b>核电荷数 = 质子数 = 核外电子数</b>。氢原子：1 = 1 = 1。',
      });

      /* ============ 3 · 同位素（拓展） ============ */
      api.step(2);
      sceneTitle.textContent = '氢元素的另一种原子';
      body = setTask('第 3 步 · 同位素（拓展）', '拼出氘（dāo）——重氢');
      const checks2 = checkList([
        { t: '质子数 = 1', f: c => (c.p === 1 ? 1 : c.p > 1 ? -1 : 0), bad: '质子数一变，就不是氢元素了' },
        { t: '中子数 = 1', f: c => (c.n === 1 ? 1 : c.n > 1 ? -1 : 0), bad: '中子多了一个' },
        { t: '电子数 = 1', f: c => (c.e === 1 ? 1 : c.e > 1 ? -1 : 0), bad: '电子要和质子一样多' },
      ]);
      body.append(
        h('p', { class: 'lead', html: '氢元素还有别的原子：它们的原子核里<b>多了中子</b>。' }),
        h('div', { class: 'sub-h' }, h('span', null, '目标：氘（重氢）')),
        checks2);
      checks2.update(counts());
      await api.say([
        { mood: 'happy', text: '悄悄告诉你：氢元素的原子，不止这一种～' },
        { mood: 'curious', text: '挑战：给它加 1 个中子，拼出<b>氘（dāo）</b>，也叫重氢！' },
      ]);
      showScene();
      phaseMist = new Set();
      const HINT3 = '拼出氘：原子核里 <b>1 个质子 + 1 个中子</b>，核外 <b>1 个电子</b>。';
      statusExtra = c => (c.p > 1 ? fixBtn('拿走多余的质子', 'p', 1) : c.n > 1 ? fixBtn('拿走多余的中子', 'n', 1) : null);
      setEditable(true);
      api.hint(HINT3);
      await api.task(res => {
        let done = false;
        onChange = (c, kind, added) => {
          checks2.update(c);
          if (done) return;
          if (added && kind === 'p' && c.p > 1) {
            wrongOnce('p-iso', `多了一个质子，就变成<b>${ELEM[c.p].name}元素</b>了！同一种元素的原子，<b>质子数一定相同</b>。`);
          }
          if (c.p === 1 && c.n === 1 && c.e === 1) {
            done = true; setEditable(false);
            api.hint('拼好啦！', 'curious');
            api.timeout(() => res(), 650);
          } else if (c.p > 1) api.hint('质子多了：拿走多余的质子，氢的原子核里只有 1 个质子。');
          else if (c.n > 1) api.hint('中子多了一个——那是另一种氢原子。氘只有 1 个中子。');
          else api.hint(HINT3);
        };
      });
      statusExtra = () => null;
      refresh();
      badge('ok', '氘（重氢）拼好了！');
      api.good();
      await api.say([
        { mood: 'curious', text: '对！这就是<b>氘</b>，也叫重氢。' },
        { mood: 'happy', text: '要是再加 1 个中子呢？看好啦——' },
      ]);
      badge();
      sceneTitle.textContent = '再加 1 个中子：氚（chuān）';
      onChange = () => {};   // the demo neutron must not flip the 氘 checklist to "中子多了"
      addPt('n');
      api.sfx('sparkle');
      badge('', '氚：1 个质子 + 2 个中子');
      await api.wait(900);

      body = setTask('第 3 步 · 同位素（拓展）', '氕、氘、氚：都是氢');
      const isoRow = h('div', { class: 'iso' });
      [0, 1, 2].forEach(nN => {
        const iso = ISO[nN];
        const card = h('div', { class: 'iso-c pop-in', style: { animationDelay: nN * 0.12 + 's' } },
          h('div', { html: miniAtom(1, nN, !api.reducedMotion) }),
          h('span', { class: 'iso-n' }, iso.name), h('span', { class: 'iso-py' }, iso.py),
          h('span', { class: 'iso-note' }, nN === 0 ? '最常见' : iso.note || '\u00a0'),
          h('span', { class: 'iso-k', html: `质子 <b class="same">1</b><br>中子 <b class="diff">${nN}</b><br>电子 <b>1</b>` }));
        isoRow.append(card);
      });
      body.append(h('p', { class: 'lead', html: '比一比三种原子的<b>质子数</b>、<b>中子数</b>和<b>电子数</b>：' }), isoRow);
      showTask();
      await api.say([
        { mood: 'happy', text: '氕、氘、氚：质子数都是 1，中子数分别是 0、1、2。' },
        { mood: 'curious', text: '它们的原子不一样，却都叫「氢」——为什么呢？' },
      ]);
      badge();
      api.hint('回答任务卡里的问题。');
      await api.choice({
        container: body,
        q: '氕、氘、氚都属于氢元素，是因为它们的哪一项相同？',
        options: [
          { html: '质子数（即核电荷数）', correct: true },
          { html: '中子数', why: '中子数分别是 0、1、2，并不相同。' },
          { html: '相对原子质量', why: '氘又叫重氢，比氕重——它们的相对原子质量并不相同。' },
        ],
        explain: '<b>元素</b>是质子数（即核电荷数）相同的一类原子的总称。氕、氘、氚的质子数都是 1，都是氢元素。',
      });

      /* ============ 4 · 符号 ============ */
      api.step(3);
      stopRaf();
      sceneTitle.textContent = '符号背后的微观世界';
      [bench, tray, trayNote, status].forEach(el => { el.hidden = true; });
      const symCards = {};
      const syms = h('div', { class: 'syms' });
      SYM.forEach(s => {
        const means = h('ul', { class: 'sym-means', 'aria-live': 'polite' }, h('li', { class: 'empty' }, '意义：？'));
        const c = h('div', { class: 'sym-c pop-in' },
          h('div', { class: 'sym-top' }, h('span', { html: chem(s.chem) }), h('span', { class: 'sym-hint' }, s.hint)),
          h('div', { class: 'center', html: symPic(s) }), means);
        symCards[s.id] = { c, means };
        syms.append(c);
      });
      scene.append(syms, h('div', { class: 'legend-row', html: '<span class="tag mac">宏观</span>表示物质或元素<span class="tag mic">微观</span>表示分子、原子等粒子' }));

      body = setTask('第 4 步 · 符号', '符号和数字，各表示什么？');
      body.append(h('p', { class: 'lead', html: '把每张<b>意义卡片</b>放进对应的符号框。对照示意图想一想：有几个原子？它们连在一起了吗？' }));
      await api.say([

        { mood: 'curious', text: '同样是 H 和 2，写的位置不同，意思可大不一样哦～' },

        { text: '氢元素', bin: 'H', why: `元素只讲种类、不讲个数，用元素符号 ${chem('H')} 表示。` },

        { text: '两个氢原子', bin: '2H', why: `表示几个（分开的）原子，就在元素符号<b>前面</b>写数字：${chem('2H')}。${chem('H2')} 右下角的小 2 是说一个氢分子由两个氢原子构成。` },
        { text: '两个氢分子', bin: '2H2', why: `表示几个分子，就在化学式<b>前面</b>写数字：${chem('2H2')}。` },
      ];
      // every correct placement is echoed on the matching symbol card (meaning + 宏观/微观 tag)
      const onPlaced = (it, binId) => {
        const card = symCards[binId];

        const empty = card.means.querySelector('.empty');
        if (empty) empty.remove();
        const t = it.text;
        card.means.append(h('li', { class: 'fresh' }, h('span', { class: 'tag ' + (MAC[t] ? 'mac' : 'mic') }, MAC[t] ? '宏观' : '微观'), h('span', null, t)));
        retrigger(card.c, 'flash');
      };
      api.hint('把意义卡片拖进对应的符号框（也可以先点卡片、再点框）。');
      showTask();
      await api.sortInto({
        container: body,
        bins: SYM.map(s => ({ id: s.id, title: chem(s.chem), hint: `<span>${s.hint}</span>${symPic(s)}` })),
        items: ITEMS,

      });

      showScene();
      body = setTask('第 4 步 · 符号', '数字写在前面，意思就变了');
      body.append(h('div', { class: 'concl', html: `${chem('H')}、${chem('H2')} 既有<b>宏观</b>意义，也有<b>微观</b>意义；在前面加上数字（${chem('2H')}、${chem('2H2')}），就只表示几个粒子——<b>只有微观意义</b>。` }));
      await api.say([
        { mood: 'curious', text: `都放好啦！看示意图：${chem('H2')} 是两个原子结合成的一个分子，${chem('2H')} 是两个分开的原子。` },
        { mood: 'happy', text: '符号前面一加数字，就只表示几个粒子了。' },
      ]);
      api.hint('回答任务卡里的问题。');
      await api.choice({
        container: body,
        q: `${chem('2H')} 能表示氢元素吗？`,
        options: [
          { html: `不能。元素只讲种类、不讲个数，${chem('2H')} 只表示两个氢原子`, correct: true },
          { html: `能，${chem('2H')} 表示两个氢元素`, why: '元素只讲种类、不讲个数，没有“两个氢元素”的说法。' },
          { html: `能，${chem('2H')} 就表示氢气`, why: `氢气的化学式是 ${chem('H2')}；${chem('2H')} 是两个分开的氢原子，没有结合成分子。` },
        ],
        explain: `对！${chem('2H')} 只有微观意义：两个氢原子。`,

`;

  H2.registerLevel({
    id: 'lightest',
    order: 3,
    title: '最轻的气体',
    subtitle: '氢气的物理性质',
    card: {
      title: '氢气的物理性质',
      points: [
        '<b>无色、无臭、难溶于水</b>的气体',
        '密度比空气小，是相同条件下<b>密度最小</b>的气体（标准状况下约 0.09 g/L）',
        '难溶于水 → <b>排水法</b>；密度比空气小 → <b>向下排空气法</b>',
        '集满氢气的集气瓶盖好玻璃片后<b>倒放</b>在桌上',
        '气球充<b>氦气</b>更安全：氢气可燃',
      ],
    },
    css: CSS,
    async run(api) {
      const { h } = api;
      // async event handlers live outside the run() promise chain: swallow the AbortError of a left level
      const safe = fn => (...a) => { Promise.resolve().then(() => fn(...a)).catch(e => { if (!e || e.name !== 'AbortError') console.error(e); }); };
      const narrow = () => window.matchMedia && matchMedia('(max-width: 860px)').matches;
      const RM = api.reducedMotion;

      api.steps(['气球实验', '比一比', '性质分类', '收集方法']);
      api.step(0);

      /* ---- persistent frame: 实验台 + 实验记录本 ---- */
      const sceneTitle = h('span', { class: 'scene-title' });
      const body = h('div', { class: 'scene-body' });
      const ctrl = h('div', { class: 'scene-ctrl' });
      const scene = h('section', { class: 'panel scene', 'aria-label': '实验台' },
        h('div', { class: 'scene-head' }, h('span', { class: 'eyebrow' }, '实验台'), sceneTitle), body, ctrl);
      const taskEye = h('span', { class: 'eyebrow' });
      const taskTitle = h('h3', { class: 'task-title' });
      const taskBody = h('div', { class: 'task-body' });
      const task = h('section', { class: 'panel task', 'aria-label': '实验记录本' }, h('div', { class: 'task-head' }, taskEye, taskTitle), taskBody);
      api.stage.append(h('div', { class: 'lab' }, scene, task));

      const setScene = (title, ...nodes) => { sceneTitle.textContent = title; body.innerHTML = ''; ctrl.innerHTML = ''; nodes.forEach(n => body.append(typeof n === 'string' ? api.frag(n) : n)); };
      const setTask = (eye, title) => { taskEye.textContent = eye; taskTitle.innerHTML = title; taskBody.innerHTML = ''; return taskBody; };
      const showScene = () => { if (narrow()) api.scrollTo(scene); };
      const showTask = () => { if (narrow()) api.scrollTo(task); };
      const svgBox = markup => { const b = h('div', { class: 'svgbox' }); b.innerHTML = markup; return b; };
      const badge = (kind, html) => {
        let b = body.querySelector('.scene-badge');
        if (!b) { b = h('div', { class: 'scene-badge pill', role: 'status' }); body.append(b); }
        if (!html) { b.hidden = true; return; }
        b.hidden = false; b.className = 'scene-badge pill pop-in' + (kind ? ' ' + kind : ''); b.innerHTML = html;
      };
      // the engine scrolls choice feedback into view ~40 ms after a pick; for the multi-select that leaves the
      // 「提交答案」 row below the fold on phones, so afterwards bring the box's last row into view as well
      const fbObs = new MutationObserver(muts => {
        for (const m of muts) {
          const t = m.target;
          if (t.classList && t.classList.contains('choice-feedback') && !t.hidden) {
            const box = t.closest('.choice');
            api.timeout(() => { if (box && box.isConnected && box.lastElementChild) api.scrollTo(box.lastElementChild); }, 140);
            break;
          }
        }
      });
      fbObs.observe(taskBody, { attributes: true, subtree: true, attributeFilter: ['class', 'hidden'] });
      api.signal.addEventListener('abort', () => fbObs.disconnect());
      const concl = (html, warn) => h('div', { class: 'concl pop-in' + (warn ? ' warn' : ''), html });

      /* ============ 1 · 气球实验 ============ */
      const room = svgBox(roomSVG());
      const tankBtns = GASES.map(g => h('button', {
        class: 'tank dropzone', type: 'button', dataset: { gas: g.id },
        'aria-label': `${g.name}${g.f ? ' ' + g.f : ''}，${g.id === 'air' ? '平均相对分子质量约 29' : '相对分子质量 ' + g.mr}。给气球充${g.name}`,
        html: `${cylSVG(g.id)}<span class="t-name">${g.name}</span><span class="t-f">${g.f ? api.chem(g.f) : '（混合物）'}</span><span class="t-mr">${g.mrText}</span>`,
      }));
      const tanks = h('div', { class: 'tanks', role: 'group', 'aria-label': '5 罐气体' }, tankBtns);
      setScene('气球实验：给氢氢的气球充气', room, tanks,
        h('p', { class: 'scene-note' }, '罐上的数字是相对分子质量（空气是混合物，取平均值约 29）。气球每隔相同时间留下一个小圆点——点越稀，跑得越快。'));
      const svg = room.querySelector('svg');
      const lane = id => svg.querySelector(`.lane[data-gas="${id}"]`);

      const newb = h('div', { class: 'newb', 'aria-label': '新气球：拖到一罐气体上充气' });
      newb.innerHTML = `${BALLOON_SMALL}<span>新气球</span>`;
      const status = h('span', { class: 'status', 'aria-live': 'polite' }, '把新气球拖到一罐气体上');
      const releaseBtn = api.button(`${IC.release}<span>松手放飞</span>`, { className: 'release' });
      releaseBtn.disabled = true;
      ctrl.append(h('div', { class: 'ctrl-row' }, newb, releaseBtn), status);

      // task panel: records table (rows sorted by relative molecular mass)
      let tb = setTask('第 1 步 · 气球实验', '哪种气体让气球飞得最快？');
      const rows = {};
      const recRows = BY_MR.map(g => {
        const res = h('span', { class: 'rec-res', role: 'cell' }, '待测');
        const r = h('div', { class: 'rec-r', role: 'row', dataset: { gas: g.id } },
          h('span', { class: 'rec-g', role: 'cell' }, h('i', { class: 'sw b-' + g.id }), g.name),
          h('span', { class: 'rec-bar', role: 'cell' }, h('span', { class: 'trk' }, h('span', { class: 'fill b-' + g.id, style: { width: (g.mr / MR_MAX * 100).toFixed(1) + '%' } })), h('span', { class: 'num' }, g.mrText)),
          res);
        rows[g.id] = { r, res };
        return r;
      });
      const foundBtn = api.button('我找到答案了 ›', { className: 'go' });
      foundBtn.hidden = true;
      const lead1 = h('p', { class: 'lead', html: '选一罐气体给气球充气，再<b>松手</b>，看气球是升还是降。至少试 <b>2 种</b>气体，找出让气球<b>上升最快</b>的那一种。' });
      tb.append(
        lead1,
        h('div', { class: 'rec', role: 'table', 'aria-label': '实验记录' },
          h('div', { class: 'rec-h', role: 'row' }, h('span', { role: 'columnheader' }, '气体'), h('span', { role: 'columnheader' }, '相对分子质量'), h('span', { role: 'columnheader' }, '松手后')),
          recRows,
          h('div', { class: 'rec-f', 'aria-hidden': 'true' }, h('span', { class: 'side' }, ''), h('span', { class: 'ax' }, h('span', { class: 'trk' }), h('span', { class: 'lbl' }, '空气 ≈ 29')), h('span', { class: 'side' }, ''))),
        h('div', { class: 'btn-row' }, foundBtn));

      await api.say([
        { mood: 'happy', text: '欢迎来到第 3 站！你发现了吗？我手里一直拿着一个气球～' },
        { mood: 'curious', text: '我的名字「氢」和「轻」同音哦。今天，我们来找<b>最轻的气体</b>！' },
        { mood: 'happy', text: '这里有 5 罐气体。给气球充上不同的气体，松手看看会发生什么。' },
      ]);

      let phase = 'idle', cur = null, locked = false, asking = false;
      const tried = new Set();
      const G = id => GASES.find(g => g.id === id);
      const setTanks = on => tankBtns.forEach(b => { b.disabled = !on; });
      const exploreHint = () => api.hint(tried.size >= 2
        ? '已经比较了 ' + tried.size + ' 种气体。可以继续试；想好了就点「我找到答案了」。'
        : '把「新气球」拖到一罐气体上（或先点气球、再点气罐）充气，然后「松手放飞」。');
      // Dialog.hint() during a blocking api.say() drops that say's 继续 handler (soft lock), so experiment
      // callbacks that finish late only talk to the dock while the experiment is still open.
      const freeHint = (html, mood) => { if (!locked) api.hint(html, mood); };
      const balT = (el, x, y, s) => el.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) scale(${s.toFixed(3)})`);

      async function fill(id) {
        if (phase !== 'idle') return;
        phase = 'filling'; cur = G(id);
        setTanks(false);
        const btn = tankBtns.find(b => b.dataset.gas === id); btn.classList.add('on');
        newb.classList.add('gone'); badge();
        svg.querySelectorAll('.lane').forEach(l => l.classList.toggle('sel', l.dataset.gas === id));
        const L = lane(id); const bal = L.querySelector('.bal'); const hose = L.querySelector('.hose');
        L.querySelector('.trail').innerHTML = '';
        L.classList.add('tried');
        status.innerHTML = `正在充入<b>${cur.name}</b>……`;
        hose.classList.add('on'); api.sfx('fizz');
        if (RM) balT(bal, 0, Y_HAND, 1);
        else await api.task(res => { let t = 0; api.raf(dt => { t += Math.max(0, dt); const k = Math.min(1, t / 0.85); balT(bal, 0, Y_HAND, 0.06 + 0.94 * (1 - Math.pow(1 - k, 2))); if (k >= 1) { res(); return false; } }); });
        hose.classList.remove('on'); api.sfx('pop');
        phase = 'ready';
        status.innerHTML = `充好了一个<b>${cur.name}</b>气球`;
        releaseBtn.disabled = false; releaseBtn.focus({ preventScroll: true });
        freeHint('气球充好啦，按「松手放飞」！');
      }

      async function release() {
        if (phase !== 'ready') return;
        phase = 'flying'; releaseBtn.disabled = true;
        const g = cur; const L = lane(g.id); const bal = L.querySelector('.bal'); const trail = L.querySelector('.trail');
        const up = g.vt < 0; const target = up ? Y_TOP : Y_FLOOR;
        status.textContent = '松手！';
        freeHint('看，气球往哪边走？每隔相同时间，它会留下一个小圆点。');
        if (narrow()) api.scrollTo(room);
        api.sfx(up ? 'whoosh' : 'click');
        const dot = (x, y) => trail.append(svgEl('circle', { cx: x.toFixed(1), cy: (y - 70).toFixed(1), r: 2.2, class: 'g-' + g.id }));
        if (RM) {
          const n = Math.max(3, Math.round(Math.abs(target - Y_HAND) / Math.abs(g.vt) / 0.25));
          for (let i = 0; i < n; i++) dot(0, Y_HAND + (target - Y_HAND) * i / n);
          balT(bal, 0, target, 1);
        } else {
          await api.task(res => {
            let y = Y_HAND, v = 0, t = 0, next = 0, arrived = false, x = 0;
            api.raf(dt => {
              dt = Math.max(0, dt); t += dt;
              v += (g.vt - v) * Math.min(1, dt * 3);
              y += v * dt;
              x = Math.sin(t * 2.4) * (up ? 3 : 1.5) * Math.min(1, t * 2);
              if (!arrived && t >= next) { dot(x, y); next += 0.25; }
              const hit = up ? y <= target : y >= target;
              if (hit) {
                y = target;
                if (!arrived) { arrived = true; api.sfx(up ? 'pop' : 'puff'); }
                if (Math.abs(v) < 10) { balT(bal, x, y, 1); res(); return false; }
                v = -v * 0.28;
              }
              balT(bal, x, y, 1);
              if (t > 9) { balT(bal, x, target, 1); res(); return false; }
            });
          });
        }
        // record
        tried.add(g.id);
        const row = rows[g.id]; row.r.classList.add('done');
        row.res.className = 'rec-res pop-in ' + (up ? 'up' : 'down');
        row.res.innerHTML = arrowsHtml(g.arrows) + '<span>' + g.word + '</span>';
        tankBtns.find(b => b.dataset.gas === g.id).classList.add('done');
        tankBtns.forEach(b => b.classList.remove('on'));
        phase = 'idle'; newb.classList.remove('gone'); setTanks(!locked);
        status.innerHTML = locked ? '实验完成' : `<b>${g.name}</b>气球：${g.word}。再拿一个新气球试试？`;
        if (locked) { newb.classList.add('gone'); return; }
        if (tried.size >= 2 && foundBtn.hidden) {
          foundBtn.hidden = false; foundBtn.classList.add('pop-in');
          // phones: the records table and this button sit below the lab — show them once
          api.timeout(() => { if (!asking && phase === 'idle' && narrow()) api.scrollTo(foundBtn); }, 600);
        }
        freeHint(g.react + (asking ? ' 选出上升最快的气体吧。' : tried.size >= 2 ? ' 想好了就点「我找到答案了」。' : ' 再换一种比一比。'), up ? 'curious' : 'happy');
      }

      tankBtns.forEach(b => b.addEventListener('click', () => { if (phase === 'idle') safe(fill)(b.dataset.gas); }));
      releaseBtn.addEventListener('click', safe(release));
      api.draggable(newb, {
        zones: () => tankBtns.filter(b => !b.disabled),
        disabled: () => phase !== 'idle',
        onDrop: zone => { safe(fill)(zone.dataset.gas); return true; },
      });
      showScene();
      exploreHint();
      await api.task(res => foundBtn.addEventListener('click', res, { once: true }));
      asking = true; foundBtn.parentNode.remove(); lead1.remove();
      api.hint('看看记录表，选出让气球上升最快的气体。');
      const q1 = h('div');
      tb.append(q1);
      await api.choice({
        container: q1,
        q: '让气球<b>上升最快</b>的是哪种气体？',
        options: GASES.map(g => ({
          html: `${g.name}${g.f ? ' ' + api.chem(g.f) : ''}`, correct: g.id === 'h2',
          why: {
            he: '氦气球会上升，但没有氢气球快：He 的相对分子质量是 4，比 H<sub>2</sub>（2）大。',
            air: '装空气的气球会慢慢落下：里外都是空气，还多了橡胶皮的重量。',
            o2: 'O<sub>2</sub> 的相对分子质量是 32，比空气（约 29）大，气球会慢慢下沉。',
            co2: 'CO<sub>2</sub> 的相对分子质量是 44，比空气大得多，气球一松手就沉下去了。',
          }[g.id],
        })),
        explain: '对，是<b>氢气</b>！相对分子质量比 29 <b>小</b>的气体，密度比空气小；H<sub>2</sub> 的相对分子质量最小，气球升得最快。比 29 大的（O<sub>2</sub>、CO<sub>2</sub>），气球会下沉。',
      });
      locked = true;
      if (phase === 'idle') { setTanks(false); newb.classList.add('gone'); status.textContent = '实验完成'; }
      rows.h2.r.classList.add('best');
      // let a balloon that is still in play finish; if the player answered from the table without ever
      // flying hydrogen, fly one now so the next line ("嗖地就冲上去了") matches what they saw
      await api.task(res => api.raf(() => { if (phase === 'idle' || phase === 'ready') { res(); return false; } }));
      if (phase === 'ready') await release();
      if (!tried.has('h2')) {
        api.hint('你还没放飞过氢气球吧？看——', 'curious');
        if (narrow()) api.scrollTo(room);
        await fill('h2');
        if (!RM) await api.wait(350);
        await release();
      }
      await api.say([
        { mood: 'curious', text: '没错！H<sub>2</sub> 的相对分子质量只有 2，氢气球「嗖」地就冲上去了～' },
        { mood: 'happy', text: '气球升得快不快，和气体的<b>密度</b>有关。下面我们来比一比！' },
      ]);

      /* ============ 2 · 比一比 ============ */
      api.step(1);
      setScene('比一比：标准状况下的密度（按比例画）', svgBox(densitySVG()));
      const dsvg = body.querySelector('svg');
      const stackBtn = api.button(`${IC.stack}<span>把氢气柱一块块叠上去</span>`, { className: 'stack-btn' });
      stackBtn.disabled = true;
      ctrl.append(stackBtn);
      tb = setTask('第 2 步 · 比一比', '谁的密度最小？');
      tb.append(h('p', { class: 'lead', html: '<b>密度</b>是单位体积物质的质量。相同条件下，气体的<b>相对分子质量越小，密度越小</b>——气球实验里，它升得越快。' }));
      const q2 = h('div'); tb.append(q2);
      showTask();
      api.hint('先回答：相同条件下，哪种气体的密度最小？');
      await api.choice({
        container: q2,
        q: '相同条件下，下面哪种气体的<b>密度最小</b>？',
        options: [
          { html: '氢气 ' + api.chem('H2'), correct: true },
          { html: '氦气 ' + api.chem('He'), why: 'He 的相对分子质量是 4，比 H<sub>2</sub>（2）大，所以氦气的密度比氢气大。' },
          { html: '空气', why: '空气的平均相对分子质量约为 29，比氢气大得多——装空气的气球还会往下落呢。' },
          { html: '二氧化碳 ' + api.chem('CO2'), why: 'CO<sub>2</sub> 的相对分子质量是 44，比空气还大，密度比空气大。' },
        ],
        explain: '对！氢气是相同条件下<b>密度最小</b>的气体。看实验台上的柱形图：它的密度比空气小多少？',
      });
      stackBtn.disabled = false;
      showScene();
      api.hint('点「把氢气柱一块块叠上去」，看看要几块氢气柱才和空气柱一样高。');
      await api.waitClick(stackBtn);
      stackBtn.disabled = true;
      const stackG = dsvg.querySelector('.stack'), cnt = dsvg.querySelector('.cnt');
      dsvg.querySelector('.q').style.display = 'none';
      for (let i = 0; i < 14; i++) {
        const y = BASE - (i + 1) * H2_H;
        stackG.append(svgEl('rect', { class: 'blk g-h2', x: 205, y: y.toFixed(2), width: 90, height: H2_H, rx: 1.5 }));
        cnt.setAttribute('y', (y - 7).toFixed(1)); cnt.textContent = '× ' + (i + 1);
        if (!RM) { api.sfx(i === 13 ? 'sparkle' : 'bubble'); await api.wait(i < 3 ? 260 : 120); }
      }
      cnt.textContent = '';
      dsvg.querySelector('.target').classList.add('full');
      dsvg.querySelector('.stack-lab').textContent = '14 块氢气';
      badge('ok', '空气约为氢气的 14 倍');
      stackBtn.hidden = true;
      tb.append(concl('标准状况下：氢气约 <b>0.09 g/L</b>，空气约 <b>1.29 g/L</b>——空气的密度约为氢气的 <b>14 倍</b>。'));
      await api.say([
        { mood: 'curious', text: '叠了 14 块才差不多一样高！空气的密度约为氢气的 <b>14 倍</b>。' },
        { mood: 'happy', text: '所以氢气球能飞那么快。可是……我想到一个问题。' },
      ]);

      // why party balloons use helium
      setScene('为什么现在的气球多充氦气？', svgBox(airshipSVG()),
        h('div', { class: 'caps' }, h('span', { html: '彩色气球：充<b class="ok">氦气</b>' }), h('span', { html: '1937 年 · 兴登堡号飞艇<br><b class="bad">充的是氢气，发生起火事故</b>' })));
      tb = setTask('第 2 步 · 比一比', '氢气最轻，为什么气球却充氦气？');
      tb.append(h('p', { class: 'lead', html: '商店里会飘的彩色气球，现在大多充的是<b>氦气</b>，而不是最轻的氢气。' }));
      const q3 = h('div'); tb.append(q3);
      showTask();
      api.hint('想一想：用氢气充气球，有什么隐患？', 'serious');
      await api.choice({
        container: q3,
        q: '彩色气球多充氦气而不用氢气，主要原因是？',
        options: [
          { text: '氢气可燃，有爆炸危险', correct: true },
          { text: '氦气比氢气还要轻', why: '不对哦，氢气才是相同条件下密度最小的气体，氦气的密度比氢气大。' },
          { text: '氢气有颜色，气球不好看', why: '氢气是<b>无色</b>、无臭的气体，这不是原因。' },
        ],
        explain: '对！氢气<b>可燃</b>，与空气混合遇明火可能爆炸。为了安全，彩色气球多充氦气。',
      });
      badge('bad', '氢气可燃，有爆炸危险');
      await api.say([
        { mood: 'serious', text: '1937 年，「兴登堡号」氢气飞艇就发生过起火事故。' },
        { mood: 'serious', text: '氢气很轻，但也很“火爆”。点燃氢气的学问，我们第 5 站再细说。' },
      ]);

      /* ============ 3 · 性质分类 ============ */
      api.step(2);
      const slotsP = [0, 1, 2, 3].map(() => h('div', { class: 'dslot' }, '？'));
      const slotsC = [0, 1].map(() => h('div', { class: 'dslot' }, '？'));
      const jarBox = h('div', { class: 'djar-box' }); jarBox.innerHTML = dossierJarSVG() + `<span>氢气 ${api.chem('H2')}</span>`;
      setScene('氢气档案', h('div', { class: 'dossier' },
        h('div', { class: 'dcol phys' }, h('span', { class: 'dcol-t' }, '物理性质'), h('span', { class: 'dcol-s' }, '不需要发生化学变化就能表现出来'), slotsP),
        jarBox,
        h('div', { class: 'dcol cprop' }, h('span', { class: 'dcol-t' }, '化学性质'), h('span', { class: 'dcol-s' }, '在化学变化中才能表现出来'), slotsC)));
      tb = setTask('第 3 步 · 性质分类', '物理性质，还是化学性质？');
      tb.append(h('p', { class: 'lead', html: '判断标准：这个性质<b>需不需要发生化学变化</b>（生成新物质）才能表现出来？' }));
      const q4 = h('div'); tb.append(q4);
      showTask();
      api.hint('把每张卡片拖到「物理性质」或「化学性质」框里；也可以先点卡片，再点框。');
      const sorted = new WeakSet();
      const sp = api.sortInto({
        container: q4,
        prompt: '给氢气的性质分分类：',
        bins: [
          { id: 'phys', title: '物理性质', hint: '不需要发生化学变化就能表现出来' },
          { id: 'chem', title: '化学性质', hint: '在化学变化中才能表现出来' },
        ],
        items: [
          { text: '无色、无臭的气体', bin: 'phys', why: '颜色、气味看一看、闻一闻就知道，不需要发生化学变化——是物理性质。' },
          { text: '难溶于水', bin: 'phys', why: '溶解性不需要发生化学变化就能表现出来——是物理性质。' },
          { text: '密度比空气小', bin: 'phys', why: '气球上升时氢气并没有变成别的物质，密度是物理性质。' },
          { text: '相同条件下密度最小的气体', bin: 'phys', why: '这也是在说密度，不需要发生化学变化——是物理性质。' },
          { text: '能在空气中燃烧（可燃性）', bin: 'chem', why: '燃烧生成了新物质（水），要在化学变化中才能表现出来——是化学性质。' },
          { text: '能夺取氧化铜中的氧（还原性）', bin: 'chem', why: '要发生化学反应（生成铜和水）才能表现出来——是化学性质。' },
        ],
      });
      if (narrow()) api.timeout(() => api.scrollTo(q4), 80);   // phones: show the pool AND both boxes
      const mo = new MutationObserver(() => {
        q4.querySelectorAll('.sort-bin-list .chip').forEach(chip => {
          if (sorted.has(chip)) return;
          sorted.add(chip);
          chip.classList.remove('draggable'); // a tap on a placed card should count as a tap on its box
          const list = chip.closest('.sort-bin').dataset.bin === 'phys' ? slotsP : slotsC;
          const slot = list.find(s => !s.classList.contains('on'));
          if (slot) { slot.textContent = chip.textContent; slot.classList.add('on', 'pop-in'); }
        });
      });
      mo.observe(q4, { childList: true, subtree: true });
      try { await sp; } finally { mo.disconnect(); }
      // (a corner badge would cover the 化学性质 heading here) — mark the jar instead
      jarBox.append(h('span', { class: 'pill ok pop-in', role: 'status' }, '档案完成'));
      showScene();
      await api.say([
        { mood: 'happy', text: '颜色、气味、溶解性、密度，不用发生化学变化就能知道——都是<b>物理性质</b>。' },
        { mood: 'curious', text: '可燃性、还原性要在化学变化中才看得到。第 5、6 站我们再去研究它们！' },
      ]);

      /* ============ 4 · 收集方法 ============ */
      api.step(3);
      const SETUPS = [{ k: 'water', cap: '排水法' }, { k: 'up', cap: '向上排空气法' }, { k: 'down', cap: '向下排空气法' }];
      const setupEls = SETUPS.map(s => {
        const el = h('div', { class: 'setup', dataset: { k: s.k } });

  function Bubbles(host) {
    const list = [], pool = [];
    return {
      add(p) {
        const c = pool.pop() || document.createElementNS(NS, 'circle');

        c.setAttribute('cx', p.x.toFixed(1)); c.setAttribute('cy', p.y.toFixed(1));
        host.append(c); list.push(p);
      },
      step(dt) {
        for (let i = list.length - 1; i >= 0; i--) {
          const p = list[i];
          p.t += dt; p.y -= p.vy * dt;
          const top = typeof p.top === 'function' ? p.top(p) : p.top;
          if (p.y - p.r <= top) { p.el.remove(); pool.push(p.el); list.splice(i, 1); if (p.end) p.end(p); continue; }
          p.el.setAttribute('cx', (p.x + Math.sin(p.t * p.wf) * p.wob).toFixed(1));
          p.el.setAttribute('cy', p.y.toFixed(1));

.lv-prepare .tool { position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; min-width: 0; min-height: 78px; padding: 5px 3px 6px;
  border: 1.5px solid var(--line); border-radius: 12px; background: var(--card); box-shadow: var(--shadow-s); text-align: center; font-size: 13.5px; touch-action: none; line-height: 1.25; color: var(--ink); }

@media (max-width: 560px) {

  .lv-prepare .shelf-row { gap: 5px; grid-template-columns: 1.8em repeat(4, minmax(0, 1fr)); }
  .lv-prepare .vlist li { grid-template-columns: 3.4em 4.4em minmax(0, 1fr); gap: 6px; padding: 5px 8px; font-size: 13.5px; }
  .lv-prepare .task-title { font-size: 19px; }
  /* the 480-wide drawings shrink to ~0.7x on phones: enlarge their labels so they stay >= 11px on screen */
  .lv-prepare svg text { font-size: 17px; }
  .lv-prepare .cap-t { font-size: 20px; }
  .lv-prepare .cap-s { font-size: 16px; }
  .lv-prepare .gt { font-size: 17px; }
  .lv-prepare .gv { font-size: 26px; }
  .lv-prepare .wisp text, .lv-prepare .pour-lab, .lv-prepare .esc-lab, .lv-prepare .tipmark text, .lv-prepare .seal text,
  .lv-prepare .airlab, .lv-prepare .clab, .lv-prepare .vt { font-size: 16px; }
}
`;

  /* ---------------- level ---------------- */
  const EQ = 'Zn + H2SO4 = ZnSO4 + H2↑';
  H2.registerLevel({
    id: 'prepare',
    order: 4,
    title: '实验室制氢气',
    subtitle: '药品、装置与收集',
    card: {
      title: '实验室制取氢气',
      formula: EQ,
      points: [
        '药品：<b>锌粒 + 稀硫酸</b>（反应速率适中，便于收集）',
        '铜不与稀硫酸反应；浓硫酸、硝酸不能用来制氢气',
        '固液常温型装置，长颈漏斗下端伸入液面以下（<b>液封</b>）',
        '排水法：导管口气泡<b>连续、均匀</b>地冒出时再收集',
        '也可用向下排空气法（氢气密度比空气小）',
      ],
    },
    css: CSS + CSS2,
    async run(api) {
      const { h } = api;
      // async event handlers live outside the run() promise chain: swallow the AbortError of a left level
      const safe = fn => (...a) => { Promise.resolve().then(() => fn(...a)).catch(e => { if (!e || e.name !== 'AbortError') console.error(e); }); };
      const narrow = () => window.matchMedia && matchMedia('(max-width: 860px)').matches;

      api.steps(['选药品', '组装置', '收集', '小结']);
      api.step(0);

      /* ---- persistent frame: 实验台 + 实验记录本 ---- */
      const sceneTitle = h('span', { class: 'scene-title' });
      const wrap = h('div', { class: 'scene-wrap' });
      const ctrl = h('div', { class: 'scene-ctrl' });
      const scene = h('section', { class: 'panel scene', 'aria-label': '实验台' },
        h('div', { class: 'scene-head' }, h('span', { class: 'eyebrow' }, '实验台'), sceneTitle), wrap, ctrl);
      const taskEye = h('span', { class: 'eyebrow' });
      const taskTitle = h('h3', { class: 'task-title' });
      const taskBody = h('div', { class: 'task-body' });
      const task = h('section', { class: 'panel task', 'aria-label': '实验记录本' }, h('div', { class: 'task-head' }, taskEye, taskTitle), taskBody);
      api.stage.append(h('div', { class: 'lab' }, scene, task));

      let tick = null;
      api.raf(dt => { if (tick) tick(dt); });
      const $ = sel => wrap.querySelector(sel);
      const setScene = (title, markup) => { tick = null; sceneTitle.textContent = title; wrap.innerHTML = markup; ctrl.innerHTML = ''; };
      const setTask = (eye, title) => { taskEye.textContent = eye; taskTitle.innerHTML = title; taskBody.innerHTML = ''; return taskBody; };
      const showScene = () => { if (narrow()) api.scrollTo(scene); };
      const showTask = () => { if (narrow()) api.scrollTo(task); };
      const badge = (kind, html) => {
        let b = wrap.querySelector('.scene-badge');
        if (!b) { b = h('div', { class: 'scene-badge pill', role: 'status' }); wrap.append(b); }
        if (!html) { b.hidden = true; return; }
        b.hidden = false; b.className = 'scene-badge pill pop-in' + (kind ? ' ' + kind : ''); b.innerHTML = html;
      };
      const obsBox = () => {
        const el = h('div', { class: 'obs', hidden: true, role: 'status' });
        el.set = (kind, html) => { el.hidden = !html; el.className = 'obs' + (kind ? ' ' + kind : ''); el.innerHTML = html || ''; };
        return el;
      };

      /* ============ 1 · 选药品 ============ */
      setScene('反应试管：金属 + 酸', tubeSVG());
      const zone = h('div', { class: 'zone z-tube dropzone', 'aria-label': '试管：把药品放进来' }, h('span', { class: 'zl' }, '放进试管'));
      wrap.append(zone);
      const tools = {};
      const mkTool = r => {
        const el = h('div', { class: 'tool', dataset: { id: r.id }, 'aria-label': r.name },
          h('span', { class: 'ico', html: r.icon }), h('b', null, r.name), h('span', { class: 'f', html: api.chem(r.f) }));
        tools[r.id] = el; return el;
      };
      ctrl.append(h('div', { class: 'shelf' },
        h('div', { class: 'shelf-row' }, h('span', { class: 'shelf-lab' }, '金属'), METALS.map(mkTool)),
        h('div', { class: 'shelf-row' }, h('span', { class: 'shelf-lab' }, '酸'), ACIDS.map(mkTool), h('span', { class: 'shelf-note' }, '拖进试管；或先点药品，再点试管'))));

      let body = setTask('第 1 步 · 选药品', '哪一组药品最合适？');
      const vrows = {};
      const vrow = r => { const li = h('li', { class: 'unk' }, h('span', { class: 'nm' }, r.name), h('span', { class: 'pill' }, '?'), h('span', { class: 'tx' }, '还没试过')); vrows[r.id] = li; return li; };
      const cnt = h('span', { class: 'pill' }, '已评价 0 / 7');
      const lead1 = h('p', { class: 'lead', html: '实验室用<b>金属</b>和<b>酸</b>反应制取氢气。每次选<b>一种金属 + 一种酸</b>放进试管，比一比哪组最合适。' });
      const obs1 = obsBox();
      body.append(lead1,
        h('div', { class: 'rec-head' }, h('span', null, '药品评价'), cnt),
        h('div', { class: 'vgroup' }, '金属'), h('ul', { class: 'vlist' }, METALS.map(vrow)),
        h('div', { class: 'vgroup' }, '酸'), h('ul', { class: 'vlist' }, ACIDS.map(vrow)));
      // on phones the panels stack: keep the observation next to the apparatus
      (narrow() ? ctrl : body).append(obs1);
      let nDone = 0;
      const reveal = (id, auto) => {
        const li = vrows[id]; if (!li || li.dataset.done) return;
        li.dataset.done = '1'; nDone++;
        const [k, tag, tx] = VERD[id];
        li.className = 'got ' + k + (auto ? ' auto' : ' fresh');
        li.children[1].className = 'pill ' + k; li.children[1].textContent = tag;
        li.children[2].textContent = tx;
        cnt.textContent = `已评价 ${nDone} / 7`;
        if (nDone === 7) cnt.className = 'pill ok';
      };

      const b1 = Bubbles($('.bubs'));
      let prof = null;
      tick = dt => {
        if (prof && Math.random() < prof.rate * dt) {
          b1.add({ x: 152 + Math.random() * 36, y: 262 - Math.random() * 6, r: prof.r[0] + Math.random() * (prof.r[1] - prof.r[0]),
            vy: prof.vy[0] + Math.random() * (prof.vy[1] - prof.vy[0]), top: 150, wob: prof.wob });
          if (Math.random() < 0.1) api.sfx('bubble');
        }
        b1.step(dt);
      };
      const needle = $('.needle'), gv = $('.gv'), gauge = $('.gauge');
      const setGauge = (v, label) => { needle.style.transform = `translate(364px, 168px) rotate(${-90 + 180 * v}deg)`; gv.textContent = label; };
      const cur = { metal: null, acid: null };
      const render = () => {
        METALS.forEach(m => $('.m-' + m.id).classList.toggle('on', cur.metal === m.id));
        $('.liq').classList.toggle('on', !!cur.acid);
        const parts = [cur.metal && NAME[cur.metal], cur.acid && NAME[cur.acid]].filter(Boolean);
        $('.contents').textContent = parts.length ? parts.join(' + ') : '试管是空的';
        Object.keys(tools).forEach(id => tools[id].classList.toggle('inuse', id === cur.metal || id === cur.acid));
      };
      const stopReaction = () => {
        prof = null; b1.clear();
        ['.foam', '.hot', '.wisp'].forEach(s => $(s).classList.remove('on'));
        $('.ttube').classList.remove('jitter'); gauge.classList.remove('shiver');
        setGauge(0, '—'); badge();
      };
      let busy = false, found = false, resolve1 = null;
      const seen = {};
      const hint1 = () => api.hint(!cur.metal && !cur.acid
        ? '把一种<b>金属</b>和一种<b>酸</b>拖进试管（也可以先点药品、再点试管），找出最适合制氢气的一组。'
        : !cur.acid ? '再放入一种<b>酸</b>。' : !cur.metal ? '再放入一种<b>金属</b>。'
          : '这一组不够理想。把另一种金属或酸直接放进试管，换一组再试试！');
      async function react() {
        busy = true;
        const o = outcome(cur.metal, cur.acid);
        prof = o.prof;
        if (o.hot) { $('.foam').classList.add('on'); $('.hot').classList.add('on'); $('.ttube').classList.add('jitter'); gauge.classList.add('shiver'); api.sfx('fizz'); }
        if (o.hcl) $('.wisp').classList.add('on');
        setGauge(o.g, o.gl);
        obs1.set('', '仔细观察试管里的现象……');
        await api.wait(1400);
        badge(o.kind, o.badge);
        reveal(cur.metal);
        if (cur.acid === 'hcl' && !o.cu) reveal('hcl');
        if (cur.acid === 'h2so4' && cur.metal === 'zn') reveal('h2so4');
        obs1.set(o.kind, o.text);
        if (o.cu) {
          if (!seen.cu) { seen.cu = true; api.mistake('铜不与稀硫酸、稀盐酸反应：它在金属活动性顺序中排在氢后面。'); } else api.sfx('wrong');
        }
        busy = false;
        if (o.best) { found = true; api.hint('就是这一组！'); if (resolve1) resolve1(); return; }
        if (cur.metal === 'zn' && cur.acid === 'hcl') api.hint('锌 + 稀盐酸能用，但不是最好。换一种酸试试？'); else hint1();
      }
      const change = safe(async had => {
        if (had) { busy = true; stopReaction(); retrigger($('.ttube'), 'swap'); await api.wait(280); }
        render();
        zone.classList.add('used');
        if (cur.metal && cur.acid) await react(); else { busy = false; hint1(); }
      });
      const banConc = () => {
        const t = tools.conc;
        if (!t.querySelector('.tag')) t.append(h('span', { class: 'tag' }, '不能用'));
        t.classList.add('banned'); retrigger(t, 'shake'); retrigger(zone, 'shake');
        reveal('conc');
        obs1.set('bad', '<b>浓硫酸不能用！</b>浓硫酸氧化性很强，与锌反应<b>不生成氢气</b>，不能用来制取氢气。');
        if (!seen.conc) { seen.conc = true; api.mistake('浓硫酸氧化性很强，与锌反应不生成氢气，不能用！'); } else api.sfx('wrong');
      };
      const onDrop = id => {
        if (found) return false;
        if (busy) { api.toast('先观察一下现象～', 'info', 1400); return false; }
        if (id === 'conc') { banConc(); return false; }
        const key = METALS.some(m => m.id === id) ? 'metal' : 'acid';
        if (cur[key] === id) { api.toast(`试管里已经有${NAME[id]}啦`, 'info', 1400); return false; }
        api.sfx('pop');
        const had = !!(cur.metal && cur.acid);
        cur[key] = id;
        change(had);
        return false;
      };
      Object.values(tools).forEach(el => api.draggable(el, {
        zones: [zone], disabled: () => !zone.classList.contains('active') || found,

`;

  /* ---------------- level ---------------- */
  H2.registerLevel({
    id: 'purity',
    order: 5,
    title: '验纯与燃烧',
    subtitle: '可燃性与安全',
    card: {
      title: '氢气的可燃性',
      formula: '2H2 + O2 =点燃= 2H2O',
      points: [
        '纯净的氢气在空气中<b>安静地燃烧</b>，产生淡蓝色火焰，放出热量',
        '火焰上方罩一个干冷的烧杯，内壁出现<b>水雾</b> → 生成了水；反应属于<b>化合反应</b>',
        '氢气与空气混合，遇明火可能<b>爆炸</b>（氢气在空气中的体积分数约为 4.0%～74.2% 时）',
        '点燃前必须<b>验纯</b>：尖锐的爆鸣声 → 不纯；声音很小 → 较纯',
      ],
    },
    css: CSS,
    async run(api) {
      const { h } = api;
      // async event handlers live outside the run() promise chain: swallow the AbortError of a left level
      const safe = fn => (...a) => { Promise.resolve().then(() => fn(...a)).catch(e => { if (!e || e.name !== 'AbortError') console.error(e); }); };
      const narrow = () => window.matchMedia && matchMedia('(max-width: 860px)').matches;

      api.steps(['危险', '验纯', '点燃', '生成水']);
      api.step(0);

      /* ---- persistent frame: 实验台 + 实验记录本 ---- */
      const sceneTitle = h('span', { class: 'scene-title' });
      const wrap = h('div', { class: 'scene-wrap' });
      const ctrl = h('div', { class: 'scene-ctrl' });
      const scene = h('section', { class: 'panel scene', 'aria-label': '实验台' },
        h('div', { class: 'scene-head' }, h('span', { class: 'eyebrow' }, '实验台'), sceneTitle), wrap, ctrl);
      const taskEye = h('span', { class: 'eyebrow' });
      const taskTitle = h('h3', { class: 'task-title' });
      const taskBody = h('div', { class: 'task-body' });
      const task = h('section', { class: 'panel task', 'aria-label': '实验记录本' }, h('div', { class: 'task-head' }, taskEye, taskTitle), taskBody);
      api.stage.append(h('div', { class: 'lab' }, scene, task));

      const $ = sel => wrap.querySelector(sel);
      const setScene = (title, markup) => { sceneTitle.textContent = title; wrap.innerHTML = markup; ctrl.innerHTML = ''; };
      const setTask = (eye, title) => { taskEye.textContent = eye; taskTitle.innerHTML = title; taskBody.innerHTML = ''; return taskBody; };
      const showScene = () => { if (narrow()) api.scrollTo(scene); };
      const showTask = () => { if (narrow()) api.scrollTo(task); };
      const badge = (kind, html) => {
        let b = wrap.querySelector('.scene-badge');
        if (!b) { b = h('div', { class: 'scene-badge pill', role: 'status' }); wrap.append(b); }
        if (!html) { b.hidden = true; return; }
        b.hidden = false; b.className = 'scene-badge pill pop-in' + (kind ? ' ' + kind : ''); b.innerHTML = html;
      };

      /* ============ 1 · 危险：爆炸极限 ============ */
      setScene('密闭容器：氢气 + 空气的混合气', jarSVG());
      const molHost = $('.mols');
      const NS = 'http://www.w3.org/2000/svg';
      const rnd = rng(20260929);
      const mols = [];
      for (let r = 0; r < 7; r++) for (let c = 0; c < 8; c++) {
        const x = 162 + c * 19.5 + (rnd() - 0.5) * 9, y = 124 + r * 25 + (rnd() - 0.5) * 9;
        const g = document.createElementNS(NS, 'g');
        g.setAttribute('transform', `translate(${x.toFixed(1)} ${y.toFixed(1)}) rotate(${Math.round(rnd() * 180)})`);
        g.innerHTML = `<g class="mol-in" style="animation-delay:-${(rnd() * 3).toFixed(2)}s;animation-duration:${(2.4 + rnd() * 1.6).toFixed(2)}s"><circle cx="-3.8" r="5"/><circle cx="3.8" r="5"/></g>`;
        molHost.append(g); mols.push(g);
      }
      const N = mols.length;
      const hOrder = api.shuffle(mols.map((_, i) => i));        // which molecules turn into H2 first
      const airType = api.shuffle(mols.map((_, i) => (i % 5 === 4 ? 'o' : 'n'))); // air: about 1 in 5 is O2
      const paint = f => {
        const nH = Math.round((f / 100) * N);
        hOrder.forEach((mi, k) => {
          const t = k < nH ? 'h' : airType[mi];
          const g = mols[mi];
          if (g._t === t) return;
          g._t = t; g.setAttribute('class', 'mol ' + t);
          g.querySelectorAll('circle').forEach(c => c.setAttribute('r', t === 'h' ? 3.7 : 5));
        });
      };

      const readNum = h('b', null, '30');
      const read = h('div', { class: 'frac-read', 'aria-live': 'polite' }, readNum, h('small', null, '%'));
      const range = h('input', { type: 'range', class: 'frac', min: '0', max: '100', step: '1', value: '30', 'aria-label': '氢气在混合气中的体积分数（%）' });
      const minus = h('button', { class: 'btn btn-sm nudge', type: 'button', 'aria-label': '氢气减少 1%' }, '−');
      const plus = h('button', { class: 'btn btn-sm nudge', type: 'button', 'aria-label': '氢气增加 1%' }, '+');
      const fire = h('button', { class: 'btn btn-spark fire', type: 'button', html: IC.spark + '<span>点火</span>' });
      const slider = h('div', { class: 'slider' },
        h('span', { class: 'lab-t lo' }, '4.0%'), h('span', { class: 'lab-t mid' }, '爆炸极限'), h('span', { class: 'lab-t hi' }, '74.2%'),
        range,
        h('span', { class: 'lab-b l0' }, '0'), h('span', { class: 'lab-b l100' }, '100%'));
      ctrl.append(
        h('div', { class: 'ctrl-row top' }, h('div', { class: 'frac-box' }, h('span', { class: 'small muted' }, '氢气的体积分数'), read), fire),
        h('div', { class: 'ctrl-row' }, minus, slider, plus));
      const controls = [range, minus, plus, fire];
      const setEnabled = on => controls.forEach(c => (c.disabled = !on));
      const regionOf = f => (f < 4 ? 'none' : f <= 74.2 ? 'boom' : 'rich');
      const update = () => {
        const f = +range.value;
        readNum.textContent = f;
        read.classList.toggle('in-band', regionOf(f) === 'boom');
        paint(f);
      };
      range.addEventListener('input', update);
      minus.addEventListener('click', () => { range.value = Math.max(0, +range.value - 1); update(); api.sfx('click'); });
      plus.addEventListener('click', () => { range.value = Math.min(100, +range.value + 1); update(); api.sfx('click'); });
      update();
      setEnabled(false);

      let body = setTask('第 1 步 · 危险', '什么时候会爆炸？');
      const slots = [0, 1, 2].map(i => h('li', { class: 'empty' }, h('span', { class: 'dot' }), h('span', null, `第 ${i + 1} 种结果：？`)));
      const foundPill = h('span', { class: 'pill' }, '已发现 0 / 3');
      const goBtn = api.button('我发现规律了 ›', { className: 'go' });
      goBtn.hidden = true;
      // next to the slider (not in the notebook) so phone players, who see the scene panel, find it without scrolling
      ctrl.append(h('div', { class: 'btn-row' }, goBtn));
      body.append(
        h('p', { class: 'lead', html: '容器里是<b>氢气和空气</b>的混合气。改变氢气所占的<b>体积分数</b>，再用电火花点火，看看会发生什么。' }),
        h('div', { class: 'rec-head' }, h('span', null, '实验记录'), foundPill),
        h('ul', { class: 'rec' }, slots));

      await api.say([
        { mood: 'happy', text: '上一站我们制得了氢气。这一站，我要把它点燃！' },
        { mood: 'curious', text: '悄悄告诉你：氢气燃烧后，会变成一样你很熟悉的东西～' },
        { mood: 'serious', text: '不过点火之前，得先弄清楚：氢气什么时候会有危险？' },
      ]);

      const found = new Map();
      const RES = {
        none: f => `氢气 <b>${f}%</b>：<b>不燃烧</b>——氢气太少，点不着`,
        boom: f => `氢气 <b>${f}%</b>：<b>发生爆炸</b>——混合气在密闭容器里急剧燃烧`,
        rich: f => `氢气 <b>${f}%</b>：<b>瓶内不爆炸</b>——氧气太少；在瓶口点火，氢气只能在瓶口与空气接触的地方燃烧`,
      };
      const hintExplore = () => api.hint(found.size >= 2
        ? (found.size === 3 ? '三种结果都找到啦！点「我发现规律了」。' : '已经发现两种结果了。可以再试试，弄明白了就点「我发现规律了」。')
        : '拖动滑块（或按 −／+）改变氢气的体积分数，再按「点火」。至少试出<b>两种</b>不同的结果。');
      let sameTries = 0;
      async function ignite(region) {
        badge();
        retrigger($('.spark'), 'on'); api.sfx('zap');
        await api.wait(280);
        if (region === 'boom') {
          retrigger($('.flash'), 'on'); retrigger($('.boom'), 'on'); retrigger($('.jar'), 'jolt');
          $('.lid').classList.add('fly'); api.sfx('boom');
          badge('bad', '砰——爆炸！');
          await api.wait(1500);
          $('.lid').classList.remove('fly');
          await api.wait(550);
        } else if (region === 'none') {
          badge('', '没有燃烧');
          await api.wait(1000);
        } else {
          badge('', '瓶内不爆炸：氧气太少');
          await api.wait(1000);
          // the mixture itself can't burn; only where it meets air, lit at the mouth
          $('.lid').classList.add('open'); api.sfx('whoosh');
          badge('', '打开瓶盖，在瓶口点火……');
          await api.wait(500);
          retrigger($('.mspark'), 'on'); api.sfx('zap');
          await api.wait(260);
          $('.mouth-flame').classList.add('on'); api.sfx('flame');
          badge('warn', '只在瓶口与空气接触处燃烧');
          await api.wait(2100);
          $('.mouth-flame').classList.remove('on'); $('.lid').classList.remove('open');
          badge('', '瓶内不爆炸：氧气太少');
          await api.wait(500);
        }
      }
      await api.task(resolve => {
        let busy = false;
        fire.addEventListener('click', safe(async () => {
          if (busy) return;
          busy = true; setEnabled(false);
          const f = +range.value, region = regionOf(f);
          await ignite(region);
          if (!found.has(region)) {
            const slot = slots[found.size];
            found.set(region, f);
            slot.className = 'got fresh r-' + region;   // r- prefix: a bare "boom" class would pick up the SVG .boom styles (opacity 0)
            slot.innerHTML = `<span class="dot"></span><span>${RES[region](f)}</span>`;
            foundPill.textContent = `已发现 ${found.size} / 3`;
            if (found.size === 3) foundPill.className = 'pill ok';
            sameTries = 0;
          } else if (++sameTries >= 2 && found.size < 2) {
            api.toast('还是同一种结果～把体积分数调得<b>差别大一点</b>再试试！', 'info');
            sameTries = 0;
          }
          if (found.size >= 2) goBtn.hidden = false;
          hintExplore();
          busy = false; setEnabled(true);
        }));
        goBtn.addEventListener('click', () => { if (!busy) { setEnabled(false); goBtn.parentNode.hidden = true; resolve(); } });
        setEnabled(true);
        hintExplore();
      });
      badge();

      await api.say([
        { mood: 'serious', text: '发现了吗？氢气在空气中的体积分数约为 <b>4.0%～74.2%</b> 时，遇明火可能发生爆炸。' },
        { mood: 'serious', text: '收集的氢气里如果混有空气，就可能落进这个范围。所以——<b>点燃氢气前一定要验纯！</b>' },
      ]);
      body = setTask('第 1 步 · 危险', '为什么要验纯？');
      body.append(h('div', { class: 'concl', html: '<b>爆炸极限</b>：氢气在空气中的体积分数约为 <b>4.0%～74.2%</b> 时，遇明火可能发生爆炸。' }));
      api.hint('选一选：为什么点燃氢气前一定要检验纯度？');
      showTask();
      await api.choice({
        container: body,
        q: '为什么点燃氢气前，一定要检验它的纯度？',
        options: [
          { text: '氢气中混有空气时，点燃可能发生爆炸', correct: true },
          { text: '纯净的氢气一点燃就会爆炸', why: '不对哦：纯净的氢气能在空气中<b>安静地燃烧</b>，危险的是氢气和空气的<b>混合气</b>。' },
          { text: '为了检验氢气有没有毒', why: '验纯检验的是氢气里<b>有没有混入空气</b>，和有没有毒无关。' },
        ],
        explain: '对！点燃氢气（以及任何可燃性气体）之前，都要先检验纯度。',
      });

      /* ============ 2 · 验纯 ============ */
      api.step(1);
      setScene('验纯：收集一试管氢气，点火听声音', tubeSVG());
      showScene();
      const tube = $('.tube'), tw = $('.tw'), bub = $('.bub'), thumb = $('.thumb');
      const POS_A = 'translate(124px, 262px)';
      const POS_B = 'translate(388px, 200px) rotate(-20deg)';
      const setWater = (frac, instant) => { tw.classList.toggle('snap', !!instant); tw.style.transform = `scaleY(${frac})`; if (instant) void tw.getBoundingClientRect(); };
      setWater(1, true);

      body = setTask('第 2 步 · 验纯', '怎样检验氢气的纯度？');
      await api.say([
        { mood: 'happy', text: '验纯只需要一支试管和一盏酒精灯。' },
        { mood: 'happy', text: '先把验纯的操作步骤排排队吧！' },
      ]);
      api.hint('把验纯的步骤排好顺序：用 ▲▼ 调整，或把一步拖到另一步上交换位置。');
      showTask();
      const ordered = api.orderSteps({
        container: body,
        prompt: '验纯的正确操作顺序是：',
        steps: ['用排水法收集一试管氢气', '用拇指堵住试管口', '管口向下，移近火焰', '移开拇指点火', '听声音，判断氢气是否纯净'],
        explain: '顺序正确！管口向下，是因为氢气密度比空气小，这样不容易逸出。',
        hint: '想一想：先收集，再堵住管口移近火焰，最后才移开拇指点火。',
      });
      // phones: bring the whole list and its 「检查顺序」 button into view (showTask only reaches the task header)
      const orderBox = body.querySelector('.orderer');
      if (narrow() && orderBox) api.timeout(() => api.scrollTo(orderBox), 80);
      // keyboard: Enter on a step's text while another step is selected swaps them (engine drop) and would then
      // also re-select the removed text, leaving every row highlighted and the next Enter swapping at random
      const ordList = orderBox && orderBox.querySelector('.order-list');
      if (ordList) ordList.addEventListener('keydown', e => { if (e.defaultPrevented && (e.key === 'Enter' || e.key === ' ')) e.stopPropagation(); }, true);
      await ordered;
      await api.wait(500);

      // the mini-game
      body = setTask('第 2 步 · 验纯', '点火检验，听声音判断');
      const histList = h('ul', { class: 'rec' });
      const histEmpty = h('li', { class: 'empty' }, h('span', { class: 't-ico' }), h('span', null, '还没有检验记录'));
      histList.append(histEmpty);
      body.append(
        h('p', { class: 'lead', html: '每收集一试管，就点火<b>听声音</b>：氢气纯不纯？不纯的话，下一步该怎么做？' }),
        h('div', { class: 'rec-head' }, h('span', null, '检验记录')),
        histList);
      const PROC = ['① 收集', '② 拇指堵住管口', '③ 管口向下移近火焰', '④ 移开拇指点火', '⑤ 听声音'];
      const procEls = PROC.map(t => h('li', null, t));
      const acts = h('div', { class: 'acts' });
      const fb = h('div', { class: 'choice-feedback', hidden: true, role: 'status' });
      ctrl.append(h('ol', { class: 'proc', 'aria-label': '验纯步骤' }, procEls), acts, fb);
      const proc = i => procEls.forEach((el, k) => { el.className = k < i ? 'done' : k === i ? 'now' : ''; });
      const say = (kind, html) => { fb.hidden = !html; fb.className = 'choice-feedback' + (kind ? ' ' + kind : ''); fb.innerHTML = html || ''; };

      await api.say({ mood: 'curious', text: '现在动手！每收集一试管，就点火听一听。' });
      showScene();

      const override = window.__purityImpure;
      const nImpure = Number.isInteger(override) && override >= 1 && override <= 3 ? override : 2 + (Math.random() < 0.5 ? 1 : 0);
      const seq = Array.from({ length: nImpure }, () => false).concat([true]);

      async function collect() {
        acts.innerHTML = ''; say();
        proc(0);
        tube.classList.add('snap', 'gone'); tube.classList.remove('at-b');
        thumb.classList.remove('on', 'off');
        tube.style.transform = POS_A; setWater(1, true);
        void tube.getBoundingClientRect();
        tube.classList.remove('snap', 'gone');
        await api.wait(350);
        bub.classList.add('on');
        const stopBubbles = api.interval(() => api.sfx('bubble'), 320);
        setWater(0);
        await api.wait(1800);
        stopBubbles(); bub.classList.remove('on');
        proc(1); thumb.classList.add('on');
        await api.wait(700);
        proc(2); tube.classList.add('at-b'); tube.style.transform = POS_B;
        await api.wait(1000);
      }
      async function testFire(pure) {
        proc(3); thumb.classList.add('off');
        await api.wait(300);
        proc(4);
        if (pure) { api.sfx('puff'); retrigger($('.fx-soft'), 'on'); retrigger($('.cap.soft'), 'on'); }
        else { api.sfx('squeal'); retrigger($('.fx-loud'), 'on'); retrigger($('.cap.loud'), 'on'); retrigger(tube, 'jolt'); }
        await api.wait(1100);
        proc(5);
      }
      // two-or-more button question inside the scene controls; wrong answers are disabled with a reason
      const ask = (q, options) => api.task(resolve => {
        acts.innerHTML = '';
        if (q) acts.append(h('span', { class: 'q' }, q));
        options.forEach(o => {
          const b = h('button', { class: 'btn' + (o.primary ? ' btn-primary' : ''), type: 'button', html: o.html });
          b.addEventListener('click', () => {
            if (b.disabled) return;
            if (o.correct) { acts.querySelectorAll('button').forEach(x => (x.disabled = true)); resolve(); return; }
            b.disabled = true; b.classList.add('wrong');
            api.mistake(o.toast || null);
            say('bad', o.why);
          });
          acts.append(b);
        });
      });
      const addHist = (i, pure) => {
        histEmpty.remove();
        histList.append(h('li', { class: 'fresh ' + (pure ? 'ok' : 'bad') }, h('span', { class: 't-ico' }),
          h('span', { html: pure ? `第 ${i + 1} 管：声音很小 → <b>氢气较纯</b>` : `第 ${i + 1} 管：尖锐的爆鸣声 → <b>氢气不纯</b>` })));
      };

      for (let i = 0; i < seq.length; i++) {
        const pure = seq[i];
        api.hint(i === 0 ? '看：用排水法收集一试管气体……' : '重新收集一试管……');
        await collect();
        api.hint('按「点火检验」：移开拇指点火，仔细<b>听声音</b>。');
        await ask(null, [{ html: IC.spark + ' 点火检验', primary: true, correct: true }]);
        acts.innerHTML = '';
        await testFire(pure);
        api.hint('刚才的声音说明这管氢气纯不纯？');
        await ask('这管氢气：', [
          { html: '氢气不纯', correct: !pure, why: '声音<b>很小</b>，说明氢气已经较纯了；尖锐的爆鸣声才表示不纯。', toast: '声音很小 → 氢气较纯' },
          { html: '氢气较纯', correct: pure, why: '尖锐的爆鸣声说明氢气<b>不纯</b>，里面混有空气，这时点燃可能爆炸！', toast: '尖锐的爆鸣声 → 氢气不纯' },
        ]);
        addHist(i, pure);
        if (pure) {
          api.good('声音很小 → 氢气较纯！');
          say('good', '声音很小，说明收集到的氢气已经<b>较纯</b>，这时才可以点燃。');
          break;
        }
        api.good();
        say('good', i === 0
          ? '对！尖锐的爆鸣声说明氢气<b>不纯</b>——刚开始收集的气体里混有装置里原有的空气。'
          : '还是尖锐的爆鸣声，氢气<b>仍不纯</b>。');
        api.hint('氢气不纯，下一步该怎么做？');
        await ask('下一步：', [
          { html: '重新收集，再检验', correct: true },
          { html: '直接点燃氢气', why: '不纯的氢气点燃<b>可能爆炸</b>！要重新收集、再次检验，直到声音很小为止。', toast: '不纯的氢气不能点燃！' },
        ]);
      }
      api.hint('验纯通过！点「去点燃」。');
      await ask(null, [{ html: '验纯通过，去点燃 ›', primary: true, correct: true }]);

      /* ============ 3 · 点燃 ============ */
      api.step(2);
      setScene('点燃纯净的氢气', burnSVG());
      showScene();
      const zNozzle = h('div', { class: 'zone z-nozzle dropzone', 'aria-label': '尖嘴导管口' }, '管口');
      const zBeaker = h('div', { class: 'zone z-beaker dropzone', 'aria-label': '火焰上方' }, '罩在火焰上方');
      wrap.append(zNozzle, zBeaker);
      const tray = h('div', { class: 'tray' });
      const fb3 = h('div', { class: 'choice-feedback', hidden: true, role: 'status' });
      const trayNote = h('div', { class: 'tray-note' }, '拖到装置上；也可以先点工具，再点目标位置。');
      ctrl.append(tray, trayNote, fb3);
      const fbSet = (kind, html) => { fb3.hidden = !html; fb3.className = 'choice-feedback' + (kind ? ' ' + kind : ''); fb3.innerHTML = html || ''; };

      body = setTask('第 3 步 · 点燃', '氢气燃烧的现象');
      const OBS = [['火焰', '淡蓝色火焰，安静地燃烧'], ['烧杯内壁', '出现水雾（小水珠）'], ['烧杯外壁', '发热（放出热量）']];
      const obsEls = OBS.map(([k]) => h('li', { class: 'empty' }, h('span', { class: 'k' }, k), h('span', null, '？')));
      body.append(
        h('p', { class: 'lead', html: '验纯通过的氢气从<b>尖嘴导管</b>口放出。点燃它，把看到的现象记下来。' }),
        h('div', { class: 'rec-head' }, h('span', null, '现象记录')),
        h('ul', { class: 'rec obs' }, obsEls));
      const obs = i => { const li = obsEls[i]; li.className = 'got fresh'; li.lastChild.innerHTML = `<b>${OBS[i][1]}</b>`; };

      await api.say([
        { mood: 'happy', text: '声音很小，氢气够纯了。现在让它从尖嘴导管口出来——' },
        { mood: 'happy', text: '用燃着的木条把它点燃！' },
      ]);
      const splint = h('div', { class: 'tool splint', html: IC.splint + '<span>燃着的木条</span>' });
      tray.append(splint);
      zNozzle.classList.add('active');
      api.hint('把「燃着的木条」拖到<b>尖嘴导管口</b>；也可以先点木条、再点管口。');
      await api.task(resolve => api.draggable(splint, {
        zones: [zNozzle],
        onDrop: () => {
          splint.classList.add('used', 'locked'); splint.removeAttribute('tabindex');
          splint.querySelector('span').textContent = '已点燃';
          zNozzle.classList.remove('active');
          resolve();
          return true;
        },
      }));
      retrigger($('.splint-anim'), 'on');
      await api.wait(650);
      $('.h2flame').classList.add('on'); api.sfx('flame');
      await api.wait(700);
      obs(0);
      await api.say([
        { mood: 'curious', text: '看！<b>淡蓝色</b>的火焰，安安静静地燃烧。' },
        { mood: 'happy', text: '它燃烧后生成了什么？选一个烧杯罩在火焰上方，找证据！' },
      ]);

      tray.innerHTML = '';
      const BEAKERS = [
        { key: 'dry', icon: IC.beakerDry, label: '干冷的烧杯', ok: true },
        { key: 'lime', icon: IC.beakerLime, label: '内壁沾有澄清石灰水的烧杯', why: '内壁沾有澄清石灰水的烧杯是用来检验<b>二氧化碳</b>的，氢气燃烧不生成二氧化碳。' },
        { key: 'hot', icon: IC.beakerHot, label: '热烧杯', why: '热烧杯上，水蒸气不容易凝结，<b>看不到水雾</b>。要用干冷的烧杯。' },
      ];
      zBeaker.classList.add('active');
      api.hint('选一个烧杯，拖到<b>火焰上方</b>罩住火焰（也可以先点烧杯、再点火焰上方）。');
      await api.task(resolve => {
        api.shuffle(BEAKERS).forEach(b => {
          const el = h('div', { class: 'tool beaker-' + b.key, html: b.icon + `<span>${b.label}</span>` });
          tray.append(el);
          api.draggable(el, {
            zones: [zBeaker],
            onDrop: z => {
              if (b.ok) {
                el.classList.add('used', 'locked'); el.removeAttribute('tabindex');
                tray.querySelectorAll('.tool').forEach(t => { if (t !== el) { t.classList.add('locked'); t.removeAttribute('tabindex'); t.style.opacity = '.45'; } });
                zBeaker.classList.remove('active');
                fbSet('good', '对！用<b>干冷</b>的烧杯，水蒸气遇冷才会凝结成小水珠。');
                api.good();
                resolve();
                return true;
              }
              api.mistake(b.key === 'lime' ? '那是检验二氧化碳用的哦' : '热烧杯上看不到水雾');
              fbSet('bad', b.why);

      await api.say({ mood: 'curious', text: '对！阳光和风变成电，电再把水分解成氢气和氧气——这样制得的就是“绿氢”。' });

    const out = [];
    const extra = shuffle([1, 2, 3, 4, 5, 6, 7]).slice(0, 3);
    for (let lv = 1; lv <= 7; lv++) {
      const pool = shuffle(by[lv]);
      out.push(pool[0]);
      if (extra.indexOf(lv) >= 0) out.push(pool[1]);
    }
    return out;

  // smooth curve through points (Catmull-Rom → cubic Bézier)
  function smooth(pts) {
    let d = `M${pts[0][0]},${pts[0][1]}`;
    for (let i = 0; i < pts.length - 1; i++) {
      const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += ` C${c1[0].toFixed(1)},${c1[1].toFixed(1)} ${c2[0].toFixed(1)},${c2[1].toFixed(1)} ${p2[0]},${p2[1]}`;
    }
    return d;
