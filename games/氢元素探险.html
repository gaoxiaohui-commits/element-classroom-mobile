@keyframes fin-swap { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes fin-pop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes fin-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
@keyframes fin-march { to { stroke-dashoffset: -22; } }
@keyframes fin-dash { to { stroke-dashoffset: -14; } }
@keyframes fin-spin { to { transform: rotate(360deg); } }
@keyframes fin-glow { 0%, 100% { transform: scale(1); opacity: .9; } 50% { transform: scale(1.15); opacity: .5; } }
@keyframes fin-grow { from { transform: scaleY(0); } to { transform: scaleY(1); } }
@keyframes fin-flick { 0%, 100% { transform: scale(1, 1) skewX(0deg); } 25% { transform: scale(.95, 1.06) skewX(-2deg); } 50% { transform: scale(1.04, .95) skewX(1.5deg); } 75% { transform: scale(.98, 1.03) skewX(-1deg); } }
@keyframes fin-rise-s { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: .9; } 100% { transform: translateY(-34px); opacity: 0; } }
@keyframes fin-rise-m { 0% { transform: translateY(0); opacity: 0; } 15% { opacity: 1; } 85% { opacity: .9; } 100% { transform: translateY(-56px); opacity: 0; } }
@keyframes fin-heat { 0%, 100% { transform: translateY(0); opacity: .9; } 50% { transform: translateY(-6px); opacity: .45; } }
@keyframes fin-wave { to { transform: translateX(-40px); } }
@keyframes fin-twinkle { 0%, 100% { transform: scale(.6); opacity: .4; } 50% { transform: scale(1.1); opacity: 1; } }
@keyframes fin-stamp { 0% { transform: scale(1.9) rotate(-2deg); opacity: 0; } 60% { transform: scale(.94) rotate(-12deg); opacity: 1; } 100% { transform: scale(1) rotate(-12deg); opacity: .92; } }

@media (max-width: 860px) { .lv-final .scene-wrap { max-width: 380px; } }
@media (hover: none) and (pointer: coarse) { .lv-final .kbd-note.keys { display: none; } }
@media (max-width: 560px) {
  .lv-final .scene, .lv-final .task { padding: 12px; }
  .lv-final .scene-wrap { max-width: 300px; }
  .lv-final .scene-title { font-size: 16px; }
  .lv-final .task-title { font-size: 19px; }
  .lv-final .q-text { font-size: 16px; }
  .lv-final .opt { min-height: 44px; padding: 8px 10px; }
  .lv-final .td { width: 24px; height: 29px; }
  .lv-final .cert { padding: 24px 16px 20px; }
  .lv-final .cert-title { font-size: 31px; }
  .lv-final #cert-name { font-size: 20px; }
  .lv-final .cert-headimg { width: 80px; }
  .lv-final .seal-zone, .lv-final .seal-zone .stamped-seal { width: 76px; height: 76px; }
  .lv-final .score-big { font-size: 38px; }
  .lv-final .lbl { font-size: 16.5px; }
  .lv-final .lbl.sm, .lv-final .st-l { font-size: 15px; }
  .lv-final .lbl.xs { font-size: 12.5px; }
}
`;

  const SCENES = { 1: sceneElectro, 2: sceneAtom, 3: sceneLight, 4: scenePrep, 5: sceneBurn, 6: sceneReduce, 7: sceneEnergy };
  const SCENE_SFX = { 1: 'bubble', 2: 'sparkle', 3: 'whoosh', 4: 'bubble', 5: 'flame', 6: 'fizz', 7: 'whoosh' };
  const PRAISE = ['答对啦！', '完全正确！', '漂亮！', '对！记得真牢～', '厉害，一点都没忘！'];
  const TOTAL = 10;

  /* ---------------- level ---------------- */
  H2.registerLevel({
    id: 'final',
    order: 8,
    title: '终极挑战',
    subtitle: '氢元素知识大闯关',
    card: {
      title: '通关证书',
      points: [
        '<b>水的组成</b>：电解水「正氧负氢，氢二氧一」，水由氢元素和氧元素组成',
        '<b>氢原子</b>：1 个质子、1 个电子，最常见的氢原子没有中子',
        '<b>物理性质与制取</b>：无色、无臭、难溶于水，相同条件下密度最小；锌粒 + 稀硫酸制取，用排水法或向下排空气法收集',
        '<b>验纯、燃烧与还原性</b>：点燃前必须验纯；纯净的氢气燃烧产生淡蓝色火焰，只生成水；能夺取氧化铜中的氧（还原性）',
        '<b>氢能</b>：热值高、产物只有水；难题是制取成本高、贮存和运输困难',
      ],
    },
    css: CSS,
    async run(api) {
      const { h } = api;
      const reveal = (el, block) => { if (el && el.isConnected) el.scrollIntoView({ block: block || 'nearest', behavior: api.reducedMotion ? 'auto' : 'smooth' }); };
      const starsHtml = n => [0, 1, 2].map(k => api.ICON.star(k < n)).join('');
      const toTop = () => { const scr = api.stage.closest('#screen'); if (scr) scr.scrollTop = 0; };

      api.steps(['出发', '闯关', '成绩', '证书']);
      api.step(0);

      /* ---- persistent frame: 回顾站 + 答题卡 ---- */
      const sceneEye = h('span', { class: 'eyebrow' });
      const sceneTitle = h('span', { class: 'scene-title' });
      const wrap = h('div', { class: 'scene-wrap' });
      const track = h('div', { class: 'track', 'aria-label': '答题进度' });
      const trackNote = h('div', { class: 'track-note', 'aria-live': 'polite' });
      const scene = h('section', { class: 'panel scene', 'aria-label': '回顾站' }, h('div', { class: 'scene-head' }, sceneEye, sceneTitle), wrap, track, trackNote);
      const taskEye = h('span', { class: 'eyebrow' });
      const taskTitle = h('h3', { class: 'task-title' });
      const taskBody = h('div', { class: 'task-body' });
      const task = h('section', { class: 'panel task', 'aria-label': '答题卡' }, h('div', { class: 'task-head' }, taskEye, taskTitle), taskBody);
      const lab = h('div', { class: 'lab' }, scene, task);
      api.stage.append(lab);

      const setScene = (eye, title, markup) => {
        sceneEye.textContent = eye; sceneTitle.textContent = title; wrap.innerHTML = markup;
        // SVG (SMIL) motion ignores the global reduced-motion CSS: freeze it by hand
        if (api.reducedMotion) {
          Array.prototype.forEach.call(wrap.querySelectorAll('animateMotion, animateTransform'), a => {
            const p = a.parentNode; const still = p && p.getAttribute('data-still');
            if (still) p.setAttribute('transform', still);
            a.remove();
          });
        }
        return wrap.firstElementChild;
      };
      const setTask = (eye, title) => {
        taskEye.textContent = eye; taskTitle.innerHTML = title; taskBody.innerHTML = '';
        taskBody.classList.remove('swap'); void taskBody.offsetWidth; taskBody.classList.add('swap');
        return taskBody;
      };
      const tds = [];
      for (let i = 0; i < TOTAL; i++) { const d = h('span', { class: 'td', html: dropSvg('') + `<b>${i + 1}</b>` }); tds.push(d); track.append(d); }
      const setTrack = (i, st) => {
        tds[i].classList.remove('now', 'ok', 'no'); if (st) tds[i].classList.add(st);
        tds[i].setAttribute('aria-label', `第 ${i + 1} 题：${st === 'ok' ? '答对' : st === 'no' ? '答错' : '正在作答'}`);
      };
      track.hidden = true; trackNote.hidden = true;

      // keyboard shortcuts for the current question: A–D / 1–4 pick, Enter confirms
      let keyTarget = null;
      api.on(document, 'keydown', e => {
        if (!keyTarget || e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.target && e.target.closest && e.target.closest('input, textarea, select')) return;
        const k = (e.key || '').toLowerCase();
        let idx = 'abcd'.indexOf(k); if (idx < 0) idx = '1234'.indexOf(k);
        if (k.length === 1 && idx >= 0 && keyTarget.btns[idx]) { e.preventDefault(); keyTarget.pick(keyTarget.btns[idx], true); keyTarget.btns[idx].focus({ preventScroll: true }); return; }
        if (e.key !== 'Enter' || e.repeat) return;
        // Enter confirms — also when focus sits on an option that is already picked (after pressing A–D);
        // on an unpicked option or any other button, Enter keeps its normal meaning (pick / press it).
        const onBtn = e.target && e.target.closest && e.target.closest('button');
        const onPicked = onBtn && onBtn.classList.contains('opt') && onBtn.classList.contains('picked');
        if (onBtn && !onPicked) return;
        e.preventDefault();
        if (!keyTarget.confirm.disabled) keyTarget.confirm.click();
      });

      /* ============ 出发 ============ */
      setScene('第 8 站 · 终点', '探险地图', introSVG(H2.assets.head_happy || ''));
      let body = setTask('终点站 · 第 8 站', '氢元素知识大闯关');
      const rule = (n, html) => h('li', null, h('span', { class: 'n' }, n), h('span', { html }));
      const startBtn = api.button(IC.flag + '<span>开始闯关</span>', { className: 'btn-lg start' });
      startBtn.disabled = true;
      body.append(
        h('p', { class: 'lead', html: '从<b>拆开小水滴</b>一路走到<b>氢能未来</b>，现在来检验你的收获！' }),
        h('ul', { class: 'rules' },
          rule(1, '共 <b>10 道题</b>，七个站每站至少 1 题，每次随机抽题'),
          rule(2, '每题<b>只有一次机会</b>：选好后点「确定」，马上看到对错和解析'),
          rule(3, '答对 <b>9 题及以上</b>获得「氢元素小博士」证书，其他获得「氢元素探险家」证书')),
        h('div', { class: 'q-acts' }, startBtn));
      await api.say([
        { mood: 'happy', text: '这里就是最后一站——终极挑战！' },
        { mood: 'happy', text: '拆开水滴、拼出氢原子、点燃氢气、展望氢能……一路的知识都在这儿啦。' },
        { mood: 'curious', text: '10 道题，每题只有一次机会。答完就能领证书哦～' },
      ]);
      startBtn.disabled = false;
      api.hint('准备好了就点「开始闯关」！');
      startBtn.focus({ preventScroll: true });
      reveal(startBtn); // on phones the button sits below the map
      await api.waitClick(startBtn);
      api.sfx('whoosh');

      /* ---- one question: own quiz UI, ONE attempt ---- */
      let right = 0;
      const updNote = n => { trackNote.innerHTML = `已答 ${n} / ${TOTAL} 题 · 答对 <b>${right}</b> 题`; };
      const ask = (q, i, svgEl) => {
        const multi = !!q.m;
        const st = STATIONS[q.lv];
        const b = setTask(`第 ${q.lv} 站 · ${st.tag} · ${multi ? '多选题' : '单选题'}`, `第 ${i + 1} / ${TOTAL} 题`);
        const opts = api.shuffle(q.o.map(([text, c]) => ({ text, c: !!c })));
        const btns = opts.map((o, k) => {
          const btn = h('button', { class: 'opt' + (multi ? ' is-multi' : ''), type: 'button', 'aria-pressed': 'false' },
            h('span', { class: 'k' }, 'ABCD'[k]), h('span', { class: 't', html: o.text }), h('span', { class: 'mark' }));
          btn._ok = o.c; btn._text = o.text;
          return btn;
        });
        const confirm = api.button('确定');
        confirm.disabled = true;
        const acts = h('div', { class: 'q-acts' }, confirm, h('span', { class: multi ? 'kbd-note' : 'kbd-note keys' }, multi ? '可以选多个，再点一次取消' : '键盘也行：A–D 选择，Enter 确定'));
        const fb = h('div', { class: 'q-fb', hidden: true, 'aria-live': 'polite' });
        b.append(...[
          multi ? h('div', { class: 'q-meta' }, h('span', { class: 'pill warn' }, '多选：正确答案不止一个')) : null,
          h('div', { class: 'q-text', html: q.q }),
          h('div', { class: 'opts', role: 'group', 'aria-label': '选项' }, btns),
          fb, acts].filter(Boolean));
        reveal(taskTitle);
        api.hint(multi ? '多选题：把<b>所有</b>正确的选项都选上，再点「确定」。' : '选出你认为正确的答案，再点「确定」。每题只有一次机会哦～');
        // a double tap on 「下一题」 must not pre-select an answer on the new question
        const born = Date.now();
        const pick = (btn, byKey) => {
          if (btn.disabled || (!byKey && Date.now() - born < 350)) return;
          if (multi) btn.classList.toggle('picked');
          else btns.forEach(x => x.classList.toggle('picked', x === btn));
          btns.forEach(x => x.setAttribute('aria-pressed', x.classList.contains('picked') ? 'true' : 'false'));
          confirm.disabled = !btns.some(x => x.classList.contains('picked'));
          api.sfx('click');
        };
        btns.forEach(x => x.addEventListener('click', () => pick(x)));
        return api.task(resolve => {
          keyTarget = { btns, pick, confirm };
          confirm.addEventListener('click', () => {
            if (confirm.disabled || !keyTarget) return;
            keyTarget = null;
            const ok = btns.every(x => x.classList.contains('picked') === x._ok);
            btns.forEach(x => {
              const was = x.classList.contains('picked');
              x.disabled = true; x.classList.remove('picked'); x.removeAttribute('aria-pressed');
              const mark = x.querySelector('.mark');
              if (x._ok) { x.classList.add('right'); if (!was) x.classList.add('missed'); mark.innerHTML = IC.check + (was ? '' : multi ? '漏选' : '正确答案'); }
              else if (was) { x.classList.add('wrong'); mark.innerHTML = IC.cross + (multi ? '不该选' : '你的选择'); }
              else x.classList.add('dim');
            });
            const keys = btns.filter(x => x._ok).map(x => x.querySelector('.k').textContent).join('、');
            const praise = PRAISE[(i + right) % PRAISE.length];
            fb.hidden = false;
            fb.className = 'q-fb ' + (ok ? 'good' : 'bad');
            fb.innerHTML = `<div class="fb-h">${ok ? IC.check + praise : IC.cross + '答错了，正确答案是 ' + keys}</div><div>${q.ex}</div>`;
            svgEl.classList.add('on');
            api.timeout(() => api.sfx(SCENE_SFX[q.lv]), 450);
            setTrack(i, ok ? 'ok' : 'no');
            const last = i === TOTAL - 1;
            const next = api.button(last ? '查看成绩 ›' : '下一题 ›');
            acts.innerHTML = ''; acts.append(next);
            const tail = last ? '点「查看成绩」看看你的成绩！' : i === 4 ? '已经过半啦，点「下一题」继续！' : '点「下一题」继续。';
            if (ok) { right++; api.good(); api.hint(praise + tail, 'happy'); }
            else { api.mistake(); api.hint('没关系～读一读解析，把它记住。' + tail, 'serious'); }
            updNote(i + 1);
            next.focus({ preventScroll: true });
            api.timeout(() => reveal(next), 60);
            // a double tap / double Enter on 「确定」 must not skip the explanation: ignore 「下一题」 for a moment
            const shownAt = Date.now();
            const onNext = () => {
              if (Date.now() - shownAt < 450) return;
              next.removeEventListener('click', onNext);
              resolve({ ok, correct: btns.filter(x => x._ok).map(x => x._text) });
            };
            next.addEventListener('click', onNext);
          });
        });
      };

      /* ============ 闯关 ============ */
      api.step(1);
      const qs = pickQuestions(makeBank(api.chem), api.shuffle);
      const results = [];
      track.hidden = false; trackNote.hidden = false;
      updNote(0);
      for (let i = 0; i < qs.length; i++) {
        const q = qs[i];
        const svgEl = setScene(`回顾站 · 第 ${q.lv} 站`, STATIONS[q.lv].name, SCENES[q.lv]());
        setTrack(i, 'now');
        const r = await ask(q, i, svgEl);
        results.push({ q, ok: r.ok, correct: r.correct, i });
      }
      keyTarget = null;

      /* ============ 成绩 ============ */
      api.step(2);
      const n = right;
      const stars = n >= 9 ? 3 : n >= 7 ? 2 : 1;
      const rank = n >= 9 ? '氢元素小博士' : '氢元素探险家';
      const svgS = setScene('成绩', '氢氢的大水滴', sceneScore(n));
      const lvl = svgS.querySelector('.lvl');
      lvl.style.transform = 'translateY(262px)';
      api.timeout(() => { lvl.style.transform = `translateY(${(241.6 - 190 * n / 10).toFixed(1)}px)`; api.sfx('bubble'); }, 160);
      trackNote.innerHTML = `10 题全部答完 · 答对 <b>${n}</b> 题`;
      body = setTask('成绩单', '闯关完成！');
      const bySt = h('ul', { class: 'by-st' });
      for (let lv = 1; lv <= 7; lv++) {
        const mine = results.filter(r => r.q.lv === lv);
        bySt.append(h('li', null, h('span', null, `${lv} · ${STATIONS[lv].tag}`),
          h('span', { class: 'dots', 'aria-label': `答对 ${mine.filter(r => r.ok).length} / ${mine.length}` }, mine.map(r => h('span', { class: 'dot ' + (r.ok ? 'ok' : 'no') })))));
      }
      const wrongs = results.filter(r => !r.ok);
      const review = wrongs.length
        ? h('ul', { class: 'review' }, wrongs.map(r => h('li', null,
          h('span', { class: 'rq', html: `第 ${r.i + 1} 题 · ${r.q.q}` }),
          h('span', { class: 'ra', html: '正确答案：' + r.correct.join('；') }))))
        : h('div', { class: 'all-right' }, '10 题全部答对！每一站的知识你都记得清清楚楚。');
      const certBtn = api.button(IC.cert + '<span>领取证书</span>', { className: 'btn-lg' });
      certBtn.disabled = true;
      body.append(...[
        h('div', { class: 'score-top' },
          h('div', { class: 'score-big', html: `${n}<small>/ 10</small>` }),
          h('div', { class: 'col', style: { gap: '4px' } }, h('div', { class: 'stars', html: starsHtml(stars) }), h('div', { class: 'rank' }, `获得「${rank}」证书`))),
        h('div', { class: 'sub-h' }, '各站答题情况'), bySt,
        wrongs.length ? h('div', { class: 'sub-h' }, `错题回顾（${wrongs.length} 题）`) : null, review,
        h('div', { class: 'q-acts' }, certBtn)].filter(Boolean));
      reveal(taskTitle);
      await api.say(n >= 9
        ? [{ mood: 'curious', text: `哇——答对 ${n} 题！你就是「氢元素小博士」！` }, { mood: 'happy', text: '快去领取你的证书吧～' }]
        : n >= 7
          ? [{ mood: 'happy', text: `答对 ${n} 题，真不错！再多对一两题就是小博士啦。` }, { mood: 'happy', text: '错题回顾里有正确答案，看一看，再去领证书吧～' }]
          : [{ mood: 'happy', text: `答对 ${n} 题。每一道错题都是一次复习的机会！` }, { mood: 'happy', text: '看看错题回顾，再去领证书吧～' }]);
      certBtn.disabled = false;
      api.hint(wrongs.length ? '看看各站成绩和错题回顾，再点下面的「领取证书」。' : '看完成绩，点下面的「领取证书」。');
      await api.waitClick(certBtn);

      /* ============ 证书 ============ */
      api.step(3);
      lab.hidden = true;
      const now = new Date();
      const dateStr = `${now.getFullYear()}年${now.getMonth() + 1}月${now.getDate()}日`;
      const DEF_NAME = '小小化学家';
      const NAME_MAX = 10;
      const nameInput = h('input', { id: 'cert-name', type: 'text', maxlength: String(NAME_MAX), value: Array.from(api.state.name || DEF_NAME).slice(0, NAME_MAX).join(''), 'aria-label': '证书上的名字', autocomplete: 'off', enterkeyhint: 'done' });
      // the box grows with the name, so a long name is never cut off on the screenshot
      const fitName = () => { nameInput.style.width = 'calc(' + Math.max(6, Array.from(nameInput.value).length + 1) + 'em + 16px)'; };
      const saveName = () => {
        const v = nameInput.value.trim(); const keep = v === DEF_NAME ? '' : v;
        if (typeof api.setName === 'function') api.setName(keep); else api.state.name = keep;
      };
      fitName();
      nameInput.addEventListener('input', () => { fitName(); saveName(); });
      nameInput.addEventListener('blur', () => { if (!nameInput.value.trim()) { nameInput.value = DEF_NAME; fitName(); } });
      nameInput.addEventListener('keydown', e => { if (e.key === 'Enter') nameInput.blur(); });
      const sealZone = h('div', { class: 'seal-zone dropzone', 'aria-label': '盖章处' }, h('span', null, '盖章处'));
      const sts = [];
      for (let k = 1; k <= 8; k++) sts.push(h('span', { class: 'td', html: dropSvg('') + `<b>${k}</b>` }));
      const cert = h('div', { class: 'cert', id: 'cert' },
        h('span', { class: 'wm', 'aria-hidden': 'true', html: WM }),
        h('span', { class: 'corner c1', html: dropSvg('') }), h('span', { class: 'corner c2', html: dropSvg('') }),
        h('img', { class: 'cert-headimg', src: H2.assets.head_curious || '', alt: '氢氢', draggable: 'false' }),
        h('div', { class: 'eyebrow' }, '通关证书 · 氢氢的氢元素探险'),
        h('div', { class: 'cert-title' }, rank),
        h('div', { class: 'cert-to' }, h('span', null, '授予'), nameInput),
        h('p', { class: 'cert-text' }, '完成了氢氢的氢元素探险'),
        h('div', { class: 'cert-sts', 'aria-label': '走完了全部 8 站' }, sts),
        h('div', { class: 'cert-foot' },
          h('div', { class: 'cert-meta', html: `闯关成绩：<b>${n} / 10</b> 题 <span class="stars">${starsHtml(stars)}</span><br>日期：${dateStr}` }),
          sealZone));
      const stamp = h('div', { class: 'stamp', 'aria-label': '氢氢印章：拖到证书右下角的盖章处', html: SEAL + '<span>氢氢印章</span>' });
      const again = api.button(IC.redo + '<span>再挑战一次</span>', { primary: false, className: 'again' });
      again.hidden = true;
      const view = h('div', { class: 'cert-view swap' }, cert, h('div', { class: 'cert-tools' }, stamp, again), h('p', { class: 'snap-note' }, '可以截图保存这张证书'));
      api.stage.append(view);
      api.sfx('sparkle');
      toTop();
      api.timeout(() => reveal(stamp), 450); // small phones: bring the seal and 盖章处 into view together
      const STAMP_HINT = '写上你的名字（不写也行），再把<b>氢氢印章</b>拖到证书右下角的「盖章处」，或者先点印章、再点盖章处。';
      api.hint(STAMP_HINT, 'happy');
      await api.task(resolve => {
        api.draggable(stamp, {
          zones: [sealZone],
          onMiss: () => api.hint('印章要盖在证书<b>右下角的虚线圆圈</b>「盖章处」里哦——再试一次，或者先点印章、再点盖章处。', 'happy'),
          onDrop: () => {
            stamp.classList.add('used', 'locked'); stamp.removeAttribute('tabindex');
            sealZone.classList.add('stamped'); sealZone.innerHTML = '';
            sealZone.append(h('span', { class: 'stamped-seal', html: SEAL }));
            api.sfx('pop'); api.timeout(() => api.sfx('sparkle'), 220);
            resolve();
            return true;
          },
        });
      });
      await api.wait(700);
      await api.say([
        { mood: 'curious', text: '盖好章啦！谢谢你陪我走完这趟氢元素探险～' },
        { mood: 'happy', text: '我由什么组成、氢原子长什么样、氢气怎样制取、怎样安全地使用……' },
        { mood: 'curious', text: '我身上的每一个秘密，你现在全都知道啦！' },
      ]);
      api.complete({ stars, message: `答对 ${n} / 10 题，获得「${rank}」证书！` + (n < 9 ? '答对 9 题及以上就能成为「氢元素小博士」哦。' : '') });

      /* The result card covers the certificate: add a clear 「查看我的证书」 button to it (the card's
         own close button works too). 「再挑战一次」 uses api.restart(); older engines fall back to
         the card's 「再玩一次」 button. */
      const ov = document.querySelector('.overlay');
      let engineAgain = null;
      const backToCert = () => {
        api.hint('证书可以截图保存哦！名字随时能改。想再挑战，就点「再挑战一次」。', 'curious');
        toTop();
        again.focus({ preventScroll: true });
      };
      if (ov) {
        engineAgain = Array.prototype.find.call(ov.querySelectorAll('button'), x => x.textContent.indexOf('再玩一次') >= 0) || null;
        const row = ov.querySelector('.btn-row');
        const viewBtn = h('button', { class: 'btn btn-primary', type: 'button', html: IC.cert + '<span>查看我的证书</span>' });
        viewBtn.addEventListener('click', () => { ov.remove(); backToCert(); });
        if (row) row.prepend(viewBtn);
        const x = ov.querySelector('.result-close');
        if (x) x.addEventListener('click', backToCert);
      }
      again.hidden = false;
      again.addEventListener('click', () => {
        if (typeof api.restart === 'function') api.restart();
        else if (engineAgain) engineAgain.click();
      });
    },
  });
})();

;
H2.boot();
}).catch(() => {});
</script>
</body>
</html>
